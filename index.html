class SacredScene3D {
  constructor(container, treeNodes) {
    this.container = container;
    this.treeNodes = treeNodes;
    this.nodeMap = new Map(treeNodes.map(n => [n.id, n]));
    this.scene = null;
    this.camera = null;
    this.renderer = null;
    this.raycaster = new THREE.Raycaster();
    this.mouse = new THREE.Vector2(-9999, -9999);
    this.nodeMeshes = new Map();
    this.connectionLines = [];
    this.interactiveObjects = [];
    this.hoveredNode = null;
    this.selectedNode = null;

    this.onNodeClick = null;
    this.onNodeHover = null;
    this.onScrollTravel = null; // Callback when scrolling / panning across the cosmos

    // Target focal center in 3D cosmos (LookAt)
    this.targetLookAt = new THREE.Vector3(0, 140, 0);
    this.currentLookAt = new THREE.Vector3(0, 140, 0);

    // True 3D Spherical Orbit parameters around targetLookAt
    this.orbitRadius = 240;        // Distance to target (zoom level)
    this.targetOrbitRadius = 240;
    this.theta = 0;                // Azimuth angle (radians around Y axis - 360 rotation)
    this.targetTheta = 0;
    this.phi = Math.PI * 0.44;     // Polar inclination (radians from top - vertical tilt)
    this.targetPhi = Math.PI * 0.44;

    // Dragging & Interaction State
    this.isDragging = false;
    this.dragButton = 0;           // 0: left (3D orbit/tilt), 1: middle (pan), 2: right (pan)
    this.prevMouse = { x: 0, y: 0 };
    this.mouseStartPos = { x: 0, y: 0 };
    this.hasMovedSignificantly = false;

    // Multi-touch gestures
    this.touchStartPos = { x: 0, y: 0 };
    this.prevTouchPos = { x: 0, y: 0 };
    this.touchStartTime = 0;
    this.hasTouchMoved = false;
    this.initialPinchDistance = 0;
    this.prevPinchCenter = null;

    this.init();
  }

  init() {
    const w = this.container.clientWidth || window.innerWidth;
    const h = this.container.clientHeight || window.innerHeight;

    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0x010103);
    this.scene.fog = new THREE.FogExp2(0x010103, 0.00012);

    this.camera = new THREE.PerspectiveCamera(50, w / h, 1, 10000);
    this.camera.position.set(0, 160, 400);

    this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    this.renderer.setSize(w, h);
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
    this.renderer.toneMappingExposure = 1.25;
    this.container.appendChild(this.renderer.domElement);

    // Deep Space Lighting
    this.scene.add(new THREE.AmbientLight(0xffffff, 0.95));
    const sun = new THREE.PointLight(0xff7700, 3.2, 4500);
    sun.position.set(80, 200, 300);
    this.scene.add(sun);
    const fill = new THREE.PointLight(0xff9933, 2.2, 4500);
    fill.position.set(-150, -100, -200);
    this.scene.add(fill);
    const dir = new THREE.DirectionalLight(0xffffff, 1.0);
    dir.position.set(0, 400, 500);
    this.scene.add(dir);

    // Dynamic Camera headlight ensures all planets are vibrantly illuminated
    const camLight = new THREE.PointLight(0xffeedd, 1.25, 2200);
    this.camera.add(camLight);
    this.scene.add(this.camera);

    // Build JWST Deep Space Environment
    this.buildDeepSpaceDome();
    this.buildDeepFieldGalaxies();
    this.buildCosmicParticles();
    this.initPlanetTextureCache();
    this.buildTreeIn3D();
    this.buildCyclicReturnArc();

    // Prevent default context menu so right-drag pan works seamlessly
    this.container.addEventListener('contextmenu', e => e.preventDefault());

    window.addEventListener('resize', () => this.onResize());
    this.container.addEventListener('mousemove', e => this.onMouseMove(e));
    this.container.addEventListener('mousedown', e => this.onMouseDown(e));
    window.addEventListener('mouseup', () => { this.isDragging = false; });
    this.container.addEventListener('click', e => this.onClick(e));
    this.container.addEventListener('wheel', e => this.onWheel(e), { passive: false });

    // Multi-touch controls
    this.container.addEventListener('touchstart', e => this.onTouchStart(e), { passive: false });
    this.container.addEventListener('touchmove', e => this.onTouchMove(e), { passive: false });
    this.container.addEventListener('touchend', e => this.onTouchEnd(e), { passive: false });
    this.container.addEventListener('touchcancel', () => {
      this.isDragging = false;
      this.initialPinchDistance = 0;
      this.prevPinchCenter = null;
    });

    this.clock = new THREE.Clock();
    this.animate();
  }

  buildDeepSpaceDome() {
    // Panoramic Skydome mapped with the JWST Deep Space field image
    const loader = new THREE.TextureLoader();
    loader.load('assets/images/deep_space.png', (tex) => {
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(3, 2);
      const skyGeo = new THREE.SphereGeometry(4600, 36, 24);
      const skyMat = new THREE.MeshBasicMaterial({
        map: tex,
        side: THREE.BackSide,
        depthWrite: false
      });
      this.skyDome = new THREE.Mesh(skyGeo, skyMat);
      this.skyDome.renderOrder = -1000;
      this.scene.add(this.skyDome);
    });
  }

  createJWSTSpikeStarTexture() {
    const c = document.createElement('canvas');
    c.width = 128; c.height = 128;
    const ctx = c.getContext('2d');
    const cx = 64, cy = 64;

    // Glowing core
    const rad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 32);
    rad.addColorStop(0, 'rgba(255, 255, 255, 1)');
    rad.addColorStop(0.18, 'rgba(215, 235, 255, 0.9)');
    rad.addColorStop(0.45, 'rgba(100, 160, 255, 0.3)');
    rad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = rad;
    ctx.fillRect(0, 0, 128, 128);

    // JWST 6-point razor diffraction spikes
    const drawSpike = (angle, len, width, alpha) => {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle);
      const spGrad = ctx.createLinearGradient(0, -width/2, 0, width/2);
      spGrad.addColorStop(0, 'rgba(255,255,255,0)');
      spGrad.addColorStop(0.5, `rgba(215, 240, 255, ${alpha})`);
      spGrad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = spGrad;
      ctx.beginPath();
      ctx.moveTo(-len, 0);
      ctx.lineTo(0, width/2);
      ctx.lineTo(len, 0);
      ctx.lineTo(0, -width/2);
      ctx.closePath();

  // ------------------------------------------------------------
  pseudoNoise(x, y) {
    const n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
    return n - Math.floor(n);
  }

  smoothNoise(x, y) {
    const i = Math.floor(x), j = Math.floor(y);
    const fx = x - i, fy = y - j;
    const sx = fx * fx * (3 - 2 * fx);
    const sy = fy * fy * (3 - 2 * fy);

    const n00 = this.pseudoNoise(i, j);
    const n10 = this.pseudoNoise(i + 1, j);
    const n01 = this.pseudoNoise(i, j + 1);
    const n11 = this.pseudoNoise(i + 1, j + 1);

    const nx0 = n00 * (1 - sx) + n10 * sx;
    const nx1 = n01 * (1 - sx) + n11 * sx;
    return nx0 * (1 - sy) + nx1 * sy;
  }

  fbm(x, y, octaves = 5) {
    let val = 0, amp = 0.5, freq = 1;
    for (let o = 0; o < octaves; o++) {
      val += amp * this.smoothNoise(x * freq, y * freq);
      freq *= 2.05;
      amp *= 0.5;
    }
    return val;
  }

  createEarthTexture() {

    for (let y = 0; y < 256; y++) {
      const v = y / 256;
      const poleDist = Math.abs(v - 0.5) * 2;
      for (let x = 0; x < 512; x++) {
        const u = x / 512;

        const elev = this.fbm(u * 7, v * 3.5, 5);
        const cloud = this.fbm(u * 9 + 4.2, v * 4.5, 4);

        let r, g, b;
        if (poleDist > 0.88 + elev * 0.1) {
          r = 230; g = 240; b = 252;

        d[idx] = r; d[idx+1] = g; d[idx+2] = b; d[idx+3] = 255;

  getPlanetTypeForNode(node) {
    const id = node.id || '';
    const cat = node.category || '';

    // Direct mythological & visual alignment with reference image
    if (id === 'brahman') return 'amber_desert';
    if (id === 'shiva' || id === 'parvati' || id === 'ganga' || id === 'himalayas') return 'ice_cryo';
    if (id === 'kali' || id === 'durga' || id === 'lanka_war' || id === 'kurukshetra' || id === 'kurukshetra_war' || id === 'kali_yuga') return 'volcanic';
    if (id === 'vishnu' || id === 'shesha' || id === 'krishna' || id === 'indra' || id === 'dvapara_yuga') return 'purple_gas';
    if (id === 'prithvi' || id === 'manu' || id === 'sita' || id === 'matsya' || id === 'varuna') return 'earth';
    if (id === 'surya' || id === 'aditi' || id === 'satya_yuga' || id === 'hiranyagarbha' || id === 'brahma') return 'amber_desert';
    if (id === 'treta_yuga' || id === 'vanara' || id === 'ayodhya' || id === 'kadru') return 'verdant';
    if (id === 'mahapralaya' || id === 'kalki' || id === 'diti') return 'basalt_moon';
    if (id === 'narasimha' || id === 'parashurama' || id === 'ravana') return 'crimson_rock';

    if (cat === 'war') return 'volcanic';
    if (cat === 'avatar') {
      const list = ['earth', 'volcanic', 'purple_gas', 'ice_cryo'];
      let hash = 0;
      for (let i = 0; i < id.length; i++) hash = ((hash << 5) - hash) + id.charCodeAt(i);
      return list[Math.abs(hash) % list.length];
    }

    const allTypes = ['earth', 'volcanic', 'purple_gas', 'ice_cryo', 'amber_desert', 'verdant', 'basalt_moon', 'crimson_rock'];
    let hash = 0;
    for (let i = 0; i < id.length; i++) hash = ((hash << 5) - hash) + id.charCodeAt(i);
    return allTypes[Math.abs(hash) % allTypes.length];
  }

        emissiveIntensity: 0.65,
        metalness: 0.88,
        roughness: 0.22
      });
      const ringMesh = new THREE.Mesh(ringGeo, ringMat);
      grp.add(ringMesh);

      // 3. Tilted Concentric Planetary Rings (for Gas Giants)
      if (pType === 'purple_gas') {
        const ringDiskGeo = new THREE.RingGeometry(11.0, 18.0, 64);
        const ringDiskMat = new THREE.MeshBasicMaterial({
          map: this.planetTextureCache.get('ring_texture'),
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.92,
          depthWrite: false
        });
        const ringDisk = new THREE.Mesh(ringDiskGeo, ringDiskMat);
        ringDisk.rotation.x = Math.PI * 0.42;
        ringDisk.rotation.y = Math.PI * 0.16;
        grp.add(ringDisk);
      }

      // Store planet mesh for axial rotation animation
      grp.userData.planetMesh = planetMesh;
      grp.userData.spinSpeed = 0.003 + (Math.sin(node.x * 0.05 + node.y * 0.05) * 0.0018);

      // Label sprite in Modern Hindi (positioned above the golden ring)
      const title = (node.title_hi || node.title);
      const epoch = (node.epoch_hi || node.epoch);
      const sprite = this.createLabelSprite(title, node.sanskrit, epoch);
      sprite.position.set(0, 18.5, 0);
      grp.add(sprite);

      this.scene.add(grp);
      this.nodeMeshes.set(node.id, grp);
      this.interactiveObjects.push(planetMesh);
      planetMesh.userData = { parentGroup: grp, nodeData: node };

      // Radiant golden branch lines connecting parent to child
      if (node.parentId && this.nodeMap.has(node.parentId)) {
        const parent = this.nodeMap.get(node.parentId);
        const p1 = new THREE.Vector3(parent.x, parent.y, parent.z);
        const p2 = new THREE.Vector3(node.x, node.y, node.z);
        const mid = new THREE.Vector3((p1.x + p2.x) / 2, (p1.y + p2.y) / 2 + 10, (p1.z + p2.z) / 2);
        const curve = new THREE.QuadraticBezierCurve3(p1, mid, p2);
        const tubeGeo = new THREE.TubeGeometry(curve, 18, 0.75, 8, false);
        const tubeMat = new THREE.MeshStandardMaterial({
          color: 0xffaa22,
          emissive: 0xff6600,
          emissiveIntensity: 0.65,
          metalness: 0.85,
          roughness: 0.25
        });
        const tubeMesh = new THREE.Mesh(tubeGeo, tubeMat);
        this.scene.add(tubeMesh);
        this.connectionLines.push(tubeMesh);
      }
    });
  }

  buildCyclicReturnArc() {
    const pStart = new THREE.Vector3(0, -2220, 3260);
    const pEnd = new THREE.Vector3(0, 140, 0);
    const pMid1 = new THREE.Vector3(380, -900, 2400);
    const pMid2 = new THREE.Vector3(380, 200, 1000);
    const curve = new THREE.CubicBezierCurve3(pStart, pMid1, pMid2, pEnd);
    const tubeGeo = new THREE.TubeGeometry(curve, 64, 1.8, 12, false);
    const tubeMat = new THREE.MeshStandardMaterial({
      color: 0xffb74d,
      emissive: 0xff7700,
      emissiveIntensity: 0.8,
      roughness: 0.2,
      metalness: 0.9,
      wireframe: true
    });
    const returnMesh = new THREE.Mesh(tubeGeo, tubeMat);
    this.scene.add(returnMesh);

    const coreGeo = new THREE.TubeGeometry(curve, 48, 0.6, 8, false);
    const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 });
    this.scene.add(new THREE.Mesh(coreGeo, coreMat));
  }

  createChakraMesh() {
    const g = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: 0xff9933, emissive: 0xff5500, emissiveIntensity: 0.5, metalness: 0.9 });
    g.add(new THREE.Mesh(new THREE.TorusGeometry(10, 0.6, 16, 36), mat));
    for (let i = 0; i < 8; i++) {
      const s = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 19, 6), mat);
      s.rotation.z = (i / 8) * Math.PI * 2;
      g.add(s);
    }
    return g;
  }
  createLotusMesh() {
    const g = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: 0xff7700, emissive: 0x992200, roughness: 0.3, side: THREE.DoubleSide });
    for (let i = 0; i < 8; i++) {
      const shape = new THREE.Shape();
      shape.moveTo(0,0);
      shape.quadraticCurveTo(3,6,0,10);
      shape.quadraticCurveTo(-3,6,0,0);
      const p = new THREE.Mesh(new THREE.ShapeGeometry(shape), mat);
      p.rotation.y = (i/8)*Math.PI*2;
      p.rotation.x = Math.PI/4;
      g.add(p);
    }
    return g;
  }
  createMandalaMesh() {
    const g = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: 0xff9933, emissive: 0xff5500, emissiveIntensity: 0.4, metalness: 0.8 });
    g.add(new THREE.Mesh(new THREE.TorusGeometry(8, 0.4, 16, 32), mat));
    g.add(new THREE.Mesh(new THREE.TorusGeometry(4.5, 0.3, 16, 32), mat));
    for (let i = 0; i < 12; i++) {
      const s = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 15, 6), mat);
      s.rotation.z = (i / 12) * Math.PI * 2;
      g.add(s);
    }
    return g;
  }

  createLabelSprite(title, sanskrit, epoch) {
    const c = document.createElement('canvas');
    c.width = 720; c.height = 200;
    const ctx = c.getContext('2d');
    ctx.fillStyle = 'rgba(8,8,12,0.92)';
    ctx.strokeStyle = 'rgba(255,119,0,0.85)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.roundRect(10, 10, 700, 180, 20);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#FF7700';
    ctx.fillRect(30, 10, 660, 4);

    if (sanskrit) {
      ctx.font = "600 22px 'Martel', 'Noto Serif Devanagari', serif";
      ctx.fillStyle = '#FF9933';
      ctx.textAlign = 'center';
      ctx.fillText(sanskrit.substring(0, 42), 360, 52);
    }
    ctx.font = "800 32px 'Rozha One', 'Noto Serif Devanagari', serif";
    ctx.fillStyle = '#FFFFFF';
    ctx.textAlign = 'center';
    ctx.fillText(title.length > 32 ? title.substring(0, 30) + '...' : title, 360, 108);

    if (epoch) {
      ctx.font = "500 18px 'Poppins', 'Noto Serif Devanagari', sans-serif";
      ctx.fillStyle = '#FFB74D';
      ctx.textAlign = 'center';
      ctx.fillText(epoch.substring(0, 44), 360, 154);
    }

    const tex = new THREE.CanvasTexture(c);
    tex.minFilter = THREE.LinearFilter;
    const spMat = new THREE.SpriteMaterial({ map: tex, transparent: true });
    const sp = new THREE.Sprite(spMat);
    sp.scale.set(40, 11.1, 1);
    return sp;
  }

  flyToNode(nodeData) {
    this.selectedNode = nodeData;
    this.targetLookAt.set(nodeData.x, nodeData.y, nodeData.z);
    this.targetOrbitRadius = 150; // crisp intimate focus
    this.targetPhi = Math.PI * 0.44;
  }

  onResize() {
    const w = this.container.clientWidth || window.innerWidth;
    const h = this.container.clientHeight || window.innerHeight;
    this.camera.aspect = w / h;
    this.camera.updateProjectionMatrix();
    this.renderer.setSize(w, h);
  }

  onMouseDown(e) {
    this.isDragging = true;
    this.dragButton = e.button;
    this.prevMouse = { x: e.clientX, y: e.clientY };
    this.mouseStartPos = { x: e.clientX, y: e.clientY };
    this.hasMovedSignificantly = false;
  }

  onMouseMove(e) {
    const rect = this.container.getBoundingClientRect();
    this.mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    this.mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

    if (this.isDragging) {
      const dx = e.clientX - this.prevMouse.x;
      const dy = e.clientY - this.prevMouse.y;
      const totalDist = Math.hypot(e.clientX - this.mouseStartPos.x, e.clientY - this.mouseStartPos.y);
      if (totalDist > 5) this.hasMovedSignificantly = true;

      const panSpeed = (this.orbitRadius / 650) * 0.9;
      const vRight = new THREE.Vector3();
      const vUp = new THREE.Vector3();
      this.camera.matrixWorld.extractBasis(vRight, vUp, new THREE.Vector3());

      // Direct Left/Right and Up/Down pan across the cosmos
      this.targetLookAt.addScaledVector(vRight, -dx * panSpeed);
      this.targetLookAt.addScaledVector(vUp, dy * panSpeed);

      // Subtle natural rotational parallax when scrolling left and right
      this.targetTheta -= dx * 0.0018;
      this.targetPhi = Math.max(0.08, Math.min(Math.PI - 0.08, this.targetPhi - dy * 0.0018));

      this.targetLookAt.x = Math.max(-650, Math.min(650, this.targetLookAt.x));
      this.targetLookAt.y = Math.max(-2350, Math.min(250, this.targetLookAt.y));
      this.targetLookAt.z = Math.max(-100, Math.min(3400, this.targetLookAt.z));

      if (this.onScrollTravel) this.onScrollTravel(this.targetLookAt);
      this.prevMouse = { x: e.clientX, y: e.clientY };
    }

    // Raycast hover when not dragging
    if (!this.isDragging) {
      this.raycaster.setFromCamera(this.mouse, this.camera);
      const intersects = this.raycaster.intersectObjects(this.interactiveObjects);
      if (intersects.length > 0) {
        const obj = intersects[0].object;
        const nd = obj.userData.nodeData;
        if (this.hoveredNode !== nd) {
          this.hoveredNode = nd;
          this.container.style.cursor = 'pointer';
          if (this.onNodeHover) this.onNodeHover(nd, e);
        }
      } else {
        if (this.hoveredNode) {
          this.hoveredNode = null;
          this.container.style.cursor = 'default';
          if (this.onNodeHover) this.onNodeHover(null, null);
        }
      }
    }
  }

  onClick(e) {
    if (this.hasMovedSignificantly) return;
    this.raycaster.setFromCamera(this.mouse, this.camera);
    const intersects = this.raycaster.intersectObjects(this.interactiveObjects);
    if (intersects.length > 0) {
      const obj = intersects[0].object;
      const nd = obj.userData.nodeData;
      if (this.onNodeClick) this.onNodeClick(nd);
    }
  }

  onWheel(e) {
    if (e.cancelable) e.preventDefault();

    // 1. Zoom in/out at current location (Ctrl / Meta / Alt / pinch)
    if (e.ctrlKey || e.metaKey || e.altKey) {
      this.targetOrbitRadius = Math.max(50, Math.min(1400, this.targetOrbitRadius + e.deltaY * 0.8));
      return;
    }

    // 2. Scroll Left & Right across the 3D cosmos (Horizontal wheel or Shift + wheel)
    if (Math.abs(e.deltaX) > Math.abs(e.deltaY) || e.shiftKey) {
      const hDelta = e.shiftKey ? e.deltaY : e.deltaX;
      const vRight = new THREE.Vector3();
      this.camera.matrixWorld.extractBasis(vRight, new THREE.Vector3(), new THREE.Vector3());
      this.targetLookAt.addScaledVector(vRight, hDelta * 0.75);
      this.targetLookAt.x = Math.max(-650, Math.min(650, this.targetLookAt.x));
      if (this.onScrollTravel) this.onScrollTravel(this.targetLookAt);
      return;
    }

    // 3. Scroll Down & Up along the cosmic tree trajectory
    const travelSpeed = 0.95;
    this.targetLookAt.y = Math.max(-2260, Math.min(180, this.targetLookAt.y - e.deltaY * 0.72 * travelSpeed));
    this.targetLookAt.z = Math.max(-50, Math.min(3300, this.targetLookAt.z + e.deltaY * 1.02 * travelSpeed));

    if (this.onScrollTravel) {
      this.onScrollTravel(this.targetLookAt);
    }
  }

  onTouchStart(e) {
    if (e.touches.length === 1) {
      const t = e.touches[0];
      this.isDragging = true;
      this.hasTouchMoved = false;
      this.touchStartPos = { x: t.clientX, y: t.clientY };
      this.prevTouchPos = { x: t.clientX, y: t.clientY };
      this.touchStartTime = Date.now();
    } else if (e.touches.length === 2) {
      this.isDragging = false;
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      this.initialPinchDistance = Math.hypot(dx, dy);
      this.prevPinchCenter = {
        x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
        y: (e.touches[0].clientY + e.touches[1].clientY) / 2
      };
    }
  }

  onTouchMove(e) {
    if (e.cancelable) e.preventDefault();
    if (e.touches.length === 1 && this.isDragging) {
      const t = e.touches[0];
      const dx = t.clientX - this.prevTouchPos.x;
      const dy = t.clientY - this.prevTouchPos.y;
      const totalDist = Math.hypot(t.clientX - this.touchStartPos.x, t.clientY - this.touchStartPos.y);
      if (totalDist > 6) this.hasTouchMoved = true;

      const panSpeed = (this.orbitRadius / 600) * 0.85;
      const vRight = new THREE.Vector3();
      const vUp = new THREE.Vector3();
      this.camera.matrixWorld.extractBasis(vRight, vUp, new THREE.Vector3());

      // Single touch scrolls directly Left, Right, Up, and Down in 3D
      this.targetLookAt.addScaledVector(vRight, -dx * panSpeed);
      this.targetLookAt.addScaledVector(vUp, dy * panSpeed);

      this.targetTheta -= dx * 0.002;
      this.targetPhi = Math.max(0.08, Math.min(Math.PI - 0.08, this.targetPhi - dy * 0.002));

      this.targetLookAt.x = Math.max(-650, Math.min(650, this.targetLookAt.x));
      this.targetLookAt.y = Math.max(-2350, Math.min(250, this.targetLookAt.y));
      this.targetLookAt.z = Math.max(-100, Math.min(3400, this.targetLookAt.z));

      if (this.onScrollTravel) this.onScrollTravel(this.targetLookAt);
      this.prevTouchPos = { x: t.clientX, y: t.clientY };
    } else if (e.touches.length === 2) {
      const t0 = e.touches[0], t1 = e.touches[1];
      const dx = t0.clientX - t1.clientX;
      const dy = t0.clientY - t1.clientY;
      const curDist = Math.hypot(dx, dy);

      // 1. Pinch zoom in and out at current location
      if (this.initialPinchDistance > 0) {
        const pinchDelta = (curDist - this.initialPinchDistance) * 1.5;
        this.targetOrbitRadius = Math.max(50, Math.min(1400, this.targetOrbitRadius - pinchDelta));
      }
      this.initialPinchDistance = curDist;

      // 2. Two-finger Pan up/down/left/right across every location
      const curCenter = { x: (t0.clientX + t1.clientX) / 2, y: (t0.clientY + t1.clientY) / 2 };
      if (this.prevPinchCenter) {
        const cdx = curCenter.x - this.prevPinchCenter.x;
        const cdy = curCenter.y - this.prevPinchCenter.y;
        const panSpeed = (this.orbitRadius / 700) * 0.75;
        const vRight = new THREE.Vector3();
        const vUp = new THREE.Vector3();
        this.camera.matrixWorld.extractBasis(vRight, vUp, new THREE.Vector3());
        this.targetLookAt.addScaledVector(vRight, -cdx * panSpeed);
        this.targetLookAt.addScaledVector(vUp, cdy * panSpeed);

        this.targetLookAt.y = Math.max(-2350, Math.min(250, this.targetLookAt.y));
        this.targetLookAt.z = Math.max(-100, Math.min(3400, this.targetLookAt.z));
        if (this.onScrollTravel) this.onScrollTravel(this.targetLookAt);
      }
      this.prevPinchCenter = curCenter;
    }
  }

  onTouchEnd(e) {
    if (!this.hasTouchMoved && (Date.now() - this.touchStartTime < 350)) {
      const rect = this.container.getBoundingClientRect();
      this.mouse.x = ((this.touchStartPos.x - rect.left) / rect.width) * 2 - 1;
      this.mouse.y = -((this.touchStartPos.y - rect.top) / rect.height) * 2 + 1;
      this.raycaster.setFromCamera(this.mouse, this.camera);
      const intersects = this.raycaster.intersectObjects(this.interactiveObjects);
      if (intersects.length > 0) {
        const obj = intersects[0].object;
        const nd = obj.userData.nodeData;
        if (this.onNodeClick) this.onNodeClick(nd);
      }
    }
    this.isDragging = false;
    this.initialPinchDistance = 0;
    this.prevPinchCenter = null;
  }

  animate() {
    requestAnimationFrame(() => this.animate());
    const dt = this.clock.getDelta();
    const time = this.clock.getElapsedTime();

    // Smooth lerping for orbital parameters
    this.orbitRadius += (this.targetOrbitRadius - this.orbitRadius) * 0.08;
    this.theta += (this.targetTheta - this.theta) * 0.08;
    this.phi += (this.targetPhi - this.phi) * 0.08;
    this.currentLookAt.lerp(this.targetLookAt, 0.06);

    // Compute camera position via spherical coordinates around currentLookAt
    const sinPhi = Math.sin(this.phi);
    const cosPhi = Math.cos(this.phi);
    const sinTheta = Math.sin(this.theta);
    const cosTheta = Math.cos(this.theta);

    const camX = this.currentLookAt.x + this.orbitRadius * sinPhi * sinTheta;
    const camY = this.currentLookAt.y + this.orbitRadius * cosPhi;
    const camZ = this.currentLookAt.z + this.orbitRadius * sinPhi * cosTheta;

    this.camera.position.set(camX, camY, camZ);
    this.camera.lookAt(this.currentLookAt);

    // Rotate celestial planets on their Y axis
    this.nodeMeshes.forEach(grp => {
      if (grp.userData.planetMesh) {
        grp.userData.planetMesh.rotation.y += grp.userData.spinSpeed || 0.0035;
      }
      grp.children.forEach(ch => {
        if (ch.isGroup) ch.rotation.z += 0.015;
      });
    });

    if (this.particles) {
      this.particles.rotation.y = time * 0.006;
    }
    if (this.skyDome) {
      this.skyDome.rotation.y += 0.00008;
    }
    if (this.deepFieldGroup) {
      this.deepFieldGroup.rotation.y = time * 0.003;
    }

    this.renderer.render(this.scene, this.camera);
  }
}

// ============================================================
// SACRED TREE MAP CONTROLLER (Interactive 2D Architecture)
// ============================================================
class SacredTreeMap {
  constructor(container, treeNodes, onSelectNode) {
    this.container = container;
    this.treeNodes = treeNodes;
    this.nodeMap = new Map(treeNodes.map(n => [n.id, n]));
    this.onSelectNode = onSelectNode;
    this.activeSearch = '';
    this.viewMode = window.innerWidth <= 768 ? 'list' : 'diagram';
    this.render();
  }

  render() {
    const isHi = window.currentLang === 'hi';
    const dict = isHi ? I18N.hi : I18N.en;

    this.container.innerHTML = `
      <div class="tree-modal-header">
        <div class="tree-modal-title-box">
          <span class="tree-modal-title">${dict.treeMapTitle}</span>
          <span class="tree-modal-subtitle">${dict.treeMapSubtitle}</span>
        </div>
        <div class="tree-view-tabs">
          <button class="tree-tab-btn ${this.viewMode === 'list' ? 'active' : ''}" id="tree-tab-list">${dict.treeMapTabList}</button>
          <button class="tree-tab-btn ${this.viewMode === 'diagram' ? 'active' : ''}" id="tree-tab-diagram">${dict.treeMapTabDiagram}</button>
        </div>
        <div class="tree-modal-actions">
          <input type="text" class="tree-search-input" id="tree-map-search" placeholder="${dict.treeMapSearchPlaceholder}" />
          <button class="tree-close-btn" id="tree-map-close" title="${dict.modalCloseTitle}">${ICONS.close}</button>
        </div>
      </div>
      <div class="tree-viewport" id="tree-map-viewport">
        <div class="tree-diagram-container" id="tree-diagram-root" style="display: ${this.viewMode === 'diagram' ? 'flex' : 'none'};">
          ${this.buildTreeHTML()}
        </div>
        <div class="tree-list-container" id="tree-list-root" style="display: ${this.viewMode === 'list' ? 'flex' : 'none'};">
          ${this.buildListHTML('')}
        </div>
      </div>
    `;

    document.getElementById('tree-map-close').addEventListener('click', () => this.close());

    // Tab switching
    const tabList = document.getElementById('tree-tab-list');
    const tabDiagram = document.getElementById('tree-tab-diagram');
    const diagramRoot = document.getElementById('tree-diagram-root');
    const listRoot = document.getElementById('tree-list-root');

    const setViewMode = (mode) => {
      this.viewMode = mode;
      if (mode === 'list') {
        tabList.classList.add('active');
        tabDiagram.classList.remove('active');
        diagramRoot.style.display = 'none';
        listRoot.style.display = 'flex';
      } else {
        tabDiagram.classList.add('active');
        tabList.classList.remove('active');
        diagramRoot.style.display = 'flex';
        listRoot.style.display = 'none';
      }
    };

    tabList.addEventListener('click', () => setViewMode('list'));
    tabDiagram.addEventListener('click', () => setViewMode('diagram'));

    // Search within tree map
    const searchInput = document.getElementById('tree-map-search');
    searchInput.addEventListener('input', (e) => {
      const q = normalizeText(e.target.value);
      this.activeSearch = q;

      // Filter diagram boxes
      this.container.querySelectorAll('.tree-node-box').forEach(box => {
        const id = box.getAttribute('data-id');
        const node = this.nodeMap.get(id);
        if (!q) {
          box.style.opacity = '1';
          box.style.borderColor = 'var(--border-dark)';
        } else if (node && (
          normalizeText(node.title).includes(q) ||
          normalizeText(node.title_hi || '').includes(q) ||
          normalizeText(node.sanskrit || '').includes(q) ||
          normalizeText(node.epoch || '').includes(q) ||
          normalizeText(node.epoch_hi || '').includes(q)
        )) {
          box.style.opacity = '1';
          box.style.borderColor = 'var(--saffron-bright)';
        } else {
          box.style.opacity = '0.35';
          box.style.borderColor = 'var(--border-dark)';
        }
      });

      // Filter list view
      listRoot.innerHTML = this.buildListHTML(q);
      this.wireListCardClicks();
    });

    // Node click handlers in diagram
    this.container.querySelectorAll('.tree-node-box').forEach(box => {
      box.addEventListener('click', () => {
        const id = box.getAttribute('data-id');
        const node = this.nodeMap.get(id);
        if (node && this.onSelectNode) {
          this.close();
          this.onSelectNode(node);
        }
      });
    });

    // Wire list clicks initially
    this.wireListCardClicks();

    // Return cycle card click
    const returnCard = this.container.querySelector('.tree-return-card');
    if (returnCard) {
      returnCard.addEventListener('click', () => {
        const brahman = this.nodeMap.get('brahman');
        if (brahman && this.onSelectNode) {
          this.close();
          this.onSelectNode(brahman);
        }
      });
    }
  }

  wireListCardClicks() {
    this.container.querySelectorAll('.tree-list-item-card').forEach(card => {
      card.addEventListener('click', () => {
        const id = card.getAttribute('data-id');
        const node = this.nodeMap.get(id);
        if (node && this.onSelectNode) {
          this.close();
          this.onSelectNode(node);
        }
      });
    });
  }

  buildListHTML(q) {
    const isHi = window.currentLang === 'hi';
    const dict = isHi ? I18N.hi : I18N.en;
    const groups = [
      { key: 'cosmos', title: dict.treeGroups.cosmos, icon: ICONS.cosmos },
      { key: 'divine', title: dict.treeGroups.divine, icon: ICONS.divine },
      { key: 'avatar', title: dict.treeGroups.avatar, icon: ICONS.avatar },
      { key: 'lineage', title: dict.treeGroups.lineage, icon: ICONS.lineage },
      { key: 'war', title: dict.treeGroups.war, icon: ICONS.war },
      { key: 'yuga', title: dict.treeGroups.yuga, icon: ICONS.yuga },
      { key: 'scripture', title: dict.treeGroups.scripture, icon: ICONS.scripture }
    ];

    let html = '';

    groups.forEach(g => {
      let matchingNodes = this.treeNodes.filter(n => n.category === g.key);
      if (q) {
        matchingNodes = matchingNodes.filter(n => 
          normalizeText(n.title).includes(q) ||
          normalizeText(n.title_hi || '').includes(q) ||
          normalizeText(n.sanskrit || '').includes(q) ||
          normalizeText(n.epoch || '').includes(q) ||
          normalizeText(n.epoch_hi || '').includes(q)
        );
      }
      if (matchingNodes.length === 0) return;

      html += `
        <div class="tree-list-group">
          <div class="tree-list-group-title">
            <span>${g.icon}</span>
            <span>${g.title} (${matchingNodes.length})</span>
          </div>
          ${matchingNodes.map(n => {
            const title = (isHi && n.title_hi) ? n.title_hi : n.title;
            const epoch = (isHi && n.epoch_hi) ? n.epoch_hi : (n.epoch || '');
            const ic = ICONS[n.category] || ICONS.cosmos;
            return `
              <div class="tree-list-item-card" data-id="${n.id}">
                <div style="display:flex; align-items:center; gap:12px; min-width:0;">
                  <span style="color:var(--saffron-bright); flex-shrink:0;">${ic}</span>
                  <div style="min-width:0;">
                    <div class="tree-list-card-title">${title}</div>
                    <div class="tree-list-card-sanskrit">${n.sanskrit || ''}</div>
                    <div class="tree-list-card-epoch">${epoch}</div>
                  </div>
                </div>
                <span class="card-arrow" style="flex-shrink:0;">${ICONS.arrowRight}</span>

        </div>
      `;
    });

    if (!html) {
      html = `<div style="text-align:center; padding:30px; color:var(--text-muted);">${isHi ? 'खोज के अनुसार कोई पवित्र पड़ाव नहीं मिला।' : 'No sacred milestones matched your search.'}</div>`;

// DETAIL MODAL VIEWER
// ============================================================
class SacredModalViewer {
  constructor(container, onDrillDown) {
    this.container = container;
    this.onDrillDown = onDrillDown;
    this.render();
  }

  render() {
    this.container.className = 'modal-container';
    this.container.innerHTML = `
      <div class="modal-backdrop" id="modal-backdrop"></div>
      <div class="modal-drawer" id="modal-drawer">
        <div class="drawer-drag-handle" id="drawer-drag-handle"></div>
        <div class="drawer-header">
          <div class="drawer-badges">
            <span class="drawer-cat-badge" id="modal-category"></span>
            <span class="drawer-epoch-badge" id="modal-epoch"></span>
          </div>
          <button class="drawer-close-btn" id="modal-close-btn" title="Close Lore">${ICONS.close}</button>
        </div>
        <div class="drawer-scroll-body" id="modal-body"></div>
      </div>
    `;

    document.getElementById('modal-close-btn').addEventListener('click', () => this.close());
    document.getElementById('modal-backdrop').addEventListener('click', () => this.close());
    const handle = document.getElementById('drawer-drag-handle');
    if (handle) handle.addEventListener('click', () => this.close());
  }

  show(nodeData, allNodesMap) {
    this.currentNodeData = nodeData;
    this.allNodesMap = allNodesMap;
    const isHi = window.currentLang === 'hi';
    const title = (isHi && nodeData.title_hi) ? nodeData.title_hi : nodeData.title;
    const epoch = (isHi && nodeData.epoch_hi) ? nodeData.epoch_hi : (nodeData.epoch || '');
    const summary = (isHi && nodeData.summary_hi) ? nodeData.summary_hi : (nodeData.summary || '');
    const quote = (isHi && nodeData.quote_hi) ? nodeData.quote_hi : (nodeData.quote || '');
    const content = (isHi && nodeData.content_hi) ? nodeData.content_hi : (nodeData.content || '');

    const catBadge = document.getElementById('modal-category');
    if (catBadge) {
      catBadge.textContent = isHi && I18N.hi.categories[nodeData.category] 
        ? I18N.hi.categories[nodeData.category].toUpperCase() 
        : (nodeData.category || '').toUpperCase();
    }
    const epochBadge = document.getElementById('modal-epoch');
    if (epochBadge) epochBadge.textContent = epoch;

    const modalLangBtnText = document.getElementById('modal-lang-text');
    if (modalLangBtnText) {
      modalLangBtnText.textContent = isHi ? 'English' : 'हिन्दी';
    }

    let imageHtml = '';
    if (nodeData.image) {
      imageHtml = `
        <div class="drawer-artwork-frame">
          <img src="${nodeData.image}" alt="${nodeData.title}" class="drawer-image" />
          <div class="artwork-caption">${nodeData.title} · Sacred Chronicle</div>
        </div>
      `;
    }

    let quoteHtml = '';
    if (nodeData.quote) {
      quoteHtml = `<div class="drawer-quote"><p>"${nodeData.quote}"</p></div>`;
    }

    let childrenHtml = '';
    if (nodeData.childrenIds && nodeData.childrenIds.length > 0 && allNodesMap) {
      const childCards = nodeData.childrenIds.map(cid => {
        const c = allNodesMap.get(cid);
        if (!c) return '';
        const ic = ICONS[c.category] || ICONS.cosmos;
        return `
          <button class="child-node-card" data-id="${c.id}">
            <div style="display:flex; align-items:center; gap:10px;">
              <span style="color:var(--saffron-bright);">${ic}</span>
              <div>
                <div class="card-title">${(isHi && c.title_hi) ? c.title_hi : c.title}</div>
                <div class="card-sanskrit">${c.sanskrit || ''}</div>
              </div>
            </div>
            <span class="card-arrow">${ICONS.arrowRight}</span>
          </button>
        `;
      }).join('');

      childrenHtml = `
        <div class="sub-events-section">
          <div class="sub-events-heading">
            <span style="width:8px;height:8px;border-radius:50%;background:var(--saffron-bright);box-shadow:0 0 8px var(--saffron-glow);"></span>
            <span>${isHi ? 'प्रत्यक्ष परंपरा एवं प्राकट्य' : 'Direct Lineages & Manifestations'}</span>
          </div>
          <div class="sub-events-grid">${childCards}</div>
        </div>
      `;
    }

    const captionText = isHi ? (title + ' · पवित्र आख्यान') : (title + ' · Sacred Chronicle');
    const enrichedImageHtml = nodeData.image ? `
      <div class="drawer-artwork-frame">
        <img src="${nodeData.image}" alt="${title}" class="drawer-image" />
        <div class="artwork-caption">${captionText}</div>
      </div>
    ` : '';

    const enrichedQuoteHtml = quote ? `<div class="drawer-quote"><p>"${quote}"</p></div>` : '';

    document.getElementById('modal-body').innerHTML = `
      <h2 class="drawer-title">${title}</h2>
      ${nodeData.sanskrit ? `<div class="drawer-sanskrit">${nodeData.sanskrit}</div>` : ''}
      ${enrichedImageHtml}
      ${enrichedQuoteHtml}
      <div class="drawer-summary">${summary}</div>
      <div class="drawer-content-text">${content}</div>
      ${childrenHtml}
    `;

    // Hook child cards
    document.querySelectorAll('.child-node-card').forEach(btn => {
      btn.addEventListener('click', () => {
        const cid = btn.getAttribute('data-id');
        const child = allNodesMap.get(cid);
        if (child && this.onDrillDown) this.onDrillDown(child);
      });
    });

    this.container.classList.add('active');
    setTimeout(() => {
      document.getElementById('modal-backdrop').classList.add('visible');
      document.getElementById('modal-drawer').classList.add('open');
    }, 10);
  }

  close() {
    document.getElementById('modal-drawer').classList.remove('open');
    document.getElementById('modal-backdrop').classList.remove('visible');
    setTimeout(() => { this.container.classList.remove('active'); }, 300);
  }
}


  // ============================================================
  // APP INITIALIZATION & MANUAL EVENT WIRING (No Auto-Timers)
  // ============================================================
  window.addEventListener('DOMContentLoaded', () => {
    console.log("Initializing Sanatana Dharma 3D Universe and Tree Map...");

    const canvasContainer = document.getElementById('canvas-container');
    const modalContainer = document.getElementById('modal-container');
    const treeMapModal = document.getElementById('tree-map-modal');
    const hoverTooltip = document.getElementById('hover-tooltip');
    const heroScreen = document.getElementById('hero-screen');
    const heroEnterBtn = document.getElementById('hero-enter-btn');
    const heroShowBtn = document.getElementById('btn-hero-show');
    const treeToggleBtn = document.getElementById('btn-tree-toggle');

    const slider = document.getElementById('timeline-slider');
    const counter = document.getElementById('timeline-node-counter');
    const btnPrev = document.getElementById('btn-prev-node');
    const btnNext = document.getElementById('btn-next-node');

    let currentNodeIndex = 0;

    // 1. Initialize 3D Scene
    const scene3D = new SacredScene3D(canvasContainer, TREE_DATA);

    // 2. Initialize Modal Drawer
    const modal = new SacredModalViewer(modalContainer, (childNode) => {
      const idx = TREE_DATA.findIndex(n => n.id === childNode.id);
      if (idx !== -1) selectNodeByIndex(idx, false);
      modal.show(childNode, ALL_NODES_MAP);
    });

    // 3. Initialize Sacred Tree Map
    const treeMap = new SacredTreeMap(treeMapModal, TREE_DATA, (selectedNode) => {
      const idx = TREE_DATA.findIndex(n => n.id === selectedNode.id);
      if (idx !== -1) selectNodeByIndex(idx, true);
    });

    // Function to manually jump to node by index
    function selectNodeByIndex(idx, openModal = false) {
      if (idx < 0) idx = 0;
      if (idx >= TREE_DATA.length) idx = TREE_DATA.length - 1;
      currentNodeIndex = idx;
      const node = TREE_DATA[idx];
      if (slider) slider.value = idx;
      const isHi = window.currentLang === 'hi';
      const nodeTitle = (isHi && node.title_hi) ? node.title_hi : node.title;
      if (counter) counter.textContent = `${idx + 1}/77: ${nodeTitle}`;
      const prefix = isHi ? I18N.hi.breadcrumbPrefix : I18N.en.breadcrumbPrefix;
      const bc = document.getElementById('breadcrumb-current');
      if (bc) bc.textContent = prefix + nodeTitle + (node.sanskrit ? ' (' + node.sanskrit + ')' : '');
      scene3D.flyToNode(node);
      if (openModal) modal.show(node, ALL_NODES_MAP);
    }

    // Stepper controls
    if (btnPrev) {
      btnPrev.addEventListener('click', () => {
        selectNodeByIndex(currentNodeIndex - 1, false);
      });
    }

    if (btnNext) {
      btnNext.addEventListener('click', () => {
        selectNodeByIndex(currentNodeIndex + 1, false);
      });
    }

    if (slider) {
      slider.addEventListener('input', (e) => {
        selectNodeByIndex(parseInt(e.target.value, 10), false);
      });
    }

    // Tap counter pill to open details
    if (counter) {
      counter.addEventListener('click', () => {
        const cur = TREE_DATA[currentNodeIndex];
        if (cur) modal.show(cur, ALL_NODES_MAP);
      });
    }

    // Header Row Left & Right Scrolling Wiring
    const headerRow = document.getElementById('main-header-row');
    const btnScrollLeft = document.getElementById('header-scroll-left');
    const btnScrollRight = document.getElementById('header-scroll-right');

    if (btnScrollLeft && headerRow) {
      btnScrollLeft.addEventListener('click', () => {
        headerRow.scrollBy({ left: -220, behavior: 'smooth' });
      });
    }

    if (btnScrollRight && headerRow) {
      btnScrollRight.addEventListener('click', () => {
        headerRow.scrollBy({ left: 220, behavior: 'smooth' });
      });
    }

    // Convert mouse wheel on header to horizontal scroll
    if (headerRow) {
      headerRow.addEventListener('wheel', (e) => {
        const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
        if (delta !== 0) {
          e.preventDefault();
          headerRow.scrollLeft += delta * 1.3;
        }
      }, { passive: false });

      // Click and drag to scroll header with mouse
      let isHDragging = false;
      let startX = 0;
      let scrollLeft = 0;

      headerRow.addEventListener('mousedown', (e) => {
        if (e.target.closest('button, input, a')) return;
        isHDragging = true;
        startX = e.pageX - headerRow.offsetLeft;
        scrollLeft = headerRow.scrollLeft;
        headerRow.style.cursor = 'grabbing';
      });

      window.addEventListener('mouseup', () => {
        isHDragging = false;
        if (headerRow) headerRow.style.cursor = 'default';
      });

      headerRow.addEventListener('mousemove', (e) => {
        if (!isHDragging) return;
        e.preventDefault();
        const x = e.pageX - headerRow.offsetLeft;
        const walk = (x - startX) * 1.6;
        headerRow.scrollLeft = scrollLeft - walk;
      });
    }

    // Sync header counter and breadcrumb when scrolling/panning in 3D
    scene3D.onScrollTravel = (focalPoint) => {
      let closestDist = Infinity;
      let closestIdx = 0;
      for (let i = 0; i < TREE_DATA.length; i++) {
        const n = TREE_DATA[i];
        const dy = n.y - focalPoint.y;
        const dz = n.z - focalPoint.z;
        const distSq = dy * dy + dz * dz;
        if (distSq < closestDist) {
          closestDist = distSq;
          closestIdx = i;
        }
      }
      if (closestIdx !== currentNodeIndex) {
        currentNodeIndex = closestIdx;
        const node = TREE_DATA[closestIdx];
        const isHi = window.currentLang === 'hi';
        const nodeTitle = (isHi && node.title_hi) ? node.title_hi : node.title;
        if (counter) counter.textContent = `${closestIdx + 1}/77: ${nodeTitle}`;
        const prefix = isHi ? I18N.hi.breadcrumbPrefix : I18N.en.breadcrumbPrefix;
        const bc = document.getElementById('breadcrumb-current');
        if (bc) bc.textContent = prefix + nodeTitle + (node.sanskrit ? ' (' + node.sanskrit + ')' : '');
      }
    };

    // Keyboard navigation (ArrowLeft = Prev, ArrowRight = Next)
    window.addEventListener('keydown', (e) => {
      if (heroScreen.classList.contains('hidden') && !treeMapModal.classList.contains('open') && !document.getElementById('modal-drawer').classList.contains('open')) {
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
          selectNodeByIndex(currentNodeIndex + 1, false);
        } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
          selectNodeByIndex(currentNodeIndex - 1, false);
        }
      }
    });

    // Fullscreen Helper Functions (Full Chrome window with no URL bar)
    function requestAppFullscreen() {
      const docEl = document.documentElement;
      const req = docEl.requestFullscreen ||
                  docEl.webkitRequestFullscreen ||
                  docEl.mozRequestFullScreen ||
                  docEl.msRequestFullscreen;
      if (req && !document.fullscreenElement && !document.webkitFullscreenElement) {
        try {
          const p = req.call(docEl);
          if (p && p.catch) p.catch(() => {});
        } catch (e) {}
      }
    }

    function exitAppFullscreen() {
      const exit = document.exitFullscreen ||
                   document.webkitExitFullscreen ||
                   document.mozCancelFullScreen ||
                   document.msExitFullscreen;
      if (exit && (document.fullscreenElement || document.webkitFullscreenElement)) {
        try {
          const p = exit.call(document);
          if (p && p.catch) p.catch(() => {});
        } catch (e) {}
      }
    }

    function toggleAppFullscreen() {
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        exitAppFullscreen();
      } else {
        requestAppFullscreen();
      }
    }

    const btnFullscreenToggle = document.getElementById('btn-fullscreen-toggle');
    const fullscreenIcon = document.getElementById('fullscreen-icon');
    const fullscreenBtnText = document.getElementById('fullscreen-btn-text');

    function updateFullscreenUI() {
      const isFS = !!(document.fullscreenElement || document.webkitFullscreenElement);
      const isHi = window.currentLang === 'hi';
      const dict = isHi ? I18N.hi : I18N.en;
      if (fullscreenBtnText) {
        fullscreenBtnText.textContent = isFS ? dict.fullscreenOff : dict.fullscreenOn;
      }
      if (btnFullscreenToggle) {
        btnFullscreenToggle.title = dict.fullscreenTitle;
      }
      if (fullscreenIcon) {
        if (isFS) {
          fullscreenIcon.innerHTML = '<path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>';
        } else {
          fullscreenIcon.innerHTML = '<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>';
        }
      }
    }

    document.addEventListener('fullscreenchange', updateFullscreenUI);
    document.addEventListener('webkitfullscreenchange', updateFullscreenUI);

    if (btnFullscreenToggle) {
      btnFullscreenToggle.addEventListener('click', toggleAppFullscreen);
    }

    // Auto-enter fullscreen on user's first interaction
    const triggerAutoFullscreen = () => {
      requestAppFullscreen();
    };
    window.addEventListener('click', triggerAutoFullscreen, { once: true, passive: true });
    window.addEventListener('keydown', triggerAutoFullscreen, { once: true, passive: true });
    window.addEventListener('touchend', triggerAutoFullscreen, { once: true, passive: true });

    // 4. Hero Screen Enter Handler
    const dismissHero = () => {
      heroScreen.classList.add('hidden');
      setTimeout(() => { heroScreen.style.display = 'none'; }, 1200);
      requestAppFullscreen();
    };
    if (heroEnterBtn) heroEnterBtn.addEventListener('click', dismissHero);
    if (heroShowBtn) {
      heroShowBtn.addEventListener('click', () => {
        heroScreen.style.display = 'block';
        setTimeout(() => { heroScreen.classList.remove('hidden'); }, 10);
      });
    }
    window.addEventListener('keydown', (e) => {
      if (!heroScreen.classList.contains('hidden') && (e.key === 'Enter' || e.key === ' ')) {
        dismissHero();
      }
    });

    // 5. Tree Map Toggle
    if (treeToggleBtn) {
      treeToggleBtn.addEventListener('click', () => treeMap.toggle());
    }

    // 6. Node Interaction Callbacks
    scene3D.onNodeClick = (nodeData) => {
      hoverTooltip.classList.remove('visible');
      const idx = TREE_DATA.findIndex(n => n.id === nodeData.id);
      if (idx !== -1) selectNodeByIndex(idx, true);
    };

    scene3D.onNodeHover = (nodeData, event) => {
      if (nodeData && event) {
        const isHi = window.currentLang === 'hi';
        const title = (isHi && nodeData.title_hi) ? nodeData.title_hi : nodeData.title;
        const hint = isHi ? I18N.hi.tooltipHint : I18N.en.tooltipHint;
        hoverTooltip.innerHTML = `
          <div class="tooltip-title">${title}</div>
          ${nodeData.sanskrit ? `<div class="tooltip-sanskrit">${nodeData.sanskrit}</div>` : ''}
          <div class="tooltip-hint">${hint}</div>
        `;
        hoverTooltip.style.left = `${Math.min(window.innerWidth - 260, event.clientX + 16)}px`;
        hoverTooltip.style.top = `${Math.min(window.innerHeight - 80, event.clientY + 16)}px`;
        hoverTooltip.classList.add('visible');
      } else {
        hoverTooltip.classList.remove('visible');
      }
    };

    // 7. Category Filter Chips (Modern Hindi Default)
    const categories = [
      { key: 'all', label_hi: 'समग्र ब्रह्माण्ड', label_en: 'All Cosmos' },
      { key: 'cosmos', label_hi: 'परब्रह्म एवं सृष्टि', label_en: 'Brahman & Cosmos' },
      { key: 'divine', label_hi: 'परम देव व देवियाँ', label_en: 'Supreme Deities' },
      { key: 'avatar', label_hi: 'दशावतार', label_en: 'Dashavatara' },
      { key: 'lineage', label_hi: 'पवित्र वंशावली', label_en: 'Genealogies' },
      { key: 'yuga', label_hi: 'युग एवं महाप्रलय', label_en: 'Yugas & Kalpas' },
      { key: 'war', label_hi: 'धर्मयुद्ध', label_en: 'Epic Wars' },
      { key: 'scripture', label_hi: 'पवित्र धर्मग्रंथ', label_en: 'Scriptures' }
    ];
    const ribbon = document.getElementById('category-ribbon');
    categories.forEach((cat, idx) => {
      const btn = document.createElement('button');
      btn.className = 'category-chip' + (idx === 0 ? ' active' : '');
      const label = window.currentLang === 'hi' ? cat.label_hi : cat.label_en;
      btn.innerHTML = `${ICONS[cat.key] || ICONS.cosmos} <span>${label}</span>`;
      btn.addEventListener('click', () => {
        ribbon.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        if (cat.key === 'all') {
          selectNodeByIndex(0, false);
          return;
        }
        const matchIdx = TREE_DATA.findIndex(n => n.category === cat.key);
        if (matchIdx !== -1) {
          selectNodeByIndex(matchIdx, false);
        }
      });
      ribbon.appendChild(btn);
    });

    // 8. Search Filter & Mobile Search Toggle
    const searchInput = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');
    const searchContainer = document.getElementById('search-container');
    const searchToggleBtn = document.getElementById('btn-search-toggle');
    const searchCloseMobileBtn = document.getElementById('search-close-mobile');

    if (searchToggleBtn && searchContainer) {
      searchToggleBtn.addEventListener('click', () => {
        searchContainer.classList.toggle('mobile-active');
        if (searchContainer.classList.contains('mobile-active')) {
          searchInput.focus();
        }
      });
    }

    if (searchCloseMobileBtn && searchContainer) {
      searchCloseMobileBtn.addEventListener('click', () => {
        searchContainer.classList.remove('mobile-active');
        searchResults.classList.remove('active');
      });
    }

    searchInput.addEventListener('input', (e) => {
      const q = normalizeText(e.target.value);
      const isHi = window.currentLang === 'hi';
      if (!q) {
        searchResults.classList.remove('active');
        searchResults.innerHTML = '';
        return;
      }
      const matches = TREE_DATA.filter(n =>
        normalizeText(n.title).includes(q) ||
        normalizeText(n.title_hi || '').includes(q) ||
        normalizeText(n.sanskrit || '').includes(q) ||
        normalizeText(n.summary || '').includes(q) ||
        normalizeText(n.summary_hi || '').includes(q) ||
        normalizeText(n.category).includes(q) ||
        normalizeText(n.epoch || '').includes(q) ||
        normalizeText(n.epoch_hi || '').includes(q)
      ).slice(0, 8);

      if (matches.length === 0) {
        searchResults.innerHTML = `<div class="search-item"><div class="search-title">"${e.target.value}" ${isHi ? I18N.hi.noResultsFound : I18N.en.noResultsFound}</div></div>`;
      } else {
        searchResults.innerHTML = matches.map(n => {
          const ic = ICONS[n.category] || ICONS.cosmos;
          const title = (isHi && n.title_hi) ? n.title_hi : n.title;
          const epoch = (isHi && n.epoch_hi) ? n.epoch_hi : (n.epoch || '');
          const catLabel = isHi && I18N.hi.categories[n.category] ? I18N.hi.categories[n.category] : (n.category||'').toUpperCase();
          return `
            <div class="search-item" data-id="${n.id}">
              <div class="search-icon-cell">${ic}</div>
              <div>
                <div class="search-title">${title}</div>
                <div class="search-sanskrit">${n.sanskrit || ''}</div>
                <div class="search-epoch">${catLabel} · ${epoch}</div>
              </div>
            </div>
          `;
        }).join('');
      }
      searchResults.classList.add('active');

      searchResults.querySelectorAll('.search-item[data-id]').forEach(item => {
        item.addEventListener('click', () => {
          const id = item.getAttribute('data-id');
          const idx = TREE_DATA.findIndex(n => n.id === id);
          if (idx !== -1) {
            searchResults.classList.remove('active');
            if (searchContainer) searchContainer.classList.remove('mobile-active');
            searchInput.value = '';
            selectNodeByIndex(idx, true);
          }
        });
      });
    });

    document.addEventListener('click', (e) => {
      if (!searchInput.contains(e.target) && !searchResults.contains(e.target) && (!searchToggleBtn || !searchToggleBtn.contains(e.target))) {
        searchResults.classList.remove('active');
      }
    });

    // Language Toggle (Modern Hindi <-> English)
    const langBtn = document.getElementById('btn-lang-toggle');
    const langBtnText = document.getElementById('lang-btn-text');
    if (langBtn) {
      langBtn.addEventListener('click', () => {
        window.currentLang = window.currentLang === 'hi' ? 'en' : 'hi';
        const isHi = window.currentLang === 'hi';
        const dict = isHi ? I18N.hi : I18N.en;
        if (langBtnText) langBtnText.textContent = dict.langToggle;

        // Update header site titles & buttons
        const siteTitle = document.getElementById('site-title');
        const siteSubtitle = document.getElementById('site-subtitle');
        if (siteTitle) siteTitle.textContent = dict.siteTitle;
        if (siteSubtitle) siteSubtitle.textContent = dict.siteSubtitle;
        if (searchInput) searchInput.placeholder = dict.searchPlaceholder;
        const searchBtnText = document.querySelector('#btn-search-toggle .btn-text');
        if (searchBtnText) searchBtnText.textContent = dict.searchBtn;
        const treeBtnText = document.querySelector('#btn-tree-toggle .btn-text');
        if (treeBtnText) treeBtnText.textContent = dict.treeMapBtn;
        const introBtnText = document.querySelector('#btn-hero-show .btn-text');
        if (introBtnText) introBtnText.textContent = dict.introBtn;

        // Update header buttons
        const btnPrevEl = document.getElementById('btn-prev-node');
        const btnNextEl = document.getElementById('btn-next-node');
        const btnStepBackEl = document.querySelector('#btn-step-back .btn-text') || document.querySelector('#btn-step-back span');
        const btnInspectEl = document.querySelector('#btn-inspect-current .btn-text') || document.querySelector('#btn-inspect-current span');
        if (btnPrevEl) { btnPrevEl.textContent = dict.prevBtn; btnPrevEl.title = dict.prevTitle; }
        if (btnNextEl) { btnNextEl.textContent = dict.nextBtn; btnNextEl.title = dict.nextTitle; }
        if (btnStepBackEl) { btnStepBackEl.textContent = dict.rootBtn; const sb = document.getElementById('btn-step-back'); if (sb) sb.title = dict.rootTitle; }
        if (btnInspectEl) { btnInspectEl.textContent = dict.inspectBtn; const ic = document.getElementById('btn-inspect-current'); if (ic) ic.title = dict.inspectTitle; }
        updateFullscreenUI();

        // Update breadcrumb and counter
        const node = TREE_DATA[currentNodeIndex];
        if (node) {
          const title = (isHi && node.title_hi) ? node.title_hi : node.title;
          counter.textContent = `${currentNodeIndex + 1}/77: ${title}`;
          document.getElementById('breadcrumb-current').textContent = dict.breadcrumbPrefix + title + (node.sanskrit ? ' (' + node.sanskrit + ')' : '');
        }

        // Re-render ribbon category chips
        ribbon.querySelectorAll('.category-chip').forEach((chip, idx) => {
          const cat = categories[idx];
          if (cat) {
            const label = isHi ? cat.label_hi : cat.label_en;
            const span = chip.querySelector('span');
            if (span) span.textContent = label;
          }
        });

        // Update audio text if playing / paused
        const audioText = document.getElementById('audio-text');
        if (audioText) {
          audioText.textContent = isHi 
            ? (audioEngine.isPlaying ? I18N.hi.tanpuraOn : I18N.hi.tanpuraOff)
            : (audioEngine.isPlaying ? I18N.en.tanpuraOn : I18N.en.tanpuraOff);
        }

        // If modal open, refresh it
        if (document.getElementById('modal-drawer').classList.contains('open') && modal.currentNodeData) {
          modal.show(modal.currentNodeData, ALL_NODES_MAP);
        }

        // Re-render tree map if open or ready
        if (treeMap) {
          treeMap.render();
        }
      });
    }

    // 9. Header 3D Navigation & Action Buttons
    const btnZoomIn = document.getElementById('btn-zoom-in');
    const btnZoomOut = document.getElementById('btn-zoom-out');
    const btnStepBack = document.getElementById('btn-step-back');
    const btnInspect = document.getElementById('btn-inspect-current');

    if (btnZoomIn) {
      btnZoomIn.addEventListener('click', () => {
        scene3D.targetOrbitRadius = Math.max(50, scene3D.targetOrbitRadius - 70);
      });
    }
    if (btnZoomOut) {
      btnZoomOut.addEventListener('click', () => {
        scene3D.targetOrbitRadius = Math.min(1400, scene3D.targetOrbitRadius + 70);
      });
    }
    if (btnStepBack) {
      btnStepBack.addEventListener('click', () => {
        selectNodeByIndex(0, false);
        scene3D.targetTheta = 0;
        scene3D.targetPhi = Math.PI * 0.44;
      });
    }
    if (btnInspect) {
      btnInspect.addEventListener('click', () => {
        const cur = TREE_DATA[currentNodeIndex];
        if (cur) modal.show(cur, ALL_NODES_MAP);
      });
    }

    // 10. Audio Tanpura Toggle
    const audioBtn = document.getElementById('btn-audio-toggle');
    audioBtn.addEventListener('click', () => {
      const isPlaying = audioEngine.toggle();
      const isHi = window.currentLang === 'hi';
      if (isPlaying) {
        audioBtn.classList.add('active');
        document.getElementById('audio-icon').innerHTML = ICONS.volumeOn;
        document.getElementById('audio-text').textContent = isHi ? I18N.hi.tanpuraOn : I18N.en.tanpuraOn;
      } else {
        audioBtn.classList.remove('active');
        document.getElementById('audio-icon').innerHTML = ICONS.volumeOff;
        document.getElementById('audio-text').textContent = isHi ? I18N.hi.tanpuraOff : I18N.en.tanpuraOff;
      }
    });

    console.log("Sanatana Dharma Universe ready. Total Sacred Nodes:", TREE_DATA.length);
  });
