osmic office held for the span of each Manvantara by a soul of extraordinary merit. When the drought-demon Vritrasura trapped all cosmic waters within mountain caverns, the living universe choked in drought.</p>\n\n      <h3>The Thunderbolt Forged of Dadhichi's Bones</h3>\n      <p>Vritra held a boon that no weapon of wood, metal, wet or dry substance could slay him. Sage Dadhichi willingly sacrificed his own mortal body so Vishvakarma could forge the diamond thunderbolt (<strong>Vajra</strong>) from his backbone. Armed with the Vajra and riding the four-tusked white elephant Airavata, Indra shattered Vritra's stony fortress, releasing the waters to flow across the world.</p>\n\n      <h3>Outcome: Cosmic Renewal and the Lesson of Humility</h3>\n      <p>Indra restored life to the universe, yet his legends repeatedly caution that even the highest celestial throne is transient. When pride overtook him, the lifting of Govardhana Hill by Krishna taught him that cosmic offices exist for service, not personal ego.</p>\n    ","childrenIds":[],"title_hi":"देवराज इन्द्र (सुरेश)","epoch_hi":"स्वर्ग के अधिपति एवं वज्रधारी","summary_hi":"अमरावती के सम्राट, ऐरावत हाथी के सवार, दधीचि की अस्थियों से बने वज्र के स्वामी, जिन्होंने वृत्रासुर का वध किया।","quote_hi":"वज्रहस्त — महर्षि दधीचि की अस्थियों से निर्मित अमोघ वज्र को धारण करने वाले देवराज","content_hi":"\n      <h3>स्वर्ग का सिंहासन एवं वृत्रासुर संकट</h3>\n      <p>इन्द्र एक पदवी है, जो प्रत्येक मन्वन्तर में सर्वाधिक पुण्यशाली आत्मा को मिलती है। जब वृत्रासुर ने तीनों लोकों का जल रोककर भयंकर अकाल उत्पन्न कर दिया, तब सृष्टि के अस्तित्व पर संकट आ गया।</p>\n\n      <h3>दधीचि की अस्थियाँ एवं वज्र का निर्माण</h3>\n      <p>वृत्रासुर किसी धातु या लकड़ी के अस्त्र से नहीं मर सकता था। तब महर्षि दधीचि ने लोक-कल्याण के लिए अपनी देह का दान किया। उनकी रीढ़ की हड्डी से विश्वकर्मा ने अमोघ 'वज्र' का निर्माण किया। ऐरावत हाथी पर सवार होकर इन्द्र ने वृत्रासुर का वध किया और नदियों के प्रवाह को मुक्त कराया।</p>\n\n      <h3>परिणाम एवं अहंकार का शमन</h3>\n      <p>इन्द्र ने जल संकट से सृष्टि की रक्षा की, परंतु कई प्रसंगों में (जैसे गोवर्धन लीला) उनका अहंकार टूटा। यह दर्शाता है कि पद कितना भी ऊँचा हो, अभिमान पतन का कारण बनता है और विनम्रता ही सबसे बड़ा गुण है।</p>\n    "},{"id":"surya","title":"Surya","sanskrit":"सूर्य (आदित्य)","category":"lineage","epoch":"The Cosmic Eye","tier":9,"parentId":"devas","x":80,"y":-400,"z":720,"symbol3D":"chakra","image":"assets/images/surya.jpg","quote":"Chakshur devanam — The visible eye of the gods and embodiment of the Gayatri mantra","summary":"The solar deity, illuminator of the universe, father of Manu, Yama, and the Solar Dynasty (Suryavansha).","content":"\n      <h3>The Visible Divine Eye of the Cosmos</h3>\n      <p>Without sunlight, photosynthesis, seasonal cycles, and biological life are impossible. In Vedic revelation, Surya is celebrated as the visible eye of God (<em>Chakshu</em>) and the tangible soul of the moving and unmoving universe.</p>\n\n      <h3>The Chariot of Seven Horses</h3>\n      <p>Surya traverses the celestial vault upon a golden chariot driven by the thighless dawn-deity Aruna, drawn by seven horses representing the seven colors of sunlight and seven poetic metres (Gayatri, Trishtubh, etc.). Son of Kashyapa and Aditi, his daily revolution creates the divisions of time: Muhurtas, days, fortnights, and Ayana (solstices).</p>\n\n      <h3>Outcome: The Lineage of Rama & The Gayatri</h3>\n      <p>From Surya's son Vaivasvata Manu sprang the glorious Solar Dynasty (Suryavamsha) culminating in Sri Rama. The supreme Gayatri Mantra is dedicated to Savitr (the radiant solar source), inspiring the intellect toward highest illumination.</p>\n    ","childrenIds":[],"title_hi":"भगवान सूर्यदेव (आदित्य)","epoch_hi":"जगत की प्रत्यक्ष आत्मा","summary_hi":"सात घोड़ों के स्वर्ण-रथ पर सवार, समस्त सृष्टि को जीवन, प्रकाश और समय देने वाले प्रत्यक्ष देवता, गायत्री मंत्र के आराध्य।","quote_hi":"सूर्य आत्मा जगतस्तस्थुषश्च — सूर्य ही चर और अचर सम्पूर्ण जगत की आत्मा हैं (ऋग्वेद १.११५.१)","content_hi":"\n      <h3>सृष्टि के प्रत्यक्ष नेत्र</h3>\n      <p>सूर्यदेव के बिना जीवन, समय और ऋतुओं की कल्पना भी नहीं की जा सकती। वेदों में कहा गया है कि सूर्य प्रत्यक्ष देवता हैं, जो नेत्रों द्वारा साक्षात् दिखाई देते हैं और सम्पूर्ण चराचर जगत में प्राणों का संचार करते हैं।</p>\n\n      <h3>सात घोड़ों का स्वर्ण रथ</h3>\n      <p>सूर्यदेव एक चक्र वाले स्वर्ण-रथ पर सवार हैं, जिसे सात हरे घोड़े खींचते हैं — जो प्रकाश के सात रंगों और सप्ताह के सात दिनों के प्रतीक हैं। अरुण देव उनके सारथि हैं। कश्यप और अदिति के पुत्र सूर्यदेव के दैनिक भ्रमण से ही काल और संवत्सर की गणना होती है।</p>\n\n      <h3>परिणाम एवं सूर्यवंश की प्रतिष्ठा</h3>\n      <p>सूर्यदेव के पुत्र वैवस्वत मनु से ही 'सूर्यवंश' का आरंभ हुआ, जिसमें आगे चलकर मर्यादा पुरुषोत्तम श्रीराम का अवतार हुआ। गायत्री महामंत्र द्वारा उन्हीं 'सविता' देव के दिव्य तेज का ध्यान कर बुद्धि को सन्मार्ग पर प्रेरित किया जाता है।</p>\n    "},{"id":"varuna","title":"Varuna","sanskrit":"वरुण (प्रचेताः)","category":"lineage","epoch":"Lord of Cosmic Law","tier":9,"parentId":"devas","x":140,"y":-400,"z":720,"symbol3D":"chakra","image":"assets/images/varuna.jpg","quote":"Ritasya gopa — Guardian of the inviolable moral and cosmic order","summary":"The ancient sovereign keeper of cosmic truth (Rita) and lord of the celestial and terrestrial waters.","content":"\n      <h3>The Ancient Sovereign of Cosmic Law</h3>\n      <p>In early Vedic hymns, Varuna stands as the stern guardian of <em>Rita</em> — the universal moral and physical law that commands stars to hold their orbits and men to speak truth. He sees into the secret chambers of human hearts with a thousand eyes.</p>\n\n      <h3>Lord of Waters and the Cosmic Noose</h3>\n      <p>Holding the sacred noose (Pasha) with which he binds oath-breakers and deceivers, Varuna commands the celestial and terrestrial waters (Samudra and rivers). Mounted on the sea-monster Makara, he cleanses sins and maintains the balance of life-giving rain alongside Mitra.</p>\n\n      <h3>Outcome: The Inviolability of Truth</h3>\n      <p>Varuna teaches that no injustice goes unnoticed in the universe. Actions bear inexorable consequences, urging human beings to live with absolute moral integrity and reverence for the sanctity of oaths.</p>\n    ","childrenIds":[],"title_hi":"वरुण देव (ऋत के संरक्षक)","epoch_hi":"नैतिक व्यवस्था एवं जल के स्वामी","summary_hi":"समस्त जल-राशियों और महासागरों के अधिपति, जिन्होंने सत्य और नैतिक नियम (ऋत) का पाश धारण किया हुआ है।","quote_hi":"ऋतस्य गोपा — ब्रह्माण्ड के शाश्वत नैतिक और प्राकृतिक नियमों के सजग प्रहरी","content_hi":"\n      <h3>ऋत और सत्य के रक्षक</h3>\n      <p>वैदिक काल में वरुण देव को ब्रह्माण्ड के नैतिक नियम 'ऋत' का सर्वोच्च रक्षक माना गया है। वे मनुष्य के गुप्त विचारों और कर्मों को भी अपने सहस्र नेत्रों से देख लेते हैं।</p>\n\n      <h3>जल-जगत के अधिपति एवं पाश</h3>\n      <p>वरुण देव मकर (मगरमच्छ) पर सवार हैं और उनके हाथ में 'पाश' (बंधन) है, जिससे वे झूठ और अधर्म करने वालों को बांधते हैं। वे समस्त नदियों, सरोवरों और महासागरों के स्वामी हैं तथा वर्षा के चक्र को नियंत्रित करते हैं।</p>\n      \n      <h3>आध्यात्मिक शिक्षा</h3>\n      <p>वरुण देव यह स्मरण कराते हैं कि कर्म का फल अकाट्य है। सत्य और ईमानदारी से जीवन जीना ही मनुष्य का परम कर्तव्य है, क्योंकि ईश्वरीय विधान से कुछ भी छिपा नहीं रह सकता।</p>\n    "},{"id":"diti","title":"Diti","sanskrit":"दिति (दैत्यमाता)","category":"lineage","epoch":"Titanic Ambition","tier":7,"parentId":"kashyapa","x":200,"y":-280,"z":560,"symbol3D":"mandala","image":"assets/images/diti.jpg","quote":"Daitya-janani — Mother of the mighty Daityas","summary":"Wife of Kashyapa, mother of the Daityas, representing material might, tapas, and the drive for dominion.","content":"\n      <h3>The Drive for Material Power</h3>\n      <p>While Aditi personified divine harmony, her sister Diti embodied intense material ambition, physical vitality, and attachment to territory. Grieved by the repeated defeat of her children by the Devas, she resolved to challenge celestial hegemony through spiritual austerity.</p>\n\n      <h3>Fierce Austerities and the Birth of Maruts</h3>\n      <p>Diti performed a grueling hundred-year vrata to birth a son capable of slaying Indra. Fearing the birth, Indra entered her womb using yogic invisibility and divided the unborn embryo into 49 pieces with his thunderbolt. When the fragments cried out, Indra calmed them, saying <em>\"Mā ruda\"</em> (Do not weep), transforming them into the 49 benevolent storm gods known as the <strong>Maruts</strong>.</p>\n\n      <h3>Outcome: The Duality of Cosmic Drama</h3>\n      <p>Diti's lineage gave birth to the Daityas, whose conflicts with the Devas formed the engine of cosmic evolution across all epochs, demonstrating that raw power without moral surrender leads to inevitable tragedy.</p>\n    ","childrenIds":["daityas"],"title_hi":"माता दिति (दैत्यमाता)","epoch_hi":"भौतिक महत्वाकांक्षा एवं घोर तप","summary_hi":"कश्यप की पत्नी, महाबली दैत्यों (हिरण्याक्ष, हिरण्यकशिपु आदि) की माता, जिन्होंने पुत्र-शोक में कठोर तप का मार्ग अपनाया।","quote_hi":"दैत्यजननी — असीम भौतिक शक्ति और दुर्दम्य संकल्प वाली दैत्यों की आदि-माता","content_hi":"\n      <h3>भौतिक शक्ति और महत्वाकांक्षा</h3>\n      <p>माता दिति कश्यप जी की पत्नी और दक्ष की पुत्री थीं। वे भौतिक सामर्थ्य, पराक्रम और संतान के प्रति अत्यधिक मोह की प्रतीक हैं। जब देवों ने उनके पुत्रों को पराजित किया, तो उन्होंने इन्द्र को दंड देने के लिए तपस्या का मार्ग चुना।</p>\n\n      <h3>कठोर व्रत एवं मरुद्गणों की उत्पत्ति</h3>\n      <p>दिति ने इन्द्र-हंता पुत्र पाने के लिए सौ वर्षों का कठिन गर्भ-व्रत रखा। इन्द्र ने कपटपूर्वक सूक्ष्म रूप धारण कर उनके गर्भ में प्रवेश किया और भ्रूण के वज्र से ४९ टुकड़े कर दिए। बालकों के रोने पर इन्द्र ने कहा — 'मा रुद' (मत रोओ)। वे ही ४९ बालक आगे चलकर दयालु वायु-देवता 'मरुद्गण' बने।</p>\n\n      <h3>परिणाम एवं दैत्य कुल</h3>\n      <p>दिति के पुत्रों (हिरण्याक्ष, हिरण्यकशिपु) ने तीनों लोकों में अपनी शक्ति का डंका बजाया। उनका आख्यान सिखाता है कि केवल भौतिक बल और अहंकार बिना धर्म के विनाश की ओर ले जाता है।</p>\n    "},{"id":"daityas","title":"Daityas","sanskrit":"दैत्याः","category":"lineage","epoch":"Titanic Power","tier":8,"parentId":"diti","x":200,"y":-340,"z":640,"symbol3D":"mandala","image":"assets/images/daityas.jpg","quote":"Tapo-bala-samriddha — Formidable through austerity and willpower","summary":"The powerful race of Asuras who repeatedly conquered heaven through terrifying tapas and boons.","content":"\n      <h3>Scholar-Warriors of Tremendous Will</h3>\n      <p>The Daityas were not mindless brutes, but formidable scholar-warriors capable of enduring thousands of years of extreme spiritual austerities (Tapas) that compelled even Brahma and Shiva to grant virtually invulnerable boons.</p>\n\n      <h3>Conquest of the Three Worlds</h3>\n      <p>Armed with these divine boons, Daitya monarchs like Hiranyaksha, Hiranyakashipu, and Bali repeatedly conquered heaven, banished the Devas, and governed vast empires. Under righteous kings like Bali, their subjects enjoyed unprecedented material opulence, though systemic lack of reverence for the transcendent inevitably brought divine intervention.</p>\n\n      <h3>Outcome: Catalyst for the Avataras</h3>\n      <p>The Daityas served as the great dramatic anvil upon which divine grace forged the Avataras: Varaha, Narasimha, and Vamana descended specifically in response to Daitya dominance, rebalancing the cosmos.</p>\n    ","childrenIds":["hiranyaksha","hiranyakashipu"],"title_hi":"दैत्य वंश (तपोबल सम्पन्न असुर)","epoch_hi":"महापराक्रम एवं साम्राज्य","summary_hi":"दिति और कश्यप के पराक्रमी पुत्र, जिन्होंने कठोर तपस्या से ब्रह्मा और शिव से अजेय वरदान प्राप्त कर स्वर्ग पर शासन किया।","quote_hi":"तपोबल-समृद्धाः — कठोर तपस्या और आत्मबल से तीनों लोकों को वश में करने वाले","content_hi":"\n      <h3>घोर तपस्वी और पराक्रमी योद्धा</h3>\n      <p>दैत्य सामान्य दानव नहीं थे, अपितु वे प्रकाण्ड विद्वान और ऐसे घोर तपस्वी थे जो सहस्रों वर्षों तक एक पैर पर खड़े होकर ब्रह्मा और शिव को प्रसन्न कर अजेयता का वरदान प्राप्त कर लेते थे।</p>\n\n      <h3>स्वर्ग पर आधिपत्य</h3>\n      <p>वरदानों के बल पर हिरण्याक्ष, हिरण्यकशिपु और राजा बलि ने स्वर्ग के सिंहासन पर अधिकार किया और देवों को परास्त किया। राजा बलि के राज्य में प्रजा अत्यंत सुखी थी, किंतु परमात्मा के ऊपर स्वयं को स्थापित करने के अहंकार ने उनका मार्ग अवरुद्ध कर दिया।</p>\n\n      <h3>परिणाम एवं अवतारों की पृष्ठभूमि</h3>\n      <p>दैत्यों के इसी पराक्रम और अहंकार के कारण भगवान विष्णु को वराह, नृसिंह और वामन जैसे अद्भुत अवतार धारण करने पड़े, जिन्होंने जगत में धर्म की पुनर्स्थापना की।</p>\n    "},{"id":"hiranyaksha","title":"Hiranyaksha","sanskrit":"हिरण्याक्ष","category":"lineage","epoch":"The Golden-Eyed Titan","tier":9,"parentId":"daityas","x":160,"y":-400,"z":720,"symbol3D":"mandala","image":"assets/images/hiranyaksha.jpg","quote":"Dharani-hartaa — He who dragged the sacred Earth into the primal cosmic abyss","summary":"The tyrant brother who abducted Mother Earth into the depths of the cosmic ocean, slain by Varaha.","content":"\n      <h3>The Theft of Mother Earth</h3>\n      <p>Hiranyaksha gained a boon from Brahma rendering him invulnerable to gods, demons, humans, and countless beasts, but arrogantly omitted the boar. Believing himself master of creation, he challenged the ocean king Varuna, and plunged planet Earth (Bhudevi) into the dark cosmic abyss of Rasatala.</p>\n\n      <h3>The Subaquatic Cosmic Duel</h3>\n      <p>Unable to bear the agony of Mother Earth drowning in the primal void, Brahma prayed, and from his nostril emerged Lord Vishnu as the colossal divine boar, Varaha. Diving millions of leagues into the abyssal ocean, Varaha located Earth by scent. Hiranyaksha attacked with his golden mace, igniting a cosmic underwater duel that lasted a thousand years, culminating in Varaha striking the titan down.</p>\n\n      <h3>Outcome: The Rescue of Bhudevi</h3>\n      <p>Lifting the Earth tenderly upon his curved white tusks, Varaha raised her safely back onto the celestial waters, restoring stability to terrestrial life and illustrating that divine justice reaches into the deepest abyss.</p>\n    ","childrenIds":[],"title_hi":"हिरण्याक्ष (पृथ्वी का हरण)","epoch_hi":"ररसातल में पृथ्वी का निमज्जन","summary_hi":"दिति का ज्येष्ठ पुत्र, जिसने भूदेवी (पृथ्वी) को ब्रह्माण्डीय सागर में डुबो दिया, जिसका वध भगवान वराह ने किया।","quote_hi":"धरणीहर्ता — अहंकार में चूर होकर पृथ्वी को रसातल के अंधकार में खींच ले जाने वाला दैत्य","content_hi":"\n      <h3>अहंकार एवं पृथ्वी का अपहरण</h3>\n      <p>हिरण्याक्ष ने ब्रह्मा जी से वरदान पाकर स्वयं को अमर मान लिया, परंतु घमण्ड में उसने 'वराह' (सूअर) का नाम नहीं लिया। जब उसे युद्ध के लिए कोई प्रतिद्वंद्वी नहीं मिला, तो उसने धरती माता (भूदेवी) को चुराकर रसातल के अतल जल में डुबो दिया।</p>\n\n      <h3>रसातल में महायुद्ध</h3>\n      <p>धरती की पुकार सुनकर ब्रह्मा जी की नासिका से भगवान विष्णु 'वराह' रूप में प्रकट हुए। विशाल पर्वत के समान वराह भगवान ने रसातल में प्रवेश कर गंध से पृथ्वी का पता लगाया। वहाँ हिरण्याक्ष और भगवान वराह के मध्य सहस्र वर्षों तक भयंकर गदा युद्ध हुआ, जिसमें प्रभु ने हिरण्याक्ष का वध कर दिया।</p>\n\n      <h3>परिणाम एवं भू-उद्धार</h3>\n      <p>भगवान वराह ने अपने शुभ्र दांतों पर धरती को उठाकर जल के ऊपर सुरक्षित स्थापित किया। यह प्रसंग सिखाता है कि जब अधर्म पृथ्वी का शोषण करता है, तब परमात्मा पाताल से भी उसका उद्धार करने आते हैं।</p>\n    "},{"id":"hiranyakashipu","title":"Hiranyakashipu","sanskrit":"हिरण्यकशिपु","category":"lineage","epoch":"The Tyrant of Three Worlds","tier":9,"parentId":"daityas","x":240,"y":-400,"z":720,"symbol3D":"mandala","image":"assets/images/hiranyakashipu.jpg","quote":"Sarva-loka-kantaka — The thorn in the side of all the worlds","summary":"Brother of Hiranyaksha, obtained an intricate boon making him indestructible by day or night, inside or out.","content":"\n      <h3>The Quest for Total Immortality</h3>\n      <p>Enraged by his brother Hiranyaksha's death, Hiranyakashipu resolved to become immortal through extreme austerities on Mount Mandara. As ants consumed his flesh, his spiritual heat threatened to burn the cosmos until Brahma appeared.</p>\n\n      <h3>The Ingenious Legal Loophole</h3>\n      <p>Hiranyakashipu requested Brahma's boon: <em>\"Let me die neither inside nor outside any dwelling, neither by day nor by night, neither on earth nor in the sky, neither by man nor beast, nor by any weapon forged by hands.\"</em> Believing he had outwitted mortality, he conquered all worlds, banned the recitation of Vishnu's name, and demanded worship as the supreme god.</p>\n\n      <h3>Outcome: The Defiance of Prahlada</h3>\n      <p>His tyrannical reign was broken not by armies, but by his own young son Prahlada, whose absolute devotion to Narayana proved that tyrannical arrogance can never extinguish inner faith.</p>\n    ","childrenIds":["prahlada"],"title_hi":"हिरण्यकशिपु (त्रिलोक विजेता)","epoch_hi":"अहंकार की पराकाष्ठा एवं ईश्वर-द्रोह","summary_hi":"हिरण्याक्ष का भाई, जिसने ऐसा वरदान प्राप्त किया कि न वह दिन में मरे न रात में, न घर के अंदर न बाहर; जिसने स्वयं को ईश्वर घोषित किया।","quote_hi":"सर्वलोककण्टकः — तीनों लोकों को अपनी क्रूर सत्ता से भयभीत करने वाला दैत्यराज","content_hi":"\n      <h3>अमरता की चाह में घोर तपस्या</h3>\n      <p>भाई हिरण्याक्ष के वध का प्रतिशोध लेने के लिए हिरण्यकशिपु ने मन्दराचल पर्वत पर घोर तप किया। उसके शरीर को दीमकों ने खा लिया, केवल अस्थियाँ बचीं। उसकी तपस्या से तीनों लोक जलने लगे, तब ब्रह्मा जी प्रकट हुए।</p>\n\n      <h3>अद्वितीय वरदान का अहंकार</h3>\n      <p>उसने वरदान माँगा: 'न मैं घर के भीतर मरूँ न बाहर, न दिन में न रात में, न अस्त्र से न शस्त्र से, न पृथ्वी पर न आकाश में, न मनुष्य से न पशु से, और न किसी प्राणी के द्वारा।' इस वरदान के बाद उसने स्वयं को 'भगवान' घोषित कर दिया और विष्णु-भक्ति पर पूर्ण प्रतिबंध लगा दिया।</p>\n\n      <h3>परिणाम एवं पतन की शुरुआत</h3>\n      <p>उसके अपने ही महल में उसके पुत्र प्रह्लाद ने इस अधर्म को चुनौती दी। प्रह्लाद की अनन्य हरि-भक्ति ने सिद्ध कर दिया कि संसार की कोई भी तानाशाही अंतरात्मा के विश्वास को नहीं झुका सकती।</p>\n    "},{"id":"prahlada","title":"Prahlada","sanskrit":"प्रह्लाद (परम भागवत)","category":"lineage","epoch":"Peerless Devotion","tier":10,"parentId":"hiranyakashipu","x":240,"y":-460,"z":800,"symbol3D":"lotus","image":"assets/images/prahlada.jpg","quote":"Harir vartate sarvatra — The Lord exists everywhere, even in this stone pillar!","summary":"The young son of Hiranyakashipu whose absolute, unshakable love for Narayana brought forth Narasimha.","content":"\n      <h3>Devotion in the Womb of Tyranny</h3>\n      <p>While still in the womb of his mother Kayadhu, Prahlada heard the teachings of sage Narada regarding divine surrender. Born into the royal household of the world's fiercest tyrant, the young prince possessed pure love for Narayana from infancy.</p>\n\n      <h3>Persecution and Miraculous Protection</h3>\n      <p>Furious at his son's defiance, Hiranyakashipu subjected the child to tortures: poisoned chalices, stampeding wild elephants, pits of venomous vipers, throwing him from Himalayan cliffs, and placing him in a blazing furnace in the lap of Holika (who held a fireproof shawl). In every ordeal, Prahlada chanted Vishnu's name without malice toward his torturers, emerging unharmed while Holika burned.</p>\n\n      <h3>Outcome: Bursting of the Pillar & Coronation</h3>\n      <p>When the tyrant struck a palace pillar shouting, <em>\"Is your Vishnu in this pillar?\"</em>, Narasimha burst forth with a roar that shook creation. Following the demon's fall, Prahlada was crowned king, inaugurating a golden era of righteous Asura governance.</p>\n    ","childrenIds":["narasimha_savior"],"title_hi":"भक्त प्रह्लाद (परम भागवत)","epoch_hi":"अनन्य भक्ति एवं अटल विश्वास","summary_hi":"हिरण्यकशिपु का पुत्र, जिसे विष, अग्नि, सर्प और हाथियों से मारने का प्रयास किया गया, किंतु जिसकी अनन्य हरि-भक्ति से नृसिंह प्रकट हुए।","quote_hi":"हरिर्वर्तते सर्वत्र — इस पाषाण के खंभे में भी मेरे श्रीहरि साक्षात् विराजमान हैं!","content_hi":"\n      <h3>गर्भ में नारद जी से ज्ञान</h3>\n      <p>जब प्रह्लाद माता कयाधु के गर्भ में थे, तब देवर्षि नारद ने उन्हें भगवद्-भक्ति का उपदेश दिया। असुर कुल में जन्म लेने के बाद भी प्रह्लाद का हृदय बचपन से ही केवल श्रीहरि के चरणों में रमा रहा।</p>\n\n      <h3>अत्याचार एवं प्रभु की रक्षा</h3>\n      <p>पिता हिरण्यकशिपु ने प्रह्लाद को मारने के लिए विष का प्याला दिया, मतवाले हाथियों के पैरों तले कुचलवाया, विषैले सर्पों के बीच फिंकवाया और होलिका की गोद में अग्नि में बैठाया। भगवान की कृपा से विष अमृत बन गया और होलिका स्वयं जल गई, किंतु प्रह्लाद का बाल भी बांका न हुआ।</p>\n\n      <h3>परिणाम एवं खंभे से नृसिंह प्राकट्य</h3>\n      <p>जब पिता ने खंभे पर प्रहार कर पूछा — 'क्या तेरा विष्णु इसमें है?', तब उसी क्षण खंभा फाड़कर भगवान नृसिंह प्रकट हुए। हिरण्यकशिपु के वध के बाद प्रह्लाद को राजा बनाया गया, जिन्होंने धर्मपूर्वक राज्य कर भक्ति का परम आदर्श स्थापित किया।</p>\n    "},{"id":"narasimha_savior","title":"Narasimha (Savior)","sanskrit":"नरसिंह (भक्तवत्सल)","category":"avatar","epoch":"Deliverance of Prahlada","tier":11,"parentId":"prahlada","x":240,"y":-520,"z":880,"symbol3D":"chakra","image":"assets/images/narasimha_savior.jpg","quote":"Sthambhe prahaara krita — Bursting from the stone pillar with a roar that shook the cosmos","summary":"The ferocious Man-Lion bursting from the pillar at twilight to fulfill Brahma's boon and save Prahlada.","content":"\n      <h3>The Impossible Riddle of Brahma's Boon</h3>\n      <p>To vanquish Hiranyakashipu, divine justice could not violate the word of Brahma: the slayer could be neither man nor beast; the death could occur neither by day nor night, neither indoors nor outdoors, neither on earth nor sky, and by no manufactured weapon.</p>\n\n      <h3>The Descent at Twilight</h3>\n      <p>As the tyrant raised his sword to execute Prahlada, the stone pillar shattered with a thunderous roar. Out leaped Narasimha: head of a lion, body of a man (neither man nor beast). Dragging the tyrant to the palace threshold (neither indoors nor outdoors) at twilight (neither day nor night), Narasimha placed him across his thighs (neither earth nor sky) and disemboweled him using sharp divine claws (no manufactured weapon).</p>\n\n      <h3>Outcome: The Triumph of Bhakti</h3>\n      <p>Even the Devas feared Narasimha's roaring cosmic fury until young Prahlada stepped forward and offered flowers. The Lord melted into tears of maternal love, licking the child's face like a lioness with her cub. Narasimha proves that God will break through the fabric of reality itself to protect a sincere devotee.</p>\n    ","childrenIds":[],"title_hi":"भगवान नृसिंह (भक्तवत्सल)","epoch_hi":"प्रह्लाद-उद्धार एवं अधर्म-दलन","summary_hi":"खंभे को चीरकर प्रकट हुए आधे मनुष्य और आधे सिंह स्वरूप प्रभु, जिन्होंने गोधूलि वेला में देहरी पर हिरण्यकशिपु का वध किया।","quote_hi":"स्तम्भे प्रहारः कृतः — सिंहनाद से ब्रह्माण्ड को कंपित करते हुए पाषाण-स्तंभ से प्रकट हुए प्रभु","content_hi":"\n      <h3>वरदान की मर्यादा और प्रभु की लीला</h3>\n      <p>ब्रह्मा जी के वरदान का सम्मान करते हुए प्रभु ने ऐसा रूप और समय चुना जो वरदान की प्रत्येक शर्त को पूरा करता था — न मनुष्य, न पशु; न दिन, न रात; न घर के भीतर, न बाहर; न अस्त्र, न शस्त्र।</p>\n\n      <h3>दहल उठा ब्रह्माण्ड: स्तंभ-भेदन</h3>\n      <p>सायंकाल (गोधूलि वेला) में जब हिरण्यकशिपु ने तलवार उठाई, तब खंभे से भयंकर गर्जना के साथ भगवान नृसिंह प्रकट हुए। उन्होंने दैत्य को पकड़कर राजमहल की देहरी पर अपनी जांघों पर लिटाया और अपने तीखे नाखूनों से उसका सीना चीरकर वध कर दिया।</p>\n\n      <h3>परिणाम एवं भक्त पर वात्सल्य</h3>\n      <p>भगवान के महाक्रोध को देखकर ब्रह्मा, शिव और समस्त देव काँपने लगे। जब बालक प्रह्लाद ने हाथ जोड़कर स्तुति की, तो प्रभु का क्रोध शांत हुआ और उन्होंने प्रह्लाद को गोद में उठाकर प्रेम से अश्रु बहाए। भगवान नृसिंह यह विश्वास दिलाते हैं कि सच्चे भक्त की पुकार पर प्रभु हर बंधन तोड़कर दौड़े चले आते हैं।</p>\n    "},{"id":"kadru","title":"Kadru","sanskrit":"कद्रू (नागमाता)","category":"lineage","epoch":"Mother of Serpents","tier":7,"parentId":"kashyapa","x":300,"y":-280,"z":560,"symbol3D":"mandala","image":"assets/images/kadru.jpg","quote":"Naga-janani — Mother of the thousand glorious serpents of Patala","summary":"Wife of Kashyapa and mother of the subterranean Naga dynasties, including Shesha, Vasuki, and Takshaka.","content":"\n      <h3>The Matriarch of the Subterranean Realms</h3>\n      <p>Kadru, daughter of Daksha and wife of Kashyapa, desired a thousand powerful serpent sons to govern the mystical subterranean spheres. Her sister Vinata prayed for only two sons, but endowed with superior splendor (Aruna and Garuda).</p>\n\n      <h3>The Bet and the Horse's Tail</h3>\n      <p>A rivalry arose over the color of the divine flying horse Uchchaihshravas. Kadru wagered that its tail was black, while Vinata saw it was white. Kadru commanded her serpent sons to entwine themselves around the tail like black hairs to deceive Vinata, subjecting Vinata to servitude until freed by Garuda's retrieval of Amrita.</p>\n\n      <h3>Outcome: Guardians of Patala</h3>\n      <p>Kadru's progeny became the guardians of the seven subterranean realms (Atala to Patala), presiding over secret treasures, water reservoirs, and occult wisdom.</p>\n    ","childrenIds":["nagas"],"title_hi":"माता कद्रू (नागमाता)","epoch_hi":"पाताल लोक एवं नाग वंश की उत्पत्ति","summary_hi":"कश्यप की पत्नी और नागों की माता, जिनके गर्व और प्रतिस्पर्धा से शेष, वासुकि और तक्षक जैसे नाग कुल जन्मे।","quote_hi":"नागजननी — पाताल लोक के सहस्रों दिव्य और तेजस्वी नागों की माता","content_hi":"\n      <h3>पाताल लोक के नाग वंश की उत्पत्ति</h3>\n      <p>माता कद्रू दक्ष की पुत्री और महर्षि कश्यप की पत्नी थीं। उन्होंने कश्यप जी से सहस्र तेजस्वी नाग-पुत्रों की प्राप्ति का वरदान माँगा, जबकि उनकी बहन विनता ने केवल दो अत्यंत बलशाली पुत्र (अरुण और गरुड़) माँगे।</p>\n\n      <h3>उच्चैःश्रवा अश्व और शर्त</h3>\n      <p>समुद्र मंथन से निकले श्वेत अश्व उच्चैःश्रवा की पूंछ के रंग को लेकर दोनों बहनों में शर्त लगी। कद्रू ने छलपूर्वक अपने काले नाग-पुत्रों को घोड़े की पूंछ से लिपट जाने को कहा, जिससे पूंछ काली दिखने लगी और विनता दासी बन गईं। बाद में गरुड़ जी अमृत लाकर माता को मुक्त कराया।</p>\n\n      <h3>परिणाम एवं नागों की महत्ता</h3>\n      <p>कद्रू के पुत्रों — शेष, वासुकि, तक्षक आदि ने पाताल लोक के सात भुवनों में अपना आधिपत्य स्थापित किया। वे भूमिगत जल-स्रोतों, मणियों और गुप्त रहस्यों के रक्षक बने।</p>\n    "},{"id":"nagas","title":"Nagas","sanskrit":"नागाः (पातालवासिनः)","category":"lineage","epoch":"The Serpentine Dynasties","tier":8,"parentId":"kadru","x":300,"y":-340,"z":640,"symbol3D":"mandala","image":"assets/images/nagas.jpg","quote":"Patalaloka-rakshakah — Guardians of the mystical underworld realms","summary":"The divine subterranean serpents possessing magical shape-shifting power, venom, gems, and immortality secrets.","content":"\n      <h3>The Mystical Underworld Dynasties</h3>\n      <p>The Nagas bridge the terrestrial, aquatic, and subterranean planes. Residing in the jeweled city of Bhogavati in Patala, they possess shape-shifting abilities, venom that can incinerate planets, and celestial gems (Nagamani) conferring immortality.</p>\n\n      <h3>Role in Epic Lore</h3>\n      <p>The Nagas play pivotal roles across all yugas: Vasuki served as the rope in Samudra Manthan; Takshaka was destined to bite King Parikshit to inaugurate the full sway of Kali Yuga; and Naga princesses like Ulupi married Arjuna during his pilgrimage.</p>\n\n      <h3>Outcome: The Sanctity of the Serpent</h3>\n      <p>Celebrated annually during Nag Panchami, the Nagas represent the dormant serpent energy (Kundalini) coiled at the base of human consciousness, awaiting spiritual elevation.</p>\n    ","childrenIds":["shesha_naga"],"title_hi":"नाग वंश (पातालवासी दिव्य सर्प)","epoch_hi":"पाताल लोक एवं मणियों के रक्षक","summary_hi":"दिव्य सर्पों की शक्तिशाली जातियाँ, जो भोगवती और पाताल लोक में निवास करती हैं, जिनके मस्तक पर मणियाँ चमकती हैं।","quote_hi":"पाताललोक-रक्षकाः — पाताल की मणियों, जल-स्रोतों और उर्वरता के दिव्य संरक्षक","content_hi":"\n      <h3>पाताल की समृद्ध सभ्यता</h3>\n      <p>नाग वंश पाताल लोक की राजधानी भोगवती में निवास करता है। वे इच्छाधारी शक्ति, तीक्ष्ण विष और मस्तकों पर दिव्य 'नागमणि' धारण करते हैं।</p>\n\n      <h3>महाभारत एवं पुराणों में भूमिका</h3>\n      <p>नागों की भूमिका प्रत्येक युग में केंद्रीय रही है: समुद्र मंथन में वासुकि ने मंथन-रज्जु का कार्य किया; तक्षक ने राजा परीक्षित को डसकर कलियुग के पूर्ण प्रभाव का मार्ग खोला; और नागकन्या उलूपी ने अर्जुन से विवाह किया।</p>\n\n      <h3>परिणाम एवं नाग पंचमी</h3>\n      <p>नाग पंचमी के दिन नागों की पूजा की जाती है। आध्यात्मिक दृष्टि से नाग मनुष्य के भीतर स्थित सुप्त कुण्डलिनी शक्ति के प्रतीक हैं, जो जाग्रत होकर मोक्ष का मार्ग प्रशस्त करती है।</p>\n    "},{"id":"shesha_naga","title":"Shesha, Vasuki & Takshaka","sanskrit":"शेष, वासुकि एवं तक्षक","category":"lineage","epoch":"Supreme Serpent Kings","tier":9,"parentId":"nagas","x":300,"y":-400,"z":720,"symbol3D":"mandala","image":"assets/images/shesha_naga.jpg","quote":"Vasuki manthana-rajju — Vasuki served as the rope to churn the cosmic ocean","summary":"The foremost serpent lords: Shesha the divine couch of Narayana, Vasuki the churning rope of Samudra Manthan.","content":"\n      <h3>The Three Great Serpent Sovereigns</h3>\n      <p>Among the thousand sons of Kadru, three attained pre-eminent status through their choices: Shesha chose ascetic devotion, Vasuki chose sovereign service, and Takshaka chose fierce temporal power.</p>\n\n      <h3>The Churning of the Ocean</h3>\n      <p>When gods and titans needed to churn the cosmic milk ocean, King Vasuki offered his own colossal body as the churning rope wrapped around Mount Mandara. Tolerating excruciating friction and the fires of Halahala, Vasuki bore immense suffering solely for the welfare of creation.</p>\n\n      <h3>Outcome: Ornaments of the Supreme</h3>\n      <p>For his selfless sacrifice, Lord Shiva adorned Vasuki around his neck as his eternal serpent ornament, while Shesha became the bed of Narayana, demonstrating that surrender to the divine elevates even serpentine nature to supreme holiness.</p>\n    ","childrenIds":[],"title_hi":"शेष, वासुकि एवं तक्षक (नागराज)","epoch_hi":"समुद्र मंथन एवं पाताल के स्वामी","summary_hi":"नागों के तीन प्रमुख सम्राट: शेषनाग (विष्णु-शय्या), वासुकि (समुद्र मंथन की रज्जु) और तक्षक (तक्षकशिला के स्वामी)।","quote_hi":"वासुकिर्मन्थन-रज्जुः — समुद्र मंथन में मन्दराचल को मथने हेतु स्वयं को रस्सी बनाने वाले नागराज","content_hi":"\n      <h3>नागों के तीन महान सम्राट</h3>\n      <p>कद्रू के पुत्रों में तीन नाग सर्वोपरि हुए: शेषनाग ने तपस्या कर भगवान विष्णु की सेवा चुनी; वासुकि ने देवों और असुरों के कल्याण के लिए त्याग चुना; और तक्षक ने तक्षशिला में अपना साम्राज्य स्थापित किया।</p>\n\n      <h3>समुद्र मंथन में वासुकि का त्याग</h3>\n      <p>जब अमृत प्राप्ति के लिए मन्दराचल पर्वत से क्षीरसागर को मथना था, तब वासुकि नाग स्वयं मंथन की रस्सी बने। मंथन के घर्षण और विष की ज्वाला को उन्होंने लोक-कल्याण के लिए धैर्यपूर्वक सहन किया।</p>\n\n      <h3>परिणाम एवं शिव का कंठहार</h3>\n      <p>वासुकि के इस त्याग से प्रसन्न होकर महादेव शिव ने उन्हें अपने गले का हार बनाया। यह आख्यान सिखाता है कि जब कोई अपना सामर्थ्य लोक-कल्याण में समर्पित करता है, तो वह ईश्वर का सबसे प्रिय बन जाता है।</p>\n    "},{"id":"vishnu_avatars","title":"Vishnu Avatars","sanskrit":"विष्णोः दशावताराः","category":"avatar","epoch":"Across All Cosmic Epochs","tier":10,"parentId":"brahman","x":0,"y":-480,"z":950,"symbol3D":"chakra","image":"assets/images/dashavatara.jpg","quote":"Yada yada hi dharmasya glanir bhavati bharata — Whenever dharma declines, I descend (Bhagavad Gita 4.7)","summary":"The periodic cosmic descents of Vishnu across the Yugas to re-establish cosmic balance and inspire humanity.","content":"\n      <h3>The Evolutionary Descents of Narayana</h3>\n      <p>The doctrine of Avatāra represents the conscious descent of the Infinite into the finite to restore moral equilibrium whenever adharma disrupts cosmic harmony. Remarkably, the traditional sequence maps the spiritual and physical evolution of life: from aquatic (Matsya), amphibian (Kurma), terrestrial mammal (Varaha), half-man (Narasimha), dwarf human (Vamana), fierce warrior (Parashurama), noble monarch (Rama), supreme diplomat and philosopher (Krishna), to the future transformer (Kalki).</p>\n\n      <h3>How the Avatar Operates</h3>\n      <p>An Avatar does not cancel the laws of karma, but enters within their matrix, demonstrating through human joy, sorrow, duty, and sacrifice how mortals can elevate themselves to divine consciousness.</p>\n\n      <h3>Outcome: The Eternal Beacon</h3>\n      <p>The Dashavatara reassures humanity that evil and decay are never permanent. No matter how deep the moral darkness, divine grace will manifest in appropriate form to safeguard truth and awaken human nobility.</p>\n    ","childrenIds":["matsya","kurma","varaha","narasimha","vamana","parashurama"],"title_hi":"भगवान विष्णु के दशावतार","epoch_hi":"युगांतरकारी चेतना का क्रमिक विकास","summary_hi":"सत्ययुग से कलियुग तक धर्म-रक्षा एवं चेतना के विकास हेतु भगवान नारायण के दस प्रमुख अवतरण।","quote_hi":"यदा यदा हि धर्मस्य ग्लानिर्भवति भारत — जब-जब धर्म की हानि होती है, तब-तब मैं स्वयं को प्रकट करता हूँ (भगवद्गीता ४.७)","content_hi":"\n      <h3>अवतार का प्रयोजन एवं क्रमिक विकास</h3>\n      <p>अवतार का अर्थ है 'ऊपर से नीचे उतरना' — परमात्मा का धर्म-रक्षा हेतु साकार रूप धारण करना। दशावतार की यह श्रृंखला चेतना के विकास को भी दर्शाती है: जलचर (मत्स्य), उभयचर (कूर्म), थलचर (वराह), नर-पशु (नृसिंह), लघु मानव (वामन), वनवासी योद्धा (परशुराम), मर्यादित राजा (श्रीराम), और पूर्ण योगी (श्रीकृष्ण)।</p>\n\n      <h3>लीला एवं कर्म-सिद्धांत</h3>\n      <p>अवतार कर्म के नियमों को नष्ट नहीं करते, बल्कि मानव रूप में स्वयं सुख-दुःख और धर्म-संकटों को झेलकर समाज को आदर्श जीवन जीने का मार्ग दिखाते हैं।</p>\n\n      <h3>परिणाम एवं शाश्वत आशा</h3>\n      <p>दशावतार का दर्शन मानवता को यह अटल विश्वास देता है कि अधर्म कितना भी प्रबल क्यों न हो जाए, धर्म का विनाश कभी संभव नहीं है; परमात्मा स्वयं समय-समय पर आकर संतों का उद्धार करते हैं।</p>\n    "},{"id":"matsya","title":"Matsya","sanskrit":"मत्स्य अवतार","category":"avatar","epoch":"Satya Yuga (Golden Age)","tier":11,"parentId":"vishnu_avatars","x":-150,"y":-540,"z":1030,"symbol3D":"chakra","image":"assets/images/matsya.jpg","quote":"Pralaye payodhijale dhritavanasi vedam — In the waters of dissolution, thou didst rescue the Vedas (Gita Govinda)","summary":"The golden Horned Fish who saved King Satyavrata (Manu), the Saptarshis, and the sacred Vedas during the great deluge.","content":"\n      <h3>The Deluge & Theft of Sacred Knowledge</h3>\n      <p>At the end of the previous cosmic Kalpa, while Brahma slept, the demon Hayagriva stole the sacred Vedas, casting the cosmos into spiritual ignorance. Simultaneously, a catastrophic deluge (Pralaya) began submerging the three worlds in turbulent cosmic waters.</p>\n\n      <h3>The Tiny Fish that Filled the Ocean</h3>\n      <p>Vishnu manifested as a tiny golden horned fish (Matsya) in the hands of the pious Dravidian king Satyavrata (Manu) as he offered water to the sun. Growing rapidly from a jar to a pond, lake, river, and finally the ocean, Matsya instructed Manu to build a massive ship carrying the seeds of all plants, pairs of animals, and the Saptarshis. When the flood roared, Matsya used serpent Vasuki as a rope tied to his golden horn, towing the ark through the tempest and slaying Hayagriva to retrieve the Vedas.</p>\n\n      <h3>Outcome: The Bridge to the New Era</h3>\n      <p>Matsya delivered sacred knowledge across the cosmic boundary of destruction, establishing Manu as the progenitor of our current human era and teaching that righteousness endures even the dissolution of worlds.</p>\n    ","childrenIds":[],"title_hi":"मत्स्य अवतार (प्रलय में वेदरक्षा)","epoch_hi":"सत्ययुग का आरंभ एवं महाजलप्लावन","summary_hi":"स्वर्ण-शृंग वाले महामत्स्य, जिन्होंने महाप्रलय में राजा सत्यव्रत (मनु), सप्तऋषियों और वेदों की रक्षा की।","quote_hi":"प्रलयपयोधिजले धृतवानसि वेदम् — प्रलय के महासागर में तैरते हुए वेदों की रक्षा करने वाले श्रीहरि (गीतगोविन्द)","content_hi":"\n      <h3>कारण: हयग्रीव द्वारा वेद-हरण एवं महाप्रलय</h3>\n      <p>कल्प के अंत में जब ब्रह्मा जी विश्राम कर रहे थे, तब हयग्रीव दैत्य ने चारों वेदों को चुराकर समुद्र के अंधकार में छिपा दिया। ज्ञान के अभाव में अधर्म फैलने लगा और तीनों लोकों को डुबोने वाला प्रलयकारी जल उमड़ पड़ा।</p>\n\n      <h3>लीला: अंजलि में नन्हीं मछली से महामत्स्य</h3>\n      <p>राजा सत्यव्रत (मनु) जब नदी में सूर्य को अर्घ्य दे रहे थे, तब एक छोटी सी सुनहरी मछली उनकी अंजलि में आई। देखते ही देखते वह विशाल महामत्स्य बन गई। भगवान ने मनु को एक विशाल नौका में समस्त औषधियाँ, बीज, जीव-जंतु और सप्तऋषियों को बैठाने का आदेश दिया। प्रलय आने पर वासुकि नाग की रस्सी से उस नौका को अपने सींग से बांधकर भगवान ने तूफानी सागर में पार लगाया और हयग्रीव का वध कर वेद लौटाए।</p>\n\n      <h3>परिणाम एवं नई मानवता की नींव</h3>\n      <p>भगवान मत्स्य ने वेदों और जीवन के बीजों की रक्षा की, जिससे प्रलय के बाद नए सत्ययुग और मानव सभ्यता का उदय संभव हो सका।</p>\n    "},{"id":"kurma","title":"Kurma","sanskrit":"कूर्म अवतार","category":"avatar","epoch":"Satya Yuga (Samudra Manthan)","tier":11,"parentId":"vishnu_avatars","x":-90,"y":-540,"z":1030,"symbol3D":"chakra","image":"assets/images/samudra_manthan.jpg","quote":"Mandara-dharaka — Supporting Mount Mandara upon his divine shell","summary":"The Cosmic Tortoise who bore Mount Mandara upon his back during the churning of the Ocean of Milk.","content":"\n      <h3>The Crisis of Sinking Mount Mandara</h3>\n      <p>During the churning of the Ocean of Milk (Samudra Manthan), the churners used Mount Mandara as the churning rod. Because the ocean bed was soft mud without solid foundation, the colossal mountain began sinking rapidly into the subterranean depths, threatening to crush the endeavor and swallow gods and demons alike.</p>\n\n      <h3>The Unshakeable Cosmic Pivot</h3>\n      <p>Vishnu assumed the form of a gigantic tortoise (Kurma) with a shell spanning millions of leagues. Diving to the seabed, he placed his rock-hard carapace beneath Mount Mandara, providing an unshakeable fulcrum. As gods and demons pulled serpent Vasuki to and fro, the friction of the mountain rotating on Kurma's shell served as a pleasant soothing scratching for the cosmic Lord.</p>\n\n      <h3>Outcome: Emergence of the 14 Jewels</h3>\n      <p>Supported by Kurma, the churning yielded the 14 sacred treasures: the physician Dhanvantari bearing the Amrita (nectar of immortality), Goddess Lakshmi, the wish-fulfilling cow Kamadhenu, the moon Chandra, and the Kaustubha gem, restoring divine equilibrium.</p>\n    ","childrenIds":[],"title_hi":"कूर्म अवतार (कच्छप स्वरूप)","epoch_hi":"सत्ययुग — समुद्र मंथन की धुरी","summary_hi":"क्षीरसागर में मन्दराचल पर्वत को अपनी विशाल पीठ पर धारण करने वाले महाकच्छप, जिनके सहयोग से अमृत निकला।","quote_hi":"मन्दराचल-धारक — क्षीरसागर में अपनी विशाल पीठ पर मन्दराचल पर्वत को थामने वाले कच्छपरूपी प्रभु","content_hi":"\n      <h3>कारण: मन्दराचल पर्वत का डूबना</h3>\n      <p>समुद्र मंथन के समय जब मन्दराचल पर्वत को मथनी बनाया गया, तो नीचे कोई ठोस आधार न होने के कारण वह विशाल पर्वत क्षीरसागर की गहराई में पाताल की ओर धंसने लगा। इससे मंथन रुक गया और समस्त देव-असुर निराश हो गए।</p>\n\n      <h3>लीला: विशाल कच्छप की पीठ का आधार</h3>\n      <p>भगवान विष्णु ने लाखों योजन विस्तृत विशाल कछुए (कूर्म) का रूप धारण किया और समुद्र की तलहटी में जाकर मन्दराचल को अपनी कठोर पीठ पर उठा लिया। पर्वत के घूमने से उत्पन्न घर्षण भगवान की पीठ पर सुखद खुजली के समान अनुभव हुआ और मंथन पुनः तीव्र गति से आरंभ हुआ।</p>\n\n      <h3>परिणाम: चौदह रत्नों एवं अमृत का प्राकट्य</h3>\n      <p>भगवान कूर्म के दृढ़ आधार से ही समुद्र मंथन सफल हुआ, जिससे माता लक्ष्मी, कामधेनु, ऐरावत, कौस्तुभ मणि, धन्वंतरि और अंततः 'अमृत' प्रकट हुआ। यह अवतार सिखाता है कि किसी भी महान कार्य की सफलता के लिए एक दृढ़ और निःस्वार्थ आधार की आवश्यकता होती है।</p>\n    "},{"id":"varaha","title":"Varaha","sanskrit":"वराह अवतार","category":"avatar","epoch":"Satya Yuga","tier":11,"parentId":"vishnu_avatars","x":-30,"y":-540,"z":1030,"symbol3D":"chakra","image":"assets/images/varaha.jpg","quote":"Bhumim uddharate — Lifting the Mother Earth upon his white tusks","summary":"The Divine Boar who dove into the cosmic abyss of Rasatala, slew Hiranyaksha, and raised Mother Earth into orbit.","content":"\n      <h3>Mother Earth Submerged</h3>\n      <p>When the demon Hiranyaksha abducted the Earth into the muck of the universal abyss Rasatala, planetary life ceased. Without a terrestrial sphere, living beings could not perform sacrifices or cultivate karma.</p>\n\n      <h3>The Boar Emerging from Brahma's Nostril</h3>\n      <p>As Brahma contemplated the crisis, a thumb-sized creature issued from his nostril. Before the astonished rishis, it expanded instantaneously into a colossal radiant boar with flaming red eyes, bristles like lightning, and tusks gleaming like mountains. Plunging into the primeval waters, Varaha tracked Earth by fragrance, slew Hiranyaksha with his mace, and lifted the trembling Bhudevi onto his tusks.</p>\n\n      <h3>Outcome: The Shvetavaraha Kalpa</h3>\n      <p>Varaha gently established Earth upon the cosmic ocean, blessing her with vegetation and stability. In honor of this rescue, our entire current cosmic aeon is named the <strong>Śvetavarāha Kalpa</strong>, embodying the sanctity of ecology and the maternal earth.</p>\n    ","childrenIds":[],"title_hi":"वराह अवतार (श्वेत वराह)","epoch_hi":"सत्ययुग — भूदेवी का उद्धार","summary_hi":"ब्रह्मा की नासिका से अंगूठे के आकार में प्रकट होकर पर्वताकार बने श्वेत वराह, जिन्होंने हिरण्याक्ष को मारकर धरती को जल से उबारा।","quote_hi":"भूमिमुद्धरते — रसातल के अंधकार से अपनी श्वेत दाढ़ों पर पृथ्वी माता को धारण कर लाने वाले","content_hi":"\n      <h3>कारण: भूदेवी का जलमग्न होना</h3>\n      <p>हिरण्याक्ष दैत्य ने पृथ्वी को खींचकर रसातल के गंदे कीचड़ में डुबो दिया था। पृथ्वी के न होने से जीवों का जीवन और धर्म-कर्म सब रुक गया था।</p>\n\n      <h3>लीला: ब्रह्मा की नासिका से प्रकटीकरण</h3>\n      <p>ब्रह्मा जी के ध्यान करते ही उनकी नासिका से अंगूठे के आकार का एक बालक वराह निकला, जो देखते ही देखते आकाश को छूने वाला पर्वताकार महावराह बन गया। उन्होंने अतल जल में डुबकी लगाकर अपनी घ्राण-शक्ति से पृथ्वी का पता लगाया। हिरण्याक्ष का वध करके भगवान ने पृथ्वी को अपनी दाढ़ों पर उठा लिया।</p>\n\n      <h3>परिणाम एवं श्वेतवराह कल्प</h3>\n      <p>भगवान ने धरती को पुनः अपने अक्ष पर स्थापित किया और उस पर जीवन लौटाया। इस उद्धार के सम्मान में हमारे वर्तमान कल्प का नाम 'श्वेतवराह कल्प' रखा गया है, जो पृथ्वी और पर्यावरण की पवित्रता का प्रतीक है।</p>\n    "},{"id":"narasimha","title":"Narasimha","sanskrit":"नरसिंह अवतार","category":"avatar","epoch":"Satya Yuga","tier":11,"parentId":"vishnu_avatars","x":30,"y":-540,"z":1030,"symbol3D":"chakra","image":"assets/images/narasimha.jpg","quote":"Daitya-vakshah-sthala vidarana — Tearing open the chest of the tyrant king","summary":"The Man-Lion avatar delivering child-devotee Prahlada and destroying tyrannical arrogance.","content":"\n      <h3>The Invulnerable Tyrant</h3>\n      <p>Hiranyakashipu's tyrannical reign seemed impervious to divine intervention due to Brahma's intricate boon protecting him from every known category of natural death.</p>\n\n      <h3>The Shattering of the Pillar</h3>\n      <p>Rejecting all weapons and conventional warriors, the Lord manifested as Narasimha. Bursting from a palace pillar at dusk, he dragged the tyrant to the threshold, placed him upon his lap, and ripped his chest open with sharp claws, fulfilling every condition of the boon to the exact letter while restoring truth.</p>\n\n      <h3>Outcome: Fearlessness for the Devotee</h3>\n      <p>Narasimha proved that human-crafted laws and arrogant loopholes can never outwit cosmic justice. To this day, chanting the Narasimha Kavacha is revered for dissolving terrifying psychological fears and shielding the innocent.</p>\n    ","childrenIds":[],"title_hi":"नृसिंह अवतार (अधर्म का संहार)","epoch_hi":"सत्ययुग — हिरण्यकशिपु वध","summary_hi":"आधा मनुष्य और आधा सिंह रूप धरकर गोधूलि वेला में महल की देहरी पर हिरण्यकशिपु का वध करने वाले महापराक्रमी प्रभु।","quote_hi":"दैत्यवक्षःस्थल विदारण — अपने तीक्ष्ण नखों से अत्याचारी दैत्यराज के वक्षस्थल को विदीर्ण करने वाले","content_hi":"\n      <h3>अत्याचार का चरम</h3>\n      <p>हिरण्यकशिपु ने स्वयं को भगवान मानकर संतों और भक्तों पर अमानवीय अत्याचार किए। उसे अपने वरदान की शर्तों पर अटूट विश्वास था कि कोई उसे मार नहीं सकता।</p>\n\n      <h3>स्तंभ से प्राकट्य एवं वध</h3>\n      <p>संध्या के समय खंभे को चीरकर भगवान नृसिंह ने अवतार लिया। न दिन था न रात, न भीतर था न बाहर। देहरी पर अपनी जांघों पर रखकर नखों से उसका वध कर दिया। वरदान की एक भी शर्त का उल्लंघन किए बिना अधर्म का अंत किया।</p>\n\n      <h3>परिणाम एवं अभयदान</h3>\n      <p>भक्त प्रह्लाद की रक्षा कर भगवान ने यह सिद्ध किया कि अहंकार चाहे कितना भी सुरक्षित कवच बना ले, सत्य के सामने वह तिनके के समान बिखर जाता है।</p>\n    "},{"id":"vamana","title":"Vamana","sanskrit":"वामन अवतार (त्रिविक्रम)","category":"avatar","epoch":"Satya-Treta Transition","tier":11,"parentId":"vishnu_avatars","x":90,"y":-540,"z":1030,"symbol3D":"chakra","image":"assets/images/vamana.jpg","quote":"Padatrayena lokatrayam kranta — Measuring the three worlds with three strides","summary":"The radiant Dwarf Brahmin who appeared at King Mahabali's sacrificial arena, asking for only three paces of land.","content":"\n      <h3>The Threat of Righteous Ambition</h3>\n      <p>King Mahabali conquered the three worlds not through cruelty, but through unmatched piety, generosity, and rigorous Vedic yajnas. However, heaven cannot belong to temporal ego, and Indra's cosmic displacement required resolution without unfairly punishing a noble king.</p>\n\n      <h3>The Three Paces of Land</h3>\n      <p>Vishnu was born as the dwarfish celibate boy Vamana to Aditi and Kashyapa. Carrying a wooden umbrella and water vessel, he arrived at Mahabali's Ashvamedha Yajna. Refusing gold and kingdoms, he requested only the land measured by three of his tiny paces. Despite his guru Shukracharya warning that the dwarf was Vishnu himself, Mahabali vowed to honor his word.</p>\n\n      <h3>Outcome: The Cosmic Expansion (Trivikrama)</h3>\n      <p>Vamana expanded into the cosmic colossus Trivikrama: step one covered the earth, step two the heavens. For step three, lacking space, Mahabali humbly offered his own crowned head. Pleased by his absolute surrender, Vamana placed his foot upon him, elevating him to eternal sovereignty over the golden paradise of Sutala and granting him his constant personal presence.</p>\n    ","childrenIds":["mahabali"],"title_hi":"वामन अवतार (त्रिविक्रम)","epoch_hi":"सत्य-त्रेता संधि — तीन पग में त्रिलोकी","summary_hi":"बटु ब्राह्मण बनकर राजा बलि के यज्ञ में पधारे भगवान विष्णु, जिन्होंने तीन पग में तीनों लोकों को नाप लिया।","quote_hi":"पदत्रयेण लोकत्रयं क्रान्तः — अपने तीन पगों में तीनों लोकों और ब्रह्माण्ड को नाप लेने वाले त्रिविक्रम प्रभु","content_hi":"\n      <h3>कारण: राजा बलि का स्वर्ग पर आधिपत्य</h3>\n      <p>प्रह्लाद के पौत्र राजा बलि ने १०० अश्वमेध यज्ञ पूरे कर स्वर्ग के सिंहासन पर अधिकार कर लिया था। बलि परम दानी और धर्मात्मा थे, किंतु इन्द्र का पद किसी व्यक्ति की निजी संपत्ति नहीं हो सकता था।</p>\n\n      <h3>लीला: तीन पग भूमि का दान</h3>\n      <p>भगवान विष्णु माता अदिति के गर्भ से छोटे ब्राह्मण बालक (वामन) के रूप में प्रकट हुए। वे हाथ में छत्र और कमण्डल लेकर बलि के यज्ञ में पहुँचे। उन्होंने दान में केवल अपने पैरों से 'तीन पग भूमि' माँगी। गुरु शुक्राचार्य के सावधान करने पर भी बलि ने अपने वचन से पीछे हटने से मना कर दिया और संकल्प कर दिया।</p>\n\n      <h3>परिणाम: त्रिविक्रम स्वरूप एवं बलि का समर्पण</h3>\n      <p>भगवान ने विराट 'त्रिविक्रम' रूप धारण किया। एक पग में पृथ्वी और दूसरे पग में स्वर्ग नाप लिया। तीसरा पग रखने के लिए जब कोई स्थान न बचा, तो राजा बलि ने अपना मस्तक आगे कर दिया। भगवान ने उनके मस्तक पर चरण रखकर उन्हें पाताल के श्रेष्ठ लोक 'सुतल' का अमर राजा बना दिया और स्वयं उनके द्वारपाल बने। यह आख्यान अहंकार-रहित पूर्ण समर्पण (आत्मनिवेदन) का प्रतीक है।</p>\n    "},{"id":"mahabali","title":"Mahabali","sanskrit":"महाबलि (इन्द्रसेव)","category":"lineage","epoch":"Sovereign of Generosity","tier":12,"parentId":"vamana","x":90,"y":-600,"z":1100,"symbol3D":"mandala","image":"assets/images/mahabali.jpg","quote":"Satyam na tyajami — I shall not abandon truth, even if it costs my empire","summary":"Grandson of Prahlada, celebrated for peerless magnanimity and destined to become the Indra of the next Manvantara.","content":"\n      <h3>The Epitome of Royal Magnanimity</h3>\n      <p>Grandson of Prahlada, King Mahabali governed an empire so prosperous and just that neither hunger, deceit, nor premature deaths afflicted his people. His flaw was subtle: subtle pride in being the supreme giver (Daani).</p>\n\n      <h3>Surrendering Head and Empire</h3>\n      <p>When Vamana stood before him with the third step suspended in mid-air, Mahabali realized the divine opportunity. He chose to honor his pledge at the cost of his kingdom and physical liberty, bowing his head so the cosmic foot could bless him.</p>\n\n      <h3>Outcome: The Lord as Gatekeeper & Onam</h3>\n      <p>For his absolute integrity, Vishnu blessed him with immortality, rulership of Sutala, and decreed that Mahabali will become the Indra of the upcoming Savarni Manvantara. To this day, the harvest festival of Onam in Kerala celebrates Mahabali's annual return to visit his beloved subjects.</p>\n    ","childrenIds":[],"title_hi":"महाबली (सत्यनिष्ठ दानवीर)","epoch_hi":"त्याग एवं सत्यनिष्ठा का आदर्श","summary_hi":"प्रह्लाद के पौत्र, जिन्होंने सर्वस्व लुट जाने पर भी सत्य और दान का त्याग नहीं किया, जिन्हें अगले मन्वन्तर में इन्द्र का पद प्राप्त होगा।","quote_hi":"सत्यं न त्यजामि — चाहे मेरा सर्वस्व और साम्राज्य छिन जाए, मैं सत्य का त्याग कभी नहीं करूँगा","content_hi":"\n      <h3>दानवीरता और सत्य का आदर्श</h3>\n      <p>राजा बलि के राज्य में प्रजा इतनी सुखी थी कि कोई अभाव नहीं था। वे अपने वचन के इतने पक्के थे कि जब उनके गुरु शुक्राचार्य ने बताया कि यह बालक साक्षात् विष्णु है जो तुम्हारा सब कुछ छीनने आया है, तब भी बलि ने कहा — 'यदि साक्षात् भगवान मेरे द्वार पर याचक बनकर आए हैं, तो मेरा सर्वस्व न्यौछावर है।'</p>\n\n      <h3>सर्वस्व दान एवं आत्म-समर्पण</h3>\n      <p>जब प्रभु ने दो पग में त्रिलोकी नाप ली, तो बलि ने बिना किसी संकोच के अपना सिर झुका दिया। उन्होंने साम्राज्य नहीं, स्वयं को ही समर्पित कर दिया।</p>\n\n      <h3>परिणाम: भविष्य के इन्द्र एवं ओणम पर्व</h3>\n      <p>भगवान विष्णु ने बलि की भक्ति से मुग्ध होकर उन्हें अगले मन्वन्तर का 'इन्द्र' बनने का वरदान दिया और स्वयं उनके महल के द्वारपाल बने। केरल में 'ओणम' का पावन पर्व राजा बलि के अपनी प्रजा से मिलने आने की स्मृति में मनाया जाता है।</p>\n    "},{"id":"parashurama","title":"Parashurama","sanskrit":"परशुराम (भार्गव राम)","category":"avatar","epoch":"Treta Yuga Dawn","tier":11,"parentId":"vishnu_avatars","x":150,"y":-540,"z":1030,"symbol3D":"chakra","image":"assets/images/parashurama.jpg","quote":"Akshatriyam imam kshitim — Cleansing the earth of corrupted, tyrannical Kshatriya kings 21 times","summary":"The immortal warrior-sage armed with the battle-axe, son of Jamadagni, who disciplined despotic royal power.","content":"\n      <h3>The Arrogance of Militarized Monarchy</h3>\n      <p>In the transition from Satya to Treta Yuga, kings grew intoxicated with military might. King Kartavirya Arjuna forcibly stole sage Jamadagni's wish-fulfilling cow Kamadhenu and later murdered the defenseless sage in his hermitage, desecrating the sanctity of spiritual life.</p>\n\n      <h3>The 21 Campaigns of the Axe</h3>\n      <p>Jamadagni's youngest son, Parashurama, took up his divine battle-axe (gifted by Shiva). Defeating Kartavirya, he waged 21 campaigns across the subcontinent to systematically eradicate corrupt, despotic kings who used royal power to oppress citizens and holy hermits.</p>\n\n      <h3>Outcome: Renunciation & Chiranjivi Status</h3>\n      <p>Having pacified the realm, Parashurama donated the entire reclaimed earth to sage Kashyapa and retired to Mount Mahendra. As an immortal Chiranjivi, he preserves the ancient martial science of Kalaripayattu and Dhanurveda, awaiting the arrival of Kalki to serve as his martial preceptor.</p>\n    ","childrenIds":["treta_yuga"],"title_hi":"भगवान परशुराम (भार्गव राम)","epoch_hi":"त्रेता युग का आरंभ — क्षत्रिय शुद्धि","summary_hi":"ऋषि जमदग्नि के पुत्र, परशुधारी चिरंजीवी, जिन्होंने अत्याचारी सहस्त्रबाहु अर्जुन और भ्रष्ट राजाओं को २१ बार दंडित किया।","quote_hi":"अक्षत्रियमिमाम् क्षितिम् — अत्याचारी और धर्मभ्रष्ट राजाओं से पृथ्वी को २१ बार मुक्त करने वाले महर्षि","content_hi":"\n      <h3>कारण: सत्ता का अहंकार एवं जमदग्नि वध</h3>\n      <p>जब क्षत्रिय राजा अपनी शक्ति के मद में चूर होकर संतों और निर्बलों पर अत्याचार करने लगे, तब सहस्त्रबाहु अर्जुन ने महर्षि जमदग्नि की कामधेनु गाय का बलपूर्वक अपहरण कर लिया और महर्षि की हत्या कर दी।</p>\n\n      <h3>लीला: २१ बार अत्याचारी राजाओं का संहार</h3>\n      <p>ऋषि जमदग्नि के पुत्र परशुराम जी ने भगवान शिव से प्राप्त परशु (फरसा) उठाया और सहस्त्रबाहु की सहस्र भुजाएँ काटकर उसका वध किया। इसके पश्चात उन्होंने पृथ्वी को २१ बार अधर्मी, निरंकुश और प्रजा-पीड़क राजाओं के अत्याचार से मुक्त कराया।</p>\n\n      <h3>परिणाम: भूमि-दान एवं अमर चिरंजीवी</h3>\n      <p>पृथ्वी को राजाओं के आतंक से मुक्त करने के उपरांत, उन्होंने सम्पूर्ण जीती हुई भूमि महर्षि कश्यप को दान कर दी और स्वयं महेंद्र पर्वत पर तपस्या के लिए चले गए। वे आठ अमर 'चिरंजीवियों' में से एक हैं और कलियुग के अंत में भगवान कल्कि को दिव्यास्त्रों की शिक्षा प्रदान करेंगे।</p>\n    "},{"id":"treta_yuga","title":"Treta Yuga","sanskrit":"🟡 त्रेता युग (धर्मस्य त्रयः पादाः)","category":"yuga","epoch":"Treta Yuga (1,296,000 Years)","tier":12,"parentId":"parashurama","x":0,"y":-660,"z":1180,"symbol3D":"lotus","image":"assets/images/treta_yuga.jpg","quote":"Treta-yuge yajna-kriya — In Treta Yuga, sacrifice and sacred duty predominate","summary":"The second cosmic age: Dharma stands on three legs. The age of righteous kingship, the Solar Dynasty, and the Ramayana.","content":"\n      <h3>The Era of Codified Duty</h3>\n      <p>In Treta Yuga, virtue receded to three-fourths of its pristine fullness. While natural goodness was still pervasive, human minds began to require formal ethical boundaries, kingship, and sacramental sacrifices (Yajnas) to sustain order.</p>\n\n      <h3>Rise of the Solar Dynasty and Ayodhya</h3>\n      <p>Centred upon Ayodhya under the Ikshvaku / Solar dynasty, this era established the benchmark of righteous governance. Emperors like Harishchandra, Dilipa, Raghu, and Dasharatha placed truth and public duty above personal survival, creating a culture of supreme self-sacrifice.</p>\n\n      <h3>Outcome: The Descent of Maryada Purushottama</h3>\n      <p>The defining summit of Treta Yuga was the descent of Sri Rama, providing humanity with the timeless manual of ethical behavior: the ideal son, brother, husband, warrior, and sovereign ruler.</p>\n    ","childrenIds":["rama"],"title_hi":"त्रेता युग (धर्म के तीन चरण)","epoch_hi":"१२,९६,००० मानव वर्ष","summary_hi":"वह युग जब धर्म तीन चरणों (सत्य, पवित्रता, दया) पर खड़ा था, जहाँ यज्ञ, मर्यादित राजा और श्रीराम का आदर्श चरित्रांकन हुआ।","quote_hi":"त्रेतायुगे यज्ञक्रिया — त्रेतायुग में वैदिक यज्ञ, मर्यादा और कर्तव्य-पालन की प्रधानता रही","content_hi":"\n      <h3>मर्यादा और यज्ञ का युग</h3>\n      <p>त्रेता युग में धर्म का एक चरण घट गया और वह तीन चरणों (सत्य, तप, दया) पर स्थित रहा। मनुष्य में कामनाएँ जाग्रत होने लगीं, जिसके कारण वेदों के कर्मकाण्ड, यज्ञ और समाज की मर्यादाओं की स्थापना अनिवार्य हो गई।</p>\n\n      <h3>सूर्यवंश एवं अयोध्या की प्रतिष्ठा</h3>\n      <p>अयोध्या में सूर्यवंशी राजाओं — हरिश्चंद्र, सगर, भगीरथ, रघु और दशरथ ने सत्य की रक्षा के लिए अपने प्राणों की बाजी लगा दी। 'रघुकुल रीति सदा चलि आई, प्राण जाहुं बरु बचन न जाई' इस युग का मूल मंत्र बना।</p>\n\n      <h3>परिणाम एवं श्रीराम का अवतरण</h3>\n      <p>इस युग का चरमोत्कर्ष भगवान श्रीराम का अवतरण था, जिन्होंने एक मनुष्य के रूप में मर्यादा, कर्तव्य और त्याग का ऐसा आदर्श प्रस्तुत किया जो अनंत काल तक मानवता का मार्गदर्शन करता रहेगा।</p>\n    "},{"id":"rama","title":"Rama","sanskrit":"श्रीराम (मर्यादा पुरुषोत्तम)","category":"avatar","epoch":"Treta Yuga","tier":13,"parentId":"treta_yuga","x":0,"y":-720,"z":1260,"symbol3D":"chakra","image":"assets/images/rama_sita.jpg","quote":"Ramo vigrahavan dharmaha — Rama is the living embodiment of Dharma (Ramayana)","summary":"The ideal monarch, husband, brother, and son, upholding truth and duty through absolute personal sacrifice.","content":"\n      <h3>The Purpose of the Divine Human Descent</h3>\n      <p>To vanquish Ravana, whose boons protected him from gods and celestials but left him vulnerable to mortal man, Vishnu incarnated as Rama, eldest prince of Ayodhya. More crucially, humanity needed a living demonstration of how a mortal can walk the razor's edge of righteousness under extreme personal tragedy.</p>\n\n      <h3>Fourteen Years of Forest Exile & The Lanka War</h3>\n      <p>On the eve of his coronation, Rama cheerfully accepted fourteen years of forest exile to preserve his father Dasharatha's solemn promise to queen Kaikeyi. Accompanied by Sita and Lakshmana, he befriended forest tribes (Nishadas, Shabari), formed an alliance with Sugriva's Vanaras, bridged the southern sea, and annihilated Ravana's empire without ever breaking martial honor or ethical decorum.</p>\n\n      <h3>Outcome: Rama Rajya — The Timeless Standard</h3>\n      <p>Rama ruled Ayodhya for 11,000 years in an era free from famine, fear, and sorrow (Rama Rajya). His life teaches that Dharma is not an abstract theory, but a daily choice to subordinate personal convenience to eternal truth.</p>\n    ","childrenIds":["sita","hanuman","ravana"],"title_hi":"मर्यादा पुरुषोत्तम श्रीराम","epoch_hi":"त्रेता युग — धर्म के साक्षात् विग्रह","summary_hi":"अयोध्या के राजकुमार, जिन्होंने पिता के वचन हेतु १४ वर्ष का वनवास भोगा, रावण का वध कर रामराज्य की स्थापना की।","quote_hi":"रामो विग्रहवान् धर्मः — श्रीराम धर्म के साक्षात् सजीव स्वरूप हैं (वाल्मीकि रामायण)","content_hi":"\n      <h3>अवतरण का उद्देश्य: मर्यादा की पुनर्स्थापना</h3>\n      <p>रावण का वध किसी देवता के हाथों संभव नहीं था क्योंकि उसे केवल मनुष्य या वानर ही मार सकते थे। अतः भगवान विष्णु ने अयोध्या के राजा दशरथ के ज्येष्ठ पुत्र के रूप में मानव देह धारण की ताकि वे मनुष्य जाति को मर्यादा में रहकर जीने की कला सिखा सकें।</p>\n\n      <h3>१४ वर्ष का वनवास एवं रावण वध</h3>\n      <p>राज्याभिषेक के दिन पिता के वचन की रक्षा के लिए बिना किसी संकोच के १४ वर्षों के लिए वन चले गए। वन में उन्होंने निषादराज और शबरी जैसे दीन-दुखियों को गले लगाया, वानरों से मित्रता की, समुद्र पर सेतु बांधा और अधर्मी रावण की विशाल सेना का संहार किया।</p>\n\n      <h3>परिणाम एवं 'रामराज्य'</h3>\n      <p>लंका विजय के बाद वे अयोध्या लौटे और 'रामराज्य' की स्थापना की — जहाँ किसी को कोई शारीरिक, दैविक या भौतिक कष्ट नहीं था। श्रीराम का जीवन पुत्र, भाई, पति और राजा के रूप में सर्वोच्च कर्तव्य-निष्ठा का शाश्वत मानदंड है।</p>\n    "},{"id":"sita","title":"Sita","sanskrit":"🌺 सीता (जानकी / वैदेही)","category":"divine","epoch":"Treta Yuga","tier":14,"parentId":"rama","x":-100,"y":-780,"z":1340,"symbol3D":"lotus","image":"assets/images/sita.jpg","quote":"Pativrata shiromani — The crest-jewel of devotion, dignity, and fortitude","summary":"Daughter of King Janaka and Mother Earth, queen of Ayodhya, the embodiment of courage and unconditional grace.","content":"\n      <h3>Daughter of Mother Earth</h3>\n      <p>Found by King Janaka in a furrow of the sacrificial field, Sita represents the divine grace and untainted fertility of Mother Earth. Her life serves as an unshakeable monument of spiritual fortitude, sovereign dignity, and moral independence.</p>\n\n      <h3>Ordeal in the Ashoka Vatika</h3>\n      <p>Choosing forest hardship over palace luxuries to accompany Rama, Sita was deceitfully abducted by Ravana. Imprisoned in the Ashoka Vatika under threat of execution, surrounded by terrifying demonesses, she held a single blade of grass before Ravana, reminding the titan that her spiritual purity (Tejas) was an impassable fire. After Rama's victory and the Agni Pariksha, she endured subsequent forest exile in Valmiki's hermitage with regal silence, raising warrior princes Lava and Kusha.</p>\n\n      <h3>Outcome: Return to Mother Earth</h3>\n      <p>Having proven her sons before Rama's royal court, Sita prayed to her mother Earth: <em>\"If I have never wavered in truth and devotion, open thy bosom and receive me.\"</em> The earth opened, and Bhudevi bore Sita away on a golden throne, vindicating her divine majesty for eternity.</p>\n    ","childrenIds":["lava_kusha"],"title_hi":"माता सीता (जानकी / वैदेही)","epoch_hi":"पवित्रता, गरिमा एवं असीम धैर्य","summary_hi":"महाराज जनक की हल जोतते समय भूमि से प्रकट कन्या, अयोध्या की महारानी, जिन्होंने त्याग और स्वाभिमान का सर्वोच्च कीर्तिमान रचा।","quote_hi":"पतिव्रता शिरोमणि — त्याग, पातिव्रत्य, आत्म-सम्मान और असीम सहनशीलता की देवी","content_hi":"\n      <h3>पृथ्वी की पावन कन्या</h3>\n      <p>मिथिला के राजा जनक को यज्ञ-भूमि जोतते समय हल के फल (सीत) से भूमि-कन्या के रूप में सीता जी प्राप्त हुईं। वे साक्षात् महालक्ष्मी का स्वरूप और स्त्री-गरिमा की सर्वोच्च प्रतिमूर्ति थीं।</p>\n\n      <h3>अशोक वाटिका में अटल सतीत्व</h3>\n      <p>राजमहल के सुख त्यागकर वे श्रीराम के साथ वन गईं। रावण द्वारा कपटपूर्वक हरण किए जाने पर उन्होंने अशोक वाटिका में बंदी रहकर भी अपने आत्मबल को नहीं खोया। रावण के सम्मुख एक तिनका रखकर उन्होंने यह सिद्ध कर दिया कि उनके पातिव्रत्य के तेज के सम्मुख लंका का त्रिलोक-विजेता सम्राट भी तुच्छ है।</p>\n\n      <h3>परिणाम: स्वाभिमान एवं पृथ्वी में समाना</h3>\n      <p>वाल्मीकि आश्रम में रहकर उन्होंने लव-कुश को वीर योद्धा बनाया। अंत में अयोध्या की राजसभा में अपनी पवित्रता सिद्ध करने के उपरांत, उन्होंने अपनी माता पृथ्वी से प्रार्थना की कि 'यदि मेरा मन, वचन और कर्म सत्य है, तो मुझे अपनी गोद में ले लो।' धरती फटी और माता सीता स्वर्ण-सिंहासन पर बैठकर पृथ्वी में समा गईं।</p>\n    "},{"id":"lava_kusha","title":"Lava & Kusha","sanskrit":"लव एवं कुश","category":"lineage","epoch":"Treta Yuga Finale","tier":15,"parentId":"sita","x":-100,"y":-840,"z":1420,"symbol3D":"lotus","image":"assets/images/lava_kusha.jpg","quote":"Ramayana-gayakau — The twin masters who sang the epic before Rama's royal court","summary":"The twin princes of Ayodhya raised in Valmiki's hermitage, unconquerable warriors who captured the Ashvamedha horse.","content":"\n      <h3>Born in the Forest Hermitage</h3>\n      <p>Born and raised in the tranquil ashram of sage Valmiki on the banks of the Tamasa river, the twin princes Lava and Kusha grew up untouched by palace intrigue, mastering archery, statecraft, philosophy, and the complete 24,000 verses of the Ramayana set to celestial music.</p>\n\n      <h3>Halting the Ashwamedha Horse</h3>\n      <p>When Rama's sacrificial Ashvamedha horse roamed near the hermitage, the courageous young princes seized it, asserting that land is not claimed through intimidation. When Ayodhya's celebrated commanders — Shatrughna, Lakshmana, and Bharata — sought to reclaim the horse, the boys defeated them in archery through flawless mastery of astras taught by Valmiki.</p>\n\n      <h3>Outcome: Reconciliation and Succession</h3>\n      <p>Arriving at Ayodhya to sing the Ramayana before Rama, their identity as his sons was revealed amidst tears. Lava founded the city of Lavapuri (modern Lahore) and Kusha founded Kushavati, continuing the unbroken solar lineage into future eras.</p>\n    ","childrenIds":[],"title_hi":"लव एवं कुश (अयोध्या के राजकुमार)","epoch_hi":"त्रेता युग का समापन — महर्षि वाल्मीकि आश्रम","summary_hi":"माता सीता के तेजस्वी जुड़वां पुत्र, जिन्होंने वाल्मीकि आश्रम में रामायण का गान किया और श्रीराम के अश्वमेध घोड़े को रोक दिया।","quote_hi":"रामायण-गायकौ — श्रीराम की राजसभा में वीणा बजाकर सम्पूर्ण रामायण का भावपूर्ण गान करने वाले","content_hi":"\n      <h3>वाल्मीकि आश्रम में पालन-पोषण</h3>\n      <p>माता सीता के त्याग के बाद लव और कुश का जन्म तमसा नदी के तट पर महर्षि वाल्मीकि के आश्रम में हुआ। आश्रम में रहते हुए उन्होंने वेदों, धनुर्विद्या और वाल्मीकि जी द्वारा रचित सम्पूर्ण 'रामायण' का संगीतबद्ध गायन सीखा।</p>\n\n      <h3>अश्वमेध यज्ञ का घोड़ा रोकना</h3>\n      <p>जब श्रीराम के अश्वमेध यज्ञ का घोड़ा आश्रम के समीप आया, तो दोनों बालकों ने उसे पकड़कर वृक्ष से बांध दिया। जब अयोध्या के महाबली योद्धा — शत्रुघ्न, लक्ष्मण और भरत घोड़ा छुड़ाने आए, तो बालकों ने अपने तीक्ष्ण बाणों से उन्हें परास्त कर दिया।</p>\n\n      <h3>परिणाम एवं रामायण गान</h3>\n      <p>जब वाल्मीकि जी उन्हें श्रीराम की सभा में ले गए, तो दोनों ने वीणा की तान पर ऐसा मार्मिक रामायण गान किया कि सम्पूर्ण सभा रो पड़ी। श्रीराम ने अपने पुत्रों को गले लगाया। आगे चलकर लव ने 'लवपुरी' (लाहौर) और कुश ने 'कुशावती' का निर्माण कर सूर्यवंश को आगे बढ़ाया।</p>\n    "},{"id":"hanuman","title":"Hanuman","sanskrit":"🐒 हनुमान् (मारुतात्मज)","category":"divine","epoch":"Treta Yuga","tier":14,"parentId":"rama","x":0,"y":-780,"z":1340,"symbol3D":"lotus","image":"assets/images/hanuman_lanka.jpg","quote":"Manojavam marutatulyavegam — Swift as thought, powerful as the storm-wind","summary":"The supreme Chiranjeevi, son of Vayu and Anjana, personification of boundless strength, selfless service, and bhakti.","content":"\n      <h3>The Eleventh Rudra's Descent for Seva</h3>\n      <p>An incarnation of Shiva's primal energy born to Anjana and Vayu, Hanuman was destined to play the central catalyst in Rama's mission. Endowed with the boons of immortality, immunity from all astras, and the ashta-siddhis (eight mystic perfections), he lived as the quintessential servant (Dasa) of the Lord.</p>\n\n      <h3>The Leap Across the Ocean & The Sanjeevani Mountain</h3>\n      <p>Reminded of his dormant powers by Jambavan, Hanuman expanded to giant size and leaped 100 yojanas across the Indian Ocean to Lanka. Finding Sita, he burned Ravana's golden capital with his fiery tail. Later, when Lakshmana fell comatose under Indrajit's Shakti weapon, Hanuman flew to the Himalayas before dawn, lifted the entire Dronagiri mountain when he could not identify the Sanjeevani herb, and flew back in time to save Lakshmana's life.</p>\n\n      <h3>Outcome: The Heart That Holds Rama</h3>\n      <p>When presented with a pearl necklace by Sita in Ayodhya, Hanuman bit into the gems and discarded them, saying, <em>\"That which does not contain Rama's name has no value.\"</em> When mocked by courtiers, he tore open his chest with his claws, revealing Rama and Sita residing vividly inside his beating heart. Blessed with immortality, he resides on earth wherever Rama's name is chanted.</p>\n    ","childrenIds":["vanara"],"title_hi":"संकटमोचन श्री हनुमान् (मारुति)","epoch_hi":"त्रेता युग — निःस्वार्थ भक्ति एवं अतुलित बल","summary_hi":"वायुपुत्र, अष्टसिद्धि और नवनिधि के दाता, जिन्होंने समुद्र लांघकर सीता की खोज की और लक्ष्मण के प्राण बचाए।","quote_hi":"मनोजवं मारुततुल्यवेगम् — मन के समान वेगवान, वायु के समान शक्तिशाली, जितेन्द्रिय और रामदूत","content_hi":"\n      <h3>अवतरण एवं निःस्वार्थ सेवा</h3>\n      <p>भगवान शिव के ११वें रुद्रावतार, माता अंजना और केसरी के नंदन श्री हनुमान् जी पवनदेव के आशीर्वाद से अवतरित हुए। समस्त देवताओं ने उन्हें अजर-अमर होने और अणिमा-महिमा आदि अष्टसिद्धियों का वरदान दिया, किंतु उनका सम्पूर्ण जीवन केवल श्रीराम की सेवा में समर्पित रहा।</p>\n\n      <h3>महासागर लांघना एवं संजीवनी बूटी</h3>\n      <p>जाम्बवंत द्वारा शक्ति याद दिलाए जाने पर उन्होंने एक छलांग में १०० योजन का समुद्र पार किया, लंका में सीता जी की खोज की और स्वर्णमयी लंका को अपनी पूंछ की आग से भस्म कर दिया। जब युद्ध में लक्ष्मण जी शक्ति-बाण से मूर्छित हुए, तो हनुमान जी सूर्योदय से पूर्व पूरा द्रोणागिरि पर्वत अपनी हथेली पर उठाकर ले आए और लक्ष्मण जी के प्राण बचाए।</p>\n\n      <h3>परिणाम: हृदय में सियाराम एवं अमरता</h3>\n      <p>राज्याभिषेक के समय जब माता सीता ने उन्हें मोतियों का हार दिया, तो उन्होंने मोतियों को तोड़कर देखा कि उसमें राम हैं या नहीं। उपहास उड़ाए जाने पर उन्होंने अपने नाखूनों से अपना सीना चीरकर दिखा दिया, जहाँ साक्षात् श्रीराम और माता सीता विराजमान थे। उन्हें वरदान मिला कि जब तक संसार में राम-कथा रहेगी, तब तक वे जीवित रहकर भक्तों के संकट हरेंगे।</p>\n    "},{"id":"vanara","title":"Vanara Army","sanskrit":"वानर सेना (सुग्रीव, अङ्गद)","category":"war","epoch":"The Lanka Campaign","tier":15,"parentId":"hanuman","x":0,"y":-840,"z":1420,"symbol3D":"mandala","image":"assets/images/vanara.jpg","quote":"Setu-bandhana — Building the Rama Setu bridge across the roaring southern sea","summary":"The celestial-born simian allies led by Sugriva, Angada, Nala, and Nila who constructed the bridge to Lanka.","content":"\n      <h3>The Alliance of the Forest Tribes</h3>\n      <p>Without an imperial army after his exile from Ayodhya, Rama sought allies among the forest dwellers of Kishkindha. After ending Vali's unjust usurpation and crowning Sugriva, the Vanara hosts assembled in their millions to search the four quarters of the earth for Sita.</p>\n\n      <h3>The Engineering Marvel of Rama Setu</h3>\n      <p>Confronted by the roaring ocean barrier, the architects Nala and Nila (sons of divine engineer Vishvakarma) mobilized the Vanara forces. Inscribing the sacred name of RAMA upon boulders and trees, they cast them into the waves, where the stones defied gravity and floated, constructing a 100-yojana floating bridge to Lanka in only five days.</p>\n\n      <h3>Outcome: Triumph of Collective Faith</h3>\n      <p>The Vanara campaign demonstrated that humble forest beings, when united under righteous leadership and pure devotion, can cross impassable oceans and defeat the most sophisticated militarized titan empire on earth.</p>\n    ","childrenIds":["lanka_war"],"title_hi":"वानर सेना (सुग्रीव, अंगद, नल-नील)","epoch_hi":"लंका अभियान — राम सेतु निर्माण","summary_hi":"सुग्रीव, अंगद, जाम्बवंत, नल और नील के नेतृत्व में गठित वानर सेना, जिसने समुद्र पर तैरते पत्थरों का सेतु बनाया।","quote_hi":"सेतु-बन्धन — पत्थरों पर 'श्रीराम' लिखकर अथाह समुद्र पर तैरता हुआ राम सेतु बनाने वाले","content_hi":"\n      <h3>किष्किंधा का सहयोग</h3>\n      <p>अयोध्या की सेना के बिना वन में विचर रहे श्रीराम ने किष्किंधा के वानरों से मित्रता की। बालि के अत्याचार का अंत कर सुग्रीव को राजा बनाया गया। इसके बाद सुग्रीव ने चारों दिशाओं में अपनी वानर सेना को सीता जी की खोज में भेजा।</p>\n\n      <h3>अद्भुत राम सेतु का निर्माण</h3>\n      <p>समुद्र पार करने के लिए विश्वकर्मा के पुत्र नल और नील के निर्देशन में वानरों ने पत्थरों और शिलाओं पर 'श्रीराम' नाम लिखा। प्रभु के नाम के प्रभाव से भारी पत्थर पानी पर तैरने लगे और मात्र पांच दिनों में १०० योजन लंबा 'राम सेतु' बनकर तैयार हो गया।</p>\n\n      <h3>परिणाम एवं संदेश</h3>\n      <p>वानर सेना की यह विजय सिद्ध करती है कि जब साधारण और उपेक्षित लोग भी सत्य और धर्म के लिए एकजुट होकर प्रयास करते हैं, तो वे विशाल समुद्र भी बांध सकते हैं और बड़े-से-बड़े साम्राज्य को धूल चटा सकते हैं।</p>\n    "},{"id":"ravana","title":"Ravana","sanskrit":"👹 रावण (दशानन)","category":"war","epoch":"Treta Yuga","tier":14,"parentId":"rama","x":100,"y":-780,"z":1340,"symbol3D":"mandala","image":"assets/images/ravana.jpg","quote":"Veda-vedanga-paraga — Master of the four Vedas and Shiva Tandava Stotra, blinded by ego","summary":"The ten-headed titan king of Lanka, great scholar and devotee of Shiva, whose fatal lust and pride brought doom.","content":"\n      <h3>The Titan Scholar and Devotee</h3>\n      <p>Great-grandson of Brahma and son of sage Vishrava, Ravana was an extraordinary scholar who mastered the six Vedangas, played the Veena using his own severed head and sinews to compose the magnificent <em>Shiva Tandava Stotra</em>, and secured boons from Brahma making him invincible to gods, serpents, and demons.</p>\n\n      <h3>The Fatal Hubris: The Abduction of Sita</h3>\n      <p>Blind to his own mortality, Ravana allowed pride and unchecked lust to overpower his wisdom. Disregarding the ethical counsel of his brother Vibhishana and queen Mandodari, he abducted Sita through trickery, convinced that mere mortal humans and forest monkeys could never breach golden Lanka.</p>\n\n      <h3>Outcome: The Complete Annihilation of Lanka</h3>\n      <p>His stubborn ego led his brothers (Kumbhakarna), sons (Indrajit), and hundreds of thousands of warriors to their deaths. Pierced by Rama's Brahmashira arrow in the navel where his nectar of life was stored, Ravana delivered final teachings on statecraft to Lakshmana before dying, standing as an eternal warning that unmatched intellectual genius without moral discipline leads to absolute ruin.</p>\n    ","childrenIds":["lanka_war"],"title_hi":"दशानन रावण (लंकापति)","epoch_hi":"अहंकार, काम एवं विद्वत्ता का पतन","summary_hi":"चारों वेदों का ज्ञाता, शिव ताण्डव स्तोत्र का रचयिता, किंतु परस्त्री-हरण और अहंकार के कारण अपने सम्पूर्ण वंश का नाश कराने वाला।","quote_hi":"वेद-वेदाङ्ग-पारगः — महाविद्वान, त्रिलोक विजेता, किंतु अनियंत्रित काम और अहंकार से नष्ट हुआ राजा","content_hi":"\n      <h3>प्रकाण्ड विद्वान एवं शिव-भक्त</h3>\n      <p>रावण महर्षि विश्रवा का पुत्र और ब्रह्मा जी का प्रपौत्र था। वह चारों वेदों और छहों शास्त्रों का ज्ञाता था। उसने अपने सिर काटकर महादेव को अर्पित किए और 'शिव ताण्डव स्तोत्र' की रचना की। ब्रह्मा जी से उसने देवताओं, गंधर्वों और असुरों से अजेय होने का वरदान प्राप्त किया था।</p>\n\n      <h3>काम और अहंकार का पतन</h3>\n      <p>इतनी विद्या और बल होने के बाद भी वह अपने अहंकार और वासना पर नियंत्रण नहीं रख सका। भाई विभीषण और महारानी मंदोदरी के समझाने पर भी उसने छल से माता सीता का हरण किया और स्वयं को सर्वोपरि मान बैठा।</p>\n\n      <h3>परिणाम: वंश का सर्वनाश</h3>\n      <p>उसके हठ के कारण कुंभकर्ण, मेघनाद और लंका के शूरवीरों का अंत हुआ। अंत में श्रीराम के बाण ने उसकी नाभि के अमृत को सुखाकर उसका वध किया। मृत्यु शैया पर रावण ने लक्ष्मण जी को राजनीति और नीति के गूढ़ रहस्य सिखाए। रावण का चरित्र यह सिद्ध करता है कि यदि चरित्र में शुचिता न हो, तो संसार का समस्त ज्ञान और वैभव भी पतन से नहीं बचा सकता।</p>\n    "},{"id":"lanka_war","title":"Lanka War","sanskrit":"लङ्का युद्ध (रामायण महासमर)","category":"war","epoch":"Treta Yuga Climax","tier":16,"parentId":"vanara","x":50,"y":-900,"z":1500,"symbol3D":"chakra","image":"assets/images/ramayana.jpg","quote":"Brahmashirasa hataste — Slain by the sacred Brahmashira weapon invulnerable in truth","summary":"The climactic battle between Rama and Ravana, resulting in the fall of Lanka's titans and the liberation of Sita.","content":"\n      <h3>The Collision of Dharma and Adharma</h3>\n      <p>The war of Lanka was the climactic battle of Treta Yuga, pitting pure spiritual courage against demonic sorcery, shape-shifting illusions (Maya), and catastrophic celestial weaponry.</p>\n\n      <h3>Epic Duels and the Aditya Hridaya</h3>\n      <p>The battle raged with terrifying ferocity: Kumbhakarna was awakened and slain; Lakshmana defeated Indrajit (the conqueror of heaven) through righteous celibacy and truth. As Rama faced Ravana in his multi-headed chariot, sage Agastya appeared and initiated Rama into the sacred <em>Aditya Hridaya Stotra</em> (hymn to the Sun god) to dispel fatigue and awaken invincible inner vitality. Invoking the blazing Brahmashira arrow, Rama pierced Ravana's heart and navel, ending the golden tyranny.</p>\n\n      <h3>Outcome: Crowning of Vibhishana & Freedom</h3>\n      <p>Sita was freed, the righteous Vibhishana was crowned king of Lanka, and Rama returned triumphantly to Ayodhya aboard the flying Pushpaka Vimana, celebrated to this day as the festival of Diwali.</p>\n    ","childrenIds":["end_of_treta"],"title_hi":"लंका महासमर (रामायण युद्ध)","epoch_hi":"त्रेता युग का निर्णायक धर्म-युद्ध","summary_hi":"श्रीराम और रावण के मध्य लड़ा गया भीषण महासंग्राम, जिसमें इन्द्रजीत, कुंभकर्ण और रावण का वध कर सत्य की स्थापना हुई।","quote_hi":"ब्रह्मशिरसा हतस्ते — महर्षि अगस्त्य द्वारा दिए गए आदित्य हृदय स्तोत्र के पाठ के उपरांत ब्रह्मास्त्र से रावण का संहार","content_hi":"\n      <h3>सत्य और असत्य का महासंग्राम</h3>\n      <p>लंका का युद्ध साधारण भूमि का युद्ध नहीं था, अपितु वह धर्म और अधर्म, तपस्या और अहंकार का निर्णायक महासमर था। एक ओर मायावी अस्त्रों से सुसज्जित लंका की सेना थी, तो दूसरी ओर पत्थरों और वृक्षों से लड़ने वाले निष्ठावान वानर-भालू थे।</p>\n\n      <h3>भयंकर युद्ध एवं आदित्य हृदय स्तोत्र</h3>\n      <p>युद्ध में मेघनाद और कुंभकर्ण जैसे महारथी मारे गए। जब रावण के साथ युद्ध लंबा खिंचा, तो महर्षि अगस्त्य ने रणभूमि में श्रीराम को 'आदित्य हृदय स्तोत्र' का उपदेश दिया। भगवान सूर्य का स्मरण कर श्रीराम ने ब्रह्मा जी द्वारा प्रदत्त अमोघ बाण का संधान किया, जिसने रावण की नाभि को भेदकर उसका अंत कर दिया।</p>\n\n      <h3>परिणाम: विभीषण का राज्याभिषेक एवं दीपावली</h3>\n      <p>अधर्म का नाश हुआ, धर्मनिष्ठ विभीषण को लंका का राजा बनाया गया और माता सीता को मुक्त कराया गया। श्रीराम पुष्पक विमान से अयोध्या लौटे, जिनके स्वागत में अयोध्यावासियों ने घी के दीपक जलाए — जो आज भी 'दीपावली' के रूप में सम्पूर्ण विश्व में मनाया जाता है।</p>\n    "},{"id":"end_of_treta","title":"End of Treta","sanskrit":"त्रेता युगान्त एवं रामराज्यम्","category":"yuga","epoch":"Golden Era of Governance","tier":17,"parentId":"lanka_war","x":0,"y":-960,"z":1580,"symbol3D":"lotus","image":"assets/images/end_of_treta.jpg","quote":"Sarve bhavantu sukhinaha — Under Rama Rajya, no premature deaths or sorrows occurred","summary":"The golden age of Rama Rajya in Ayodhya, culminating in Rama's return to the eternal abode Vaikuntha.","content":"\n      <h3>The Golden Age of Human Governance</h3>\n      <p>Following Rama's coronation, Ayodhya enjoyed Rama Rajya for 11,000 years. Agriculture flourished without unseasonal rains; diseases were absent; no parent had to witness the cremation of a child; and justice reigned supreme without fear.</p>\n\n      <h3>The Final Duty: Return to Vaikuntha</h3>\n      <p>Having completed his earthly mission, Kala (Time) arrived to remind Rama that his cosmic cycle had reached its appointed hour. Leading the citizens of Ayodhya who wished to accompany him to the banks of the sacred Sarayu river, Rama stepped into the flowing waters, reassuming his four-armed form as Lord Narayana and welcoming all souls into the transcendent realm of Vaikuntha.</p>\n\n      <h3>Outcome: The Benchmark of Civilization</h3>\n      <p>Rama Rajya remains the eternal archetype for righteous human society — a governance model where power exists exclusively for service, compassion, and moral elevation.</p>\n    ","childrenIds":["dvapara_yuga"],"title_hi":"रामराज्य एवं त्रेता युगान्त","epoch_hi":"आदर्श शासन एवं वैकुण्ठ गमन","summary_hi":"अयोध्या में ११,००० वर्षों का आदर्श शासन जहाँ कोई दुःख या अकाल नहीं था; तत्पश्चात सरयू नदी में प्रवेश कर वैकुण्ठ गमन।","quote_hi":"सर्वे भवन्तु सुखिनः — रामराज्य में न कोई दरिद्र था, न कोई दुखी; सब धर्म के मार्ग पर चलकर परम शांति में रहते थे","content_hi":"\n      <h3>रामराज्य: सुशासन की पराकाष्ठा</h3>\n      <p>अयोध्या लौटने पर श्रीराम का राज्याभिषेक हुआ और ११,००० वर्षों तक 'रामराज्य' चला। उस काल में न किसी को अल्पायु में मृत्यु होती थी, न कोई व्याधि थी। प्रकृति अनुकूल थी और समाज का प्रत्येक वर्ग अपने कर्तव्य का पालन करते हुए सुखी था।</p>\n\n      <h3>सरयू में जल-समाधि एवं वैकुण्ठ गमन</h3>\n      <p>जब अवतार का उद्देश्य पूर्ण हुआ, तब कालदेव ने आकर प्रभु को उनके वैकुण्ठ लौटने का समय स्मरण कराया। प्रभु श्रीराम समस्त अयोध्यावासियों के साथ पावन सरयू नदी के तट पर पहुँचे और जल में प्रवेश कर अपने नित्य चतुर्भुज नारायण स्वरूप में लीन होकर वैकुण्ठ पधारे।</p>\n\n      <h3>परिणाम एवं शाश्वत आदर्श</h3>\n      <p>रामराज्य आज भी विश्व के लिए एक आदर्श राज्य-व्यवस्था का प्रतीक है, जहाँ राजा का निजी जीवन भी प्रजा के कल्याण और धर्म के नियमों के प्रति पूर्णतः समर्पित होता है।</p>\n    "},{"id":"dvapara_yuga","title":"Dvapara Yuga","sanskrit":"🟠 द्वापर युग (धर्मस्य द्वौ पादौ)","category":"yuga","epoch":"Dvapara Yuga (864,000 Years)","tier":18,"parentId":"end_of_treta","x":0,"y":-1020,"z":1660,"symbol3D":"chakra","image":"assets/images/dvapara_yuga.jpg","quote":"Dvapara-yuge paricharyayam — In Dvapara Yuga, temple worship and complex ethics predominate","summary":"The third cosmic age: Dharma stands on two legs. The age of Krishna, the Mahabharata, and the Bhagavad Gita.","content":"\n      <h3>The Age of Moral Complexity</h3>\n      <p>In Dvapara Yuga, Dharma stands on only two legs (Truth and Compassion). Good and evil no longer inhabit distinct geographical realms like Ayodhya and Lanka; rather, they dwell within the same palace, family, and human heart.</p>\n\n      <h3>The Kuru Dynasty & The Birth of Krishna</h3>\n      <p>Centered in Hastinapur and Mathura, royal ambition and family jealousy erupted into existential drama. To guide humanity through these subtle labyrinths of dharma (Sukshma Dharma), Lord Krishna descended as the Purna Avatara.</p>\n\n      <h3>Outcome: The Philosophical Crown of the Gita</h3>\n      <p>Dvapara Y
