uga forced humanity to abandon rigid black-and-white moral dogmas, teaching through the Kurukshetra war and the Bhagavad Gita that detached action dedicated to God is the only true anchor in a morally ambiguous world.</p>\n    ","childrenIds":["krishna"],"title_hi":"द्वापर युग (धर्म के दो चरण)","epoch_hi":"८,६४,००० मानव वर्ष","summary_hi":"वह युग जब धर्म दो चरणों पर आ गया; जहाँ अच्छा और बुरा एक ही कुल (कौरव-पाण्डव) में उपस्थित था; भगवान श्रीकृष्ण और महाभारत का युग।","quote_hi":"द्वापरे परिचर्यायाम् — द्वापर युग में मंदिर-उपासना, भक्ति और जटिल नैतिक धर्म-संकटों की प्रधानता रही","content_hi":"\n      <h3>धर्म-संकटों और जटिलता का युग</h3>\n      <p>द्वापर युग में धर्म केवल दो चरणों (सत्य और दान) पर शेष रहा। इस युग की विशेषता यह थी कि अच्छाई और बुराई अलग-अलग देशों में नहीं, बल्कि एक ही परिवार और एक ही राजमहल (कौरव और पाण्डव) के भीतर विद्यमान थीं।</p>\n\n      <h3>हस्तिनापुर एवं श्रीकृष्ण का प्राकट्य</h3>\n      <p>हस्तिनापुर के कुरु वंश में सिंहासन के लोभ और कपट के कारण जब नैतिक मूल्यों का ह्रास होने लगा, तब धर्म को सूक्ष्म रूप से समझाने और अधर्म का विनाश करने के लिए भगवान श्रीकृष्ण का प्राकट्य हुआ।</p>\n\n      <h3>परिणाम एवं गीता का अमर ज्ञान</h3>\n      <p>द्वापर युग ने संसार को महाभारत जैसा महाकाव्य और 'श्रीमद्भगवद्गीता' जैसा अद्वितीय दर्शन दिया, जो सिखाता है कि जटिल से जटिल परिस्थिति में भी निष्काम कर्म और धर्म का मार्ग कभी नहीं छोड़ना चाहिए।</p>\n    "},{"id":"krishna","title":"Krishna","sanskrit":"🦚 श्रीकृष्ण (पूर्ण अवतार)","category":"avatar","epoch":"Dvapara Yuga Climax","tier":19,"parentId":"dvapara_yuga","x":0,"y":-1080,"z":1740,"symbol3D":"chakra","image":"assets/images/krishna.jpg","quote":"Krishnastu bhagavan svayam — Krishna is the Supreme Personality of Godhead Himself (Bhagavatam 1.3.28)","summary":"The Supreme Purna Avatara: child of Vrindavana, diplomat of Dvaraka, charioteer to Arjuna, and speaker of the Gita.","content":"\n      <h3>The Complete Manifestation (Purna Avatara)</h3>\n      <p>Unlike other avatars who exhibited specific functional energies, Krishna manifested all sixteen Kalas (divine attributes) of the Supreme Being, responding to every facet of the human condition with infinite charm, playful wisdom, and unfathomable statesmanship.</p>\n\n      <h3>From Gokula's Groves to Kurukshetra's Chariot</h3>\n      <p>Born in Kamsa's dark Mathura prison, smuggled across the flooded Yamuna to Gokula, child Krishna enchanted Vrindavan with his divine flute, defeated serpentine Kaliya, lifted Govardhana hill on his pinky finger to protect the villagers, and slew tyrant Kamsa. In maturity, he established the golden maritime fortress of Dvaraka, mediated peace between cousins, and drove Arjuna's chariot across the battlefield of Kurukshetra, singing the immortal Bhagavad Gita.</p>\n\n      <h3>Outcome: The Universal Path of Joy & Karma Yoga</h3>\n      <p>Krishna liberated spirituality from grim asceticism, showing that the highest truth can be celebrated through joyful love (Prema), fearless living, and selfless action (Nishkama Karma).</p>\n    ","childrenIds":["balarama","radha","rukmini","mahabharata"],"title_hi":"योगेश्वर श्रीकृष्ण (पूर्ण अवतार)","epoch_hi":"द्वापर युग — बाललीला से गीता-ज्ञान तक","summary_hi":"मथुरा के कारागार में प्रकट, गोकुल के माखनचोर, द्वारकाधीश, महाभारत में अर्जुन के सारथि और गीता के अमर उपदेशक।","quote_hi":"कृष्णस्तु भगवान् स्वयम् — श्रीकृष्ण साक्षात् परब्रह्म परमात्मा के पूर्ण अवतार हैं (श्रीमद्भागवत १.३.२८)","content_hi":"\n      <h3>पूर्ण ब्रह्म का अवतार</h3>\n      <p>भगवान श्रीकृष्ण को सनातन परंपरा में 'सोलह कलाओं से युक्त पूर्ण अवतार' माना गया है। वे एक साथ बाल रूप में मनमोहक, गोकुल में नटखट, द्वारका में नीति-निपुण राजा, और रणभूमि में अर्जुन के मार्गदर्शक गुरु हैं।</p>\n\n      <h3>कारागार से कुरुक्षेत्र तक की महालीला</h3>\n      <p>कंस के कारागार में जन्म लेकर, यमुना पार कर गोकुल पहुँचे। बाल्यकाल में पूतना, बकासुर आदि का वध किया, कालिया नाग का दमन किया और इंद्र का मान मर्दन कर अपनी कनिष्ठिका अंगुली पर 'गोवर्धन पर्वत' उठा लिया। मथुरा में कंस का वध किया, द्वारका नगरी बसाई और महाभारत के युद्ध में बिना शस्त्र उठाए केवल अपने ज्ञान और नीति से पाण्डवों को विजय दिलाई।</p>\n\n      <h3>परिणाम एवं गीता का उपदेश</h3>\n      <p>रणभूमि में अर्जुन को मोह से उबारने के लिए उन्होंने 'श्रीमद्भगवद्गीता' का अमर उपदेश दिया। श्रीकृष्ण का जीवन सिखाता है कि संसार के सभी कर्तव्यों को आनंद, निर्भयता और अनासक्ति (कर्मयोग) के साथ कैसे जिया जाए।</p>\n    "},{"id":"balarama","title":"Balarama","sanskrit":"बलराम (हलधर / सङ्कर्षण)","category":"avatar","epoch":"Dvapara Yuga","tier":20,"parentId":"krishna","x":-100,"y":-1140,"z":1820,"symbol3D":"chakra","image":"assets/images/balarama.jpg","quote":"Hala-musala-dharah — Wielder of the plow and mace, avatar of Adishesha","summary":"Elder brother of Krishna, master of the plow and mace, guru to both Bhima and Duryodhana in mace warfare.","content":"\n      <h3>The Descent of Pure Spiritual Strength</h3>\n      <p>As Krishna's elder brother, Balarama represents <em>Bala</em> — spiritual strength without which truth cannot be protected. Transferred miraculously from Devaki's womb to Rohini's in Gokula (earning the name Samkarshana), he shared Krishna's pastoral youth and protected the groves from demons like Dhenukasura and Pralambasura.</p>\n\n      <h3>Master of the Plow & Teacher of Mace Combat</h3>\n      <p>Clad in sapphire-blue robes, holding the plow (Haladhara) symbolizing agriculture and earth's fertility, Balarama was the supreme master of mace warfare (Gada-yuddha), training both Bhima and Duryodhana. When the Kurukshetra war erupted, refusing to fight against either of his beloved pupils, he departed on a sacred pilgrimage along the Sarasvati river.</p>\n\n      <h3>Outcome: Return as Shesha</h3>\n      <p>Following Krishna's departure, Balarama sat on the Gujarat seacoast in deep meditation; a thousand-headed white serpent issued from his mouth, returning him to his primordial form as Adishesha.</p>\n    ","childrenIds":[],"title_hi":"भगवान बलराम (हलधर / संकर्षण)","epoch_hi":"द्वापर युग — शेषनाग अवतार","summary_hi":"श्रीकृष्ण के बड़े भाई, हल और मूसल के धारक, गदा-युद्ध के गुरु, कृषि और आत्मिक बल के संरक्षक देवता।","quote_hi":"हल-मुसल-धरः — हल और मूसल धारण करने वाले, अनन्त शेषनाग के साक्षात् स्वरूप","content_hi":"\n      <h3>आदिशेष का अवतरण एवं दिव्य बल</h3>\n      <p>भगवान बलराम शेषनाग के अवतार और श्रीकृष्ण के बड़े भाई थे। योगमाया द्वारा देवकी के गर्भ से रोहिणी के गर्भ में संकर्षण (स्थानांतरण) होने के कारण वे 'संकर्षण' कहलाए। वे आध्यात्मिक बल और शक्ति के साक्षात् प्रतीक हैं।</p>\n\n      <h3>हलधर रूप एवं गदा-युद्ध के गुरु</h3>\n      <p>नीले वस्त्र और हल-मूसल धारण करने वाले बलराम जी कृषि, जल-संसाधन और भूमि की उर्वरता के रक्षक हैं। वे गदा-युद्ध के सर्वश्रेष्ठ आचार्य थे, जिन्होंने भीम और दुर्योधन दोनों को शिक्षा दी। जब महाभारत युद्ध में दोनों शिष्य आमने-सामने आए, तो उन्होंने किसी का पक्ष न लेकर निष्पक्ष रहकर तीर्थाटन का मार्ग चुना।</p>\n\n      <h3>परिणाम एवं शेष स्वरूप में वापसी</h3>\n      <p>श्रीकृष्ण के प्रयाण के समय उन्होंने समुद्र तट पर समाधि लगाई और उनके मुख से सहस्र फनों वाले श्वेत नाग निकलकर क्षीरसागर में पुनः समा गए।</p>\n    "},{"id":"radha","title":"Radha","sanskrit":"राधा (ह्लादिनी शक्ति)","category":"divine","epoch":"Eternal Vraja","tier":20,"parentId":"krishna","x":-40,"y":-1140,"z":1820,"symbol3D":"lotus","image":"assets/images/radha.jpg","quote":"Radha-krishnayor bhedo nasti — There is no separation between Radha and Krishna","summary":"The supreme personification of divine ecstatic love, selfless surrender, and Krishna's internal energy.","content":"\n      <h3>The Supreme Pleasure Potency (Hladini Shakti)</h3>\n      <p>In Vaishnava theology, Radha is not a mortal lover, but Krishna's internal ecstatic energy (<em>Hlādinī Śakti</em>). God cannot enjoy his own bliss in isolation; hence consciousness projects itself as Radha to experience the infinite varieties of selfless divine love (Prema).</p>\n\n      <h3>The Groves of Vrindavan & Maha-Rasa</h3>\n      <p>In the sacred groves of Nidhivan and the banks of Yamuna, Radha's love transcended all social conventions, intellectual rituals, and selfish desires. In the Maha-Rasa dance, when each Gopi imagined Krishna belonged solely to her, Krishna vanished; only when the pure humility of Radha's devotion prevailed did the Lord reappear in every heart.</p>\n\n      <h3>Outcome: The Crown of Bhakti</h3>\n      <p>Radha proves that ritual scholarship is subordinate to spontaneous, pure-hearted surrender. In temples across the globe, Krishna is never worshipped alone, but always as <strong>Radha-Krishna</strong>, celebrating the eternal union of the soul with God.</p>\n    ","childrenIds":[],"title_hi":"श्रीमती राधारानी (ह्लादिनी शक्ति)","epoch_hi":"नित्य वृन्दावन — परम प्रेम की देवी","summary_hi":"श्रीकृष्ण की आन्तरिक आनंद-दायिनी महाशक्ति, निष्काम प्रेम और पूर्ण आत्म-समर्पण की पराकाष्ठा।","quote_hi":"राधा-कृष्णयोर्भेदो नास्ति — राधा और कृष्ण में कोई भेद नहीं; वे एक ही प्राण के दो विग्रह हैं","content_hi":"\n      <h3>भगवान की आनंदमयी शक्ति</h3>\n      <p>वैष्णव दर्शन में राधारानी श्रीकृष्ण से भिन्न नहीं, बल्कि उनकी अपनी 'ह्लादिनी शक्ति' (आनंद-स्वरूपा ऊर्जा) हैं। जैसे दूध से उसकी सफेदी और अग्नि से उसकी ज्वाला को अलग नहीं किया जा सकता, वैसे ही कृष्ण से राधा को अलग नहीं किया जा सकता।</p>\n\n      <h3>वृन्दावन की कुंज-गलियाँ एवं महारास</h3>\n      <p>वृन्दावन के वनों में राधा जी का प्रेम किसी भौतिक कामना का नहीं, अपितु आत्मा का परमात्मा के प्रति चरम समर्पण था। महारास में जब गोपियों को अहंकार हुआ, तो कृष्ण अंतर्धान हो गए; केवल राधा जी के निष्काम प्रेम से वे पुनः प्रकट हुए।</p>\n\n      <h3>परिणाम: भक्ति का सर्वोच्च शिखर</h3>\n      <p>राधारानी ने सिखाया कि ईश्वर को केवल ज्ञान या तप से नहीं, बल्कि सच्चे, निष्कपट और निस्वार्थ प्रेम से सबसे सरलता से प्राप्त किया जा सकता है। इसलिए उनका नाम सदा 'राधे-कृष्ण' के रूप में पहले लिया जाता है।</p>\n    "},{"id":"rukmini","title":"Rukmini","sanskrit":"रुक्मिणी (द्वारकेश्वरी)","category":"divine","epoch":"Dvaraka Era","tier":20,"parentId":"krishna","x":40,"y":-1140,"z":1820,"symbol3D":"lotus","image":"assets/images/rukmini.jpg","quote":"Shri-rupa — Incarnation of Goddess Lakshmi and chief queen of Dvaraka","summary":"The princess of Vidarbha whose courageous seven-sloka love letter to Krishna led to their romantic elopement.","content":"\n      <h3>The Courage of Devotional Choice</h3>\n      <p>Princess Rukmini of Vidarbha had long surrendered her heart to Krishna upon hearing of his virtues. However, her brother Rukmi arranged her forced marriage to the tyrannical King Shishupala, setting the date without her consent.</p>\n\n      <h3>The Seven-Verse Secret Letter</h3>\n      <p>Faced with spiritual crisis, Rukmini composed a confidential letter in seven sublime Sanskrit verses, dispatching a trusted Brahmin to Dvaraka. She wrote: <em>\"Hearing of your beauty and qualities that enter through the ears to relieve all torment, my heart has surrendered to you. Arrive before the wedding and take me by valor.\"</em> Krishna arrived, held off rival kings with his chariot, and swept Rukmini into his chariot outside the Ambika temple.</p>\n\n      <h3>Outcome: Chief Empress of Dvaraka</h3>\n      <p>Rukmini became the principal queen of Dvaraka, bearing Pradyumna. She embodies the ideal of steadfast spiritual conviction and dignity, reigning as the incarnation of Goddess Lakshmi in Krishna's kingdom.</p>\n    ","childrenIds":[],"title_hi":"महारानी रुक्मिणी (द्वारकेश्वरी)","epoch_hi":"द्वारका युग — प्रेम, संकल्प एवं पटरानी","summary_hi":"विदर्भ की राजकुमारी, जिन्होंने कृष्ण को गोपनीय सात श्लोकों का प्रेम-पत्र भेजकर अपना वरण किया; द्वारका की पटरानी।","quote_hi":"श्रीरूपिणी — साक्षात् महालक्ष्मी का अवतार और द्वारका की प्रथम महारानी","content_hi":"\n      <h3>संकल्प एवं सात श्लोकों का प्रेम-पत्र</h3>\n      <p>विदर्भ के राजा भीष्मक की पुत्री रुक्मिणी बचपन से ही श्रीकृष्ण के गुणों पर मुग्ध थीं। किंतु उनके दुष्ट भाई रुक्मी ने उनका विवाह जबरन चेदिराज शिशुपाल से तय कर दिया।</p>\n\n      <h3>अम्बिका मंदिर से हरण</h3>\n      <p>रुक्मिणी ने एक ब्राह्मण के हाथ श्रीकृष्ण को सात श्लोकों का गोपनीय पत्र भेजा, जिसमें उन्होंने लिखा: 'हे भुवनसुंदर! आपके गुणों को सुनकर मेरा मन आपमें समा गया है। आप आइए और राक्षसी रीति से मेरा हरण कर मुझे अपनी दासी बनाइए।' श्रीकृष्ण तुरंत पहुँचे और अम्बिका मंदिर में पूजा करके लौटती रुक्मिणी को सभी राजाओं के सामने अपने रथ पर बैठाकर द्वारका ले आए।</p>\n\n      <h3>परिणाम: द्वारका की पटरानी</h3>\n      <p>द्वारका में उनका पावन विवाह हुआ और वे प्रभु की प्रधान पटरानी बनीं। वे साक्षात् महालक्ष्मी का अवतार थीं, जिनका जीवन साहस, धर्म और अटूट विश्वास का अनुपम उदाहरण है।</p>\n    "},{"id":"mahabharata","title":"Mahabharata","sanskrit":"महाभारतम् (पञ्चमो वेदः)","category":"scripture","epoch":"Kuru Dynasty","tier":20,"parentId":"krishna","x":100,"y":-1140,"z":1820,"symbol3D":"mandala","image":"assets/images/mahabharata.jpg","quote":"Yannehasti na tat kvachit — What is not in the Mahabharata is found nowhere else","summary":"The epic of the Kuru dynasty composed by Vyasa: 100,000 verses exploring power, family, duty, and liberation.","content":"\n      <h3>The Encyclopedia of Human Destiny</h3>\n      <p>Composed by sage Krishna Dvaipayana Vyasa and transcribed by Lord Ganesha, the Mahabharata spans 100,000 verses across 18 Parvas. It is not merely the chronicle of a dynastic war, but an inexhaustible inquiry into justice, desire, political diplomacy, psychology, and metaphysical liberation.</p>\n\n      <h3>The Great Crucible of the Kurus</h3>\n      <p>Tracing the descendants of King Bharata from Shantanu and Ganga through the blinding ambition of Dhritarashtra, the dice game at Hastinapur, the disrobing of Draupadi, and the 13-year exile, the epic tests every human relationship against the crucible of truth.</p>\n\n      <h3>Outcome: The Fifth Veda</h3>\n      <p>Revered as the Fifth Veda (Panchama Veda), the Mahabharata concludes with Vyasa's lament: <em>\"With uplifted arms I cry, yet no one listens: from Dharma arise both wealth and pleasure — why then is Dharma not followed?\"</em> It remains the supreme mirror of the human soul.</p>\n    ","childrenIds":["pandavas","kauravas","charioteer"],"title_hi":"महाभारत महाकाव्य (पंचम वेद)","epoch_hi":"कुरु वंश — महर्षि वेदव्यास विरचित","summary_hi":"एक लाख श्लोकों में रचा गया विश्व का विशालतम महाकाव्य, जिसमें धर्म, अर्थ, काम और मोक्ष का सम्पूर्ण सार समाहित है।","quote_hi":"यन्नेहास्ति न तत् क्वचित् — जो इस महाभारत में नहीं है, वह संसार में कहीं भी उपलब्ध नहीं है","content_hi":"\n      <h3>मानव जीवन का महाकोश</h3>\n      <p>महर्षि वेदव्यास द्वारा प्रणीत और श्रीगणेश द्वारा लिपिबद्ध महाभारत एक लाख श्लोकों और १८ पर्वों में फैला विश्व का सबसे बड़ा महाकाव्य है। इसे 'पंचम वेद' कहा जाता है क्योंकि इसमें जीवन का ऐसा कोई रहस्य नहीं है जो वर्णित न हो।</p>\n\n      <h3>कुरु वंश का महामंथन</h3>\n      <p>महाराज शांतनु, भीष्म की भीषण प्रतिज्ञा, धृतराष्ट्र का मोह, द्यूत-क्रीड़ा में द्रौपदी का चीरहरण और पाण्डवों के १२ वर्ष के वनवास एवं १ वर्ष के अज्ञातवास से होते हुए यह कथा कुरुक्षेत्र के १८ दिवसीय महायुद्ध तक पहुँचती है।</p>\n\n      <h3>परिणाम एवं अमर संदेश</h3>\n      <p>व्यास जी का अंतिम उद्घोष है — 'धर्म से ही अर्थ और काम सिद्ध होते हैं, फिर भी लोग धर्म का आचरण क्यों नहीं करते?' महाभारत सिखाता है कि अधर्म कितना भी शक्तिशाली क्यों न हो, अंत में विजय केवल और केवल 'धर्म' की ही होती है — <em>'यतो धर्मस्ततो जयः'</em>।</p>\n    "},{"id":"pandavas","title":"Pandavas","sanskrit":"पाण्डवाः (धर्मपुत्राः)","category":"lineage","epoch":"The Righteous Five","tier":21,"parentId":"mahabharata","x":40,"y":-1200,"z":1900,"symbol3D":"lotus","image":"assets/images/pandavas.jpg","quote":"Yato dharmastato jayah — Where there is Dharma, there is victory","summary":"The five sons of Pandu: Yudhishthira, Bhima, Arjuna, Nakula, and Sahadeva, guided by Krishna.","content":"\n      <h3>The Birth of the Five Virtues</h3>\n      <p>Born to Kunti and Madri through divine invocations (Dharma, Vayu, Indra, and the Ashvins), the Pandava brothers represent the five foundational pillars of righteous life: Moral Law (Yudhishthira), Physical Vitality and Courage (Bhima), Focused Intellect and Skill (Arjuna), Balance and Aesthetic Nobility (Nakula), and Analytical Wisdom (Sahadeva).</p>\n\n      <h3>From the Wax Palace to Indraprastha</h3>\n      <p>Surviving the assassination attempt in the flammable house of lac (Lakshagriha), winning Draupadi in her Svayamvara, and transforming the arid desert of Khandavaprastha into the jewel-capital Indraprastha, the brothers adhered to righteousness despite relentless provocations.</p>\n\n      <h3>Outcome: Restoration of Cosmic Balance</h3>\n      <p>Guided by Krishna through the 18 days of Kurukshetra, the Pandavas triumphed over systemic corruption, establishing an era of compassionate rule under Emperor Yudhishthira.</p>\n    ","childrenIds":["yudhishthira","bhima","arjuna"],"title_hi":"पंच पाण्डव (धर्म के पाँच प्रहरी)","epoch_hi":"द्वापर युग — इन्द्रप्रस्थ के निर्माता","summary_hi":"राजा पाण्डु के पाँच देवपुत्र: युधिष्ठिर, भीम, अर्जुन, नकुल और सहदेव; जिन्होंने द्रौपदी के साथ मिलकर धर्म की रक्षा की।","quote_hi":"पाण्डवानां जयो नित्यम् — जहाँ धर्म और श्रीकृष्ण हैं, वहाँ पाण्डवों की विजय निश्चित है","content_hi":"\n      <h3>देव-अंश से पाँच गुणों का प्राकट्य</h3>\n      <p>माता कुंती और माद्री द्वारा देवताओं के आह्वान से जन्मे पांचों भाई मानवीय सद्गुणों के प्रतीक हैं: युधिष्ठिर (सत्य व धर्म), भीम (अतुलित बल), अर्जुन (एकाग्रता व पराक्रम), नकुल (सौंदर्य व संतुलन), और सहदेव (त्रिकालदर्शी विवेक)।</p>\n\n      <h3>लाक्षागृह से इन्द्रप्रस्थ तक</h3>\n      <p>कौरवों के षड्यंत्र लाक्षागृह से जीवित बचकर, द्रौपदी स्वयंवर जीतकर, उन्होंने बंजर खाण्डवप्रस्थ को दिव्य राजधानी 'इन्द्रप्रस्थ' में बदल दिया। जुए में सर्वस्व हारने और १३ वर्ष के वनवास के बाद भी उन्होंने धर्म का मार्ग कभी नहीं छोड़ा।</p>\n\n      <h3>परिणाम एवं धर्म की पुनर्स्थापना</h3>\n      <p>श्रीकृष्ण के मार्गदर्शन में कुरुक्षेत्र युद्ध जीतकर पाण्डवों ने हस्तिनापुर के सिंहासन पर पुनः धर्म का ध्वज फहराया।</p>\n    "},{"id":"yudhishthira","title":"Yudhishthira","sanskrit":"युधिष्ठिर (धर्मराज)","category":"lineage","epoch":"Dharmaraja","tier":22,"parentId":"pandavas","x":0,"y":-1260,"z":1980,"symbol3D":"lotus","image":"assets/images/yudhishthira.jpg","quote":"Satyam eva jayate — Truth alone triumphs","summary":"Eldest Pandava, son of Dharma, renowned for steadfast adherence to truth and righteousness even in grief.","content":"\n      <h3>The Anchor of Uncompromising Truth</h3>\n      <p>Eldest of the Pandavas and born of Yama (Dharma), Yudhishthira was renowned throughout the earth as <em>Ajātaśatru</em> (one who has no enemy). Even amidst the harshest trials, his commitment to truth was so unblemished that his war chariot hovered four fingers above the ground without touching dust.</p>\n\n      <h3>The Yaksha Prashna & The Test of Compassion</h3>\n      <p>When his four brothers lay dead at a forest lake after drinking without permission, the guardian Yaksha questioned Yudhishthira on metaphysics, ethics, and human psychology. Answering all questions flawlessly, Yudhishthira requested the life of Nakula rather than his own full-brother Arjuna or Bhima, ensuring that his stepmother Madri's lineage would not become extinct — moving the Yaksha (Dharma in disguise) to revive all four brothers.</p>\n\n      <h3>Outcome: The Lone Mortal Who Reached Heaven</h3>\n      <p>After a 36-year righteous reign in Hastinapur, Yudhishthira ascended the Himalayas. Accompanied only by a loyal dog (Dharma incarnate), he refused to enter heaven if his faithful canine companion was barred, earning him entry into paradise in his living mortal body.</p>\n    ","childrenIds":[],"title_hi":"धर्मराज युधिष्ठिर (अजातशत्रु)","epoch_hi":"कुरुक्षेत्र युग — सत्य और धर्म के अधिपति","summary_hi":"यमराज के अंश से उत्पन्न पाण्डवों के ज्येष्ठ भ्राता, जिन्होंने यक्ष के प्रश्नों का उत्तर देकर भाइयों को जीवित किया और सशरीर स्वर्ग गए।","quote_hi":"सत्यमेव जयते नानृतम् — सत्य की ही विजय होती है, असत्य की कभी नहीं","content_hi":"\n      <h3>सत्य के साक्षात् विग्रह</h3>\n      <p>धर्मराज के अंश से जन्मे युधिष्ठिर का जीवन सत्य और न्याय के प्रति पूर्ण निष्ठा का प्रतीक था। वे कभी झूठ नहीं बोलते थे, जिसके कारण उनका रथ धरती से चार अंगुल ऊपर हवा में चलता था।</p>\n\n      <h3>यक्ष प्रश्न एवं निःस्वार्थ दया</h3>\n      <p>जब सरोवर पर प्यास से चारों भाई मृत पड़े थे, तब यक्ष के गूढ़ प्रश्नों का युधिष्ठिर ने अत्यंत विवेकपूर्ण उत्तर दिया। जब यक्ष ने एक भाई को जीवित करने को कहा, तो उन्होंने अपने सगे भाई अर्जुन या भीम को न चुनकर सौतेली माता माद्री के पुत्र नकुल को चुना, ताकि माता माद्री का कुल भी जीवित रहे। उनकी इस समदृष्टि से प्रसन्न होकर यक्ष (धर्मराज) ने सभी भाइयों को जीवित कर दिया।</p>\n\n      <h3>परिणाम: सशरीर स्वर्गारोहण</h3>\n      <p>३६ वर्ष तक निष्पक्ष शासन के बाद जब वे हिमालय की यात्रा पर निकले, तो केवल एक श्वान (कुत्ता) उनके साथ बचा। जब इन्द्र ने श्वान को स्वर्ग ले जाने से मना किया, तो युधिष्ठिर ने स्वर्ग का सुख ठुकरा दिया। उनकी इस वफादारी और करुणा के कारण वे सशरीर स्वर्ग में प्रविष्ट होने वाले एकमात्र मनुष्य बने।</p>\n    "},{"id":"bhima","title":"Bhima","sanskrit":"भीम (वृकोदर)","category":"lineage","epoch":"Unmatched Might","tier":22,"parentId":"pandavas","x":40,"y":-1260,"z":1980,"symbol3D":"mandala","image":"assets/images/bhima.jpg","quote":"Vrikodara — The wolf-bellied hero of ten thousand elephants' strength","summary":"Son of Vayu, giant of immense physical strength, slayer of Jarasandha, Kichaka, and Duryodhana.","content":"\n      <h3>The Embodiment of Righteous Wrath</h3>\n      <p>Born of Vayu to Kunti, Bhima possessed the strength of 10,000 elephants. Whenever tyrants and cannibals terrorized innocent people, Bhima acted as the immediate physical shield: slaying the man-eating demons Hidimba and Bakasura, and ridding Bharat of the despotic King Jarasandha in an epic 14-day wrestling duel orchestrated by Krishna.</p>\n\n      <h3>The Vows of the Dice Hall</h3>\n      <p>When Draupadi was dragged into Hastinapur's assembly and humiliated, while elders hung their heads in silence, Bhima roared irreversible vows: to drink the blood of Dushasana and smash the thighs of Duryodhana with his mace. In the Kurukshetra war, he single-handedly slew all one hundred Kaurava brothers, fulfilling every vow to the letter.</p>\n\n      <h3>Outcome: The Protector of the Weak</h3>\n      <p>Bhima demonstrated that true physical strength finds meaning only in protecting the innocent, upholding family dignity, and confronting evil directly without compromise.</p>\n    ","childrenIds":[],"title_hi":"महाबली भीम (वृकोदर)","epoch_hi":"द्वापर युग — अतुलित बाहुबल","summary_hi":"वायुपुत्र, दस सहस्र हाथियों के बल से संपन्न, जिन्होंने हिडिम्ब, बकासुर, कीचक, जरासंध और दुःशासन-दुर्योधन का वध किया।","quote_hi":"गदायुद्ध-प्रवीणः — अजेय गदाधारी, जिन्होंने द्रौपदी के अपमान का प्रतिशोध लेकर अपनी प्रतिज्ञा पूर्ण की","content_hi":"\n      <h3>अतुलित बल एवं निर्भयता के प्रतीक</h3>\n      <p>पवनदेव के अंश से जन्मे भीम में दस सहस्र हाथियों का बल था। वे पाण्डवों के मुख्य रक्षा-कवच थे। उन्होंने हिडिम्ब और बकासुर जैसे नरभक्षी राक्षसों का संहार कर प्रजा की रक्षा की और जरासंध का मल्लयुद्ध में वध कर बंदी राजाओं को मुक्त कराया।</p>\n\n      <h3>द्यूत-सभा की भीषण प्रतिज्ञाएँ</h3>\n      <p>जब भरी सभा में द्रौपदी का अपमान हुआ, तो भीम ने क्रोध में गर्जना करते हुए प्रतिज्ञा की थी कि वे दुःशासन की छाती का रक्त पिएंगे और दुर्योधन की जंघा तोड़ेंगे। कुरुक्षेत्र के १८ दिवसीय युद्ध में भीम ने अकेले ही कौरवों के समस्त १०० भाइयों का वध किया और अपनी प्रत्येक प्रतिज्ञा को पूर्ण किया।</p>\n\n      <h3>परिणाम एवं संदेश</h3>\n      <p>भीम का चरित्र सिखाता है कि बल और सामर्थ्य का वास्तविक उपयोग अहंकार दिखाने में नहीं, बल्कि निर्बलों की रक्षा और अन्याय के विरुद्ध अडिग खड़े होने में है।</p>\n    "},{"id":"arjuna","title":"Arjuna","sanskrit":"अर्जुन (पार्थ / गाण्डीवधारी)","category":"lineage","epoch":"The Peerless Archer","tier":22,"parentId":"pandavas","x":80,"y":-1260,"z":1980,"symbol3D":"chakra","image":"assets/images/arjuna.jpg","quote":"Nara-Narayana sakhau — The eternal comrade of Krishna","summary":"Son of Indra, master archer wielding the Gandiva bow, the recipient of the Bhagavad Gita on the battlefield.","content":"\n      <h3>The Summit of Unbroken Focus</h3>\n      <p>Third Pandava and son of Indra, Arjuna stands as the eternal symbol of supreme concentration (Ekagrata). When tested by Drona to aim at a wooden bird in a tree, while other princes saw branches and leaves, Arjuna saw only the pupil of the bird's eye.</p>\n\n      <h3>Penance on Indrakeela & Pashupatastra</h3>\n      <p>During exile, Arjuna performed rigorous tapas in the Himalayas. Challenged by Shiva disguised as a tribal hunter (Kirata), Arjuna fought with such courage and devotion that Shiva revealed himself, bestowing the ultimate cosmic weapon, the <strong>Pāśupatāstra</strong>. Yet on the brink of war at Kurukshetra, overwhelmed by grief at the thought of slaying kin, Arjuna laid down his Gandiva bow.</p>\n\n      <h3>Outcome: The Student of the Bhagavad Gita</h3>\n      <p>Arjuna's crisis prompted Krishna's supreme discourse, transforming him from an emotionally paralysed warrior into a self-realized instrument of divine will (<em>Nimitta-mātra</em>). Slaying Bhishma, Drona, and Karna in righteous duty, Arjuna restored cosmic equilibrium.</p>\n    ","childrenIds":["gita"],"title_hi":"गांडीवधारी अर्जुन (सव्यसाची)","epoch_hi":"द्वापर युग — एकाग्रता एवं धनुर्विद्या का शिखर","summary_hi":"इन्द्र के अंश से प्रकट, द्रोणाचार्य के सर्वश्रेष्ठ शिष्य, जिन्होंने पशुपतास्त्र प्राप्त किया और कुरुक्षेत्र में कृष्ण के माध्यम से गीता सुनी।","quote_hi":"गाण्डीव-धन्वा — दोनों हाथों से सटीक बाण चलाने वाले सव्यसाची, कुरुक्षेत्र के मुख्य धनुर्धर","content_hi":"\n      <h3>एकाग्रता और पुरुषार्थ का सर्वोच्च आदर्श</h3>\n      <p>इन्द्र के अंश से उत्पन्न अर्जुन द्रोणाचार्य के सबसे प्रिय और श्रेष्ठ शिष्य थे। जब गुरु ने चिड़िया की आँख पर निशाना लगाने को कहा, तो केवल अर्जुन को चिड़िया की आँख की पुतली दिखाई दी — जो उनके अद्वितीय ध्यान का प्रमाण था।</p>\n\n      <h3>इंद्रकील पर्वत पर तप एवं पाशुपतास्त्र</h3>\n      <p>वनवास काल में अर्जुन ने महादेव को प्रसन्न करने के लिए कठोर तप किया। किरात रूपी शिव से बाण-युद्ध करने के बाद, शिव जी ने प्रसन्न होकर उन्हें अपना अमोघ 'पाशुपतास्त्र' प्रदान किया। किंतु कुरुक्षेत्र में अपनों को देखकर वे मोहग्रस्त हो गए और उन्होंने गांडीव रख दिया।</p>\n\n      <h3>परिणाम एवं गीता का साक्षात् शिष्य</h3>\n      <p>अर्जुन के मोह को दूर करने के लिए भगवान श्रीकृष्ण ने उन्हें 'गीता' का दिव्य उपदेश दिया। आत्म-ज्ञान प्राप्त कर अर्जुन भगवान के निमित्त मात्र बने और भीष्म, द्रोण व कर्ण जैसे महारथियों को परास्त कर धर्म की विजय सुनिश्चित की।</p>\n    "},{"id":"kauravas","title":"Kauravas","sanskrit":"कौरवाः (धार्तराष्ट्राः)","category":"lineage","epoch":"The Hundred Brothers","tier":21,"parentId":"mahabharata","x":160,"y":-1200,"z":1900,"symbol3D":"mandala","image":"assets/images/kauravas.jpg","quote":"Adharma-sahayaka — Blinded by pride and unearned entitlement","summary":"The hundred sons of blind king Dhritarashtra, driven by Duryodhana's jealousy to war.","content":"\n      <h3>The Poison of Generational Resentment</h3>\n      <p>Born to the blind king Dhritarashtra and Gandhari, the hundred Kaurava brothers led by Duryodhana and Dushasana grew up infected by obsessive jealousy toward the accomplishments of their cousins, the Pandavas.</p>\n\n      <h3>The Scheming of Shakuni</h3>\n      <p>Under the guidance of their maternal uncle Shakuni, the Kauravas orchestrated assassinations by poison, the fire at Lakshagriha, and the rigged game of dice at Hastinapur, culminating in the public disrobing of Draupadi. When Krishna arrived as a peace messenger asking for merely five villages to avoid bloodshed, Duryodhana arrogantly replied: <em>\"I will not grant land sufficient to hold the point of a needle!\"</em></p>\n\n      <h3>Outcome: The Extinction of the Lineage</h3>\n      <p>The Kauravas serve as a tragic psychological case study: power without ethical discipline, indulged by blind parental affection, leads to the absolute destruction of a civilization.</p>\n    ","childrenIds":["duryodhana"],"title_hi":"कौरव वंश (सौ धृतराष्ट्र-पुत्र)","epoch_hi":"हस्तिनापुर — ईर्ष्या, छल एवं अधर्म","summary_hi":"गांधारी और धृतराष्ट्र के सौ पुत्र, जिन्होंने ईर्ष्या, अहंकार और शकुनि के कपट-पाश में फँसकर अपने सम्पूर्ण कुल का विनाश करा लिया।","quote_hi":"लोभ-दोष-विमोहिताः — लोभ, मोह और ईर्ष्या के अंधकार में धर्म-अधर्म का विवेक खोने वाले","content_hi":"\n      <h3>ईर्ष्या और द्वेष का घातक बीज</h3>\n      <p>नेत्रहीन राजा धृतराष्ट्र और महारानी गांधारी के सौ पुत्र, जिनमें दुर्योधन और दुःशासन प्रमुख थे, बचपन से ही पाण्डवों के प्रति गहरी ईर्ष्या रखते थे। धृतराष्ट्र के पुत्र-मोह ने उनके इस अधर्म को बढ़ावा दिया।</p>\n\n      <h3>शकुनि का कपट एवं द्रौपदी चीरहरण</h3>\n      <p>मामा शकुनि की कुटिल चालों से उन्होंने पाण्डवों को लाक्षागृह में जलाने का प्रयास किया, कपट-द्यूत में उनका राज्य छीना और भरे दरबार में कुलवधू द्रौपदी का चीरहरण कर मर्यादा की समस्त सीमाएँ तोड़ दीं। श्रीकृष्ण जब शांतिदूत बनकर पाँच गाँव माँगने आए, तो दुर्योधन ने कहा कि 'बिना युद्ध के सुई की नोक के बराबर भूमि भी नहीं दूँगा।'</p>\n\n      <h3>परिणाम: कुल का सम्पूर्ण संहार</h3>\n      <p>कौरवों का हठ उनके सम्पूर्ण वंश के विनाश का कारण बना। कुरुक्षेत्र के युद्ध में सौ के सौ भाई मारे गए। यह आख्यान सिखाता है कि अंधा मोह और अनियंत्रित ईर्ष्या बड़े-से-बड़े राजवंश को धूल में मिला देती है।</p>\n    "},{"id":"duryodhana","title":"Duryodhana","sanskrit":"दुर्योधन (सुयोधन)","category":"lineage","epoch":"The Stubborn King","tier":22,"parentId":"kauravas","x":160,"y":-1260,"z":1980,"symbol3D":"mandala","image":"assets/images/duryodhana.jpg","quote":"Na dasyami vina yuddham suchyagramapi medinim — Not even a needle-point of land without war!","summary":"Eldest Kaurava brother, whose pride, obstinacy, and envy brought the downfall of the Kuru elders.","content":"\n      <h3>The Tragedy of Conscious Adharma</h3>\n      <p>Duryodhana was a courageous warrior, skilled mace-fighter trained by Balarama, and an extraordinarily loyal friend to Karna. His tragedy lay in his self-confessed psychology: <em>\"Jānāmi dharmaṃ na ca me pravṛttiḥ, jānāmy-adharmaṃ na ca me nivṛttiḥ\"</em> (I know what is righteous, yet have no inclination for it; I know what is unrighteous, yet cannot turn away from it).</p>\n\n      <h3>The Climax at the Dvaipayana Lake</h3>\n      <p>After his vast armies were decimated across 18 days, Duryodhana hid in the depths of Lake Dvaipayana using water-solidifying mantras. Challenged by Yudhishthira, he engaged Bhima in an epic final mace duel. As Bhima smashed his thighs (the very thighs on which he had invited Draupadi to sit), Duryodhana fell, refusing to bow his head even in agony.</p>\n\n      <h3>Outcome: The End of an Era</h3>\n      <p>Duryodhana demonstrates that great physical prowess, intelligence, and royal birth are completely worthless if the heart is gripped by pride, toxic entitlement, and stubborn hatred.</p>\n    ","childrenIds":[],"title_hi":"दुर्योधन (सुयोधन)","epoch_hi":"अहंकार एवं कुरुक्षेत्र का मूल कारण","summary_hi":"धृतराष्ट्र का ज्येष्ठ पुत्र, महाबली गदाधर, जिसका हठ, अन्याय और कृष्ण के प्रति अवज्ञा महाभारत युद्ध का मुख्य कारण बनी।","quote_hi":"जानामि धर्मं न च मे प्रवृत्तिः — मैं धर्म को जानता हूँ किंतु मेरी उसमें रुचि नहीं, अधर्म को जानता हूँ किंतु उससे निवृत्ति नहीं","content_hi":"\n      <h3>हठधर्मिता और अहंकार की पराकाष्ठा</h3>\n      <p>दुर्योधन एक अत्यंत कुशल गदा-योद्धा और कर्ण का परम मित्र था। किंतु उसका मन ईर्ष्या और अहंकार से इतना ग्रस्त था कि उसने स्वयं कहा: 'मैं जानता हूँ कि धर्म क्या है किंतु मेरी उसमें प्रवृत्ति नहीं होती, मैं जानता हूँ कि अधर्म क्या है किंतु मैं उससे पीछे नहीं हट पाता।'</p>\n\n      <h3>द्वैपायन सरोवर एवं अंतिम गदा युद्ध</h3>\n      <p>१८ दिनों में अपनी सम्पूर्ण सेना के मारे जाने के बाद दुर्योधन द्वैपायन सरोवर के जल में जाकर छिप गया। पाण्डवों की ललकार पर उसने भीम के साथ भीषण गदा युद्ध किया। भीम ने उसकी जांघों पर गदा से प्रहार कर उसे भूमि पर गिरा दिया।</p>\n\n      <h3>परिणाम एवं शिक्षा</h3>\n      <p>मरणासन्न अवस्था में भी दुर्योधन ने अपनी भूल स्वीकार नहीं की। दुर्योधन का पतन यह शाश्वत चेतावनी है कि जो मनुष्य सत्य और विवेक की वाणी को ठुकराकर केवल अपने हठ पर चलता है, उसका सर्वनाश होकर रहता है।</p>\n    "},{"id":"charioteer","title":"Krishna as Charioteer","sanskrit":"पार्थसारथि","category":"avatar","epoch":"Kurukshetra Field","tier":21,"parentId":"mahabharata","x":100,"y":-1200,"z":1900,"symbol3D":"chakra","image":"assets/images/charioteer.jpg","quote":"Sarva dharman parityajya mamekam sharanam vraja — Surrender all dharmas unto Me alone (Gita 18.66)","summary":"Krishna guiding Arjuna's four white horses, unarmed, steer the battle through divine wisdom.","content":"\n      <h3>The Lord as Humble Servant</h3>\n      <p>Before the Kurukshetra war, when both Duryodhana and Arjuna arrived in Dvaraka to seek Krishna's alliance, Krishna offered a choice: on one side, his massive Narayani military army; on the other, himself alone, completely unarmed. While Duryodhana chose the armed legions, Arjuna fell at Krishna's feet and chose only the Lord as his unarmed charioteer.</p>\n\n      <h3>Steering the White Horses Amidst Arrows</h3>\n      <p>Taking the reins of the four white horses (Shaibya, Sugriva, Meghapushpa, Balahaka), Krishna placed his chariot directly between the two assembled armies (<em>Senayor ubhayor madhye</em>). Guiding Arjuna through volleys of astras, shielding him from fatal strikes by Karna and Bhishma, Krishna washed and tended the wounded horses with his own hands at sunset.</p>\n\n      <h3>Outcome: The Inner Charioteer of Human Consciousness</h3>\n      <p>Parthasarathi serves as the timeless allegory from the Katha Upanishad: the physical body is the chariot, the intellect (Buddhi) is the charioteer, the senses are the wild horses, and the soul is the passenger. When human beings surrender the reins of life to God, ultimate victory is guaranteed.</p>\n    ","childrenIds":["gita"],"title_hi":"पार्थसारथि (श्रीकृष्ण सारथि रूप)","epoch_hi":"कुरुक्षेत्र — धर्म का परम सारथ्य","summary_hi":"शस्त्र न उठाने की प्रतिज्ञा कर अर्जुन के चार श्वेत घोड़ों के रथ को हांकने वाले जगद्गुरु श्रीकृष्ण।","quote_hi":"पार्थसारथि नमस्तुभ्यम् — अर्जुन के रथ को विजय की ओर ले जाने वाले, जीवन के सच्चे सारथि श्रीकृष्ण","content_hi":"\n      <h3>शस्त्रहीन सारथि का चुनाव</h3>\n      <p>कुरुक्षेत्र युद्ध से पूर्व जब दुर्योधन और अर्जुन श्रीकृष्ण से सहायता माँगने पहुँचे, तो प्रभु ने विकल्प दिया — एक ओर मेरी लाखों की नारायणी सेना, और दूसरी ओर मैं अकेला और निःशस्त्र। दुर्योधन ने सेना चुनी, किंतु अर्जुन ने हाथ जोड़कर साक्षात् परमात्मा को अपने रथ का सारथि (पार्थसारथि) चुन लिया।</p>\n\n      <h3>रणभूमि में घोड़ों की बागडोर</h3>\n      <p>चार श्वेत घोड़ों वाले रथ पर बैठकर श्रीकृष्ण ने दोनों सेनाओं के मध्य रथ खड़ा किया। उन्होंने न केवल अर्जुन को बाणों और अमोघ अस्त्रों से बचाया, बल्कि संध्या के समय स्वयं अपने हाथों से घोड़ों के घावों को धोकर उनकी सेवा की।</p>\n\n      <h3>परिणाम: जीवन का सच्चा सारथि</h3>\n      <p>कठोपनिषद् के अनुसार यह शरीर एक रथ है, इन्द्रियाँ घोड़े हैं, मन लगाम है, और बुद्धि सारथि है। जब मनुष्य अपने जीवन-रथ की बागडोर अंतर्यामी परमात्मा (श्रीकृष्ण) को सौंप देता है, तो संसार के किसी भी महायुद्ध में उसकी पराजय असंभव हो जाती है।</p>\n    "},{"id":"gita","title":"Bhagavad Gita","sanskrit":"🕉️ श्रीमद्भगवद्गीता","category":"scripture","epoch":"The Song Divine","tier":23,"parentId":"arjuna","x":90,"y":-1320,"z":2060,"symbol3D":"lotus","image":"assets/images/krishna_gita.jpg","quote":"Karmanyevadhikaraste ma phaleshu kadachana — Thou hast right to work alone, never to its fruits (Gita 2.47)","summary":"700 verses across 18 chapters revealing the synthesis of Karma, Jnana, Dhyana, and Bhakti Yoga.","content":"\n      <h3>The Existential Crisis of the Warrior</h3>\n      <p>Stationed between the two vast armies, observing beloved grandfathers (Bhishma), teachers (Drona), and kin arrayed for slaughter, Arjuna experienced complete psychological breakdown. His limbs trembled, his Gandiva bow slipped from his hand, and he sank onto the chariot floor, refusing to fight.</p>\n\n      <h3>The 700 Verses Across 18 Chapters</h3>\n      <p>In response, Krishna smiled and delivered the supreme metaphysical revelation. He dismantled the illusion of death (the eternal soul cannot be slain by weapons or burned by fire), reconciled Karma Yoga (detached righteous duty), Bhakti Yoga (loving surrender), and Jnana Yoga (spiritual discrimination), culminating in Chapter 11 with the terrifying, majestic revelation of his Cosmic Form (<strong>Viśvarūpa</strong>) as all-devouring Time.</p>\n\n      <h3>Outcome: Complete Freedom to Act</h3>\n      <p>Krishna concluded not with dogma, but with divine freedom: <em>\"Yathecchasi tathā kuru\"</em> (Reflect deeply upon this truth, and then act as you choose). Enlightened and fearless, Arjuna rose, picked up his bow, and proclaimed: <em>\"Naṣṭo mohaḥ\"</em> (My delusion is destroyed; I shall execute your word).</p>\n    ","childrenIds":["kurukshetra_war"],"title_hi":"श्रीमद्भगवद्गीता (गीतोपदेश)","epoch_hi":"कुरुक्षेत्र रणभूमि — १८ अध्याय एवं ७०० श्लोक","summary_hi":"विषादग्रस्त अर्जुन को श्रीकृष्ण द्वारा दिया गया ब्रह्मज्ञान, जिसमें कर्मयोग, भक्तियोग और ज्ञानयोग का समन्वय है।","quote_hi":"कर्मण्येवाधिकारस्ते मा फलेषु कदाचन — तुम्हारा अधिकार केवल कर्म करने में है, उसके फलों में कभी नहीं (भगवद्गीता २.४७)","content_hi":"\n      <h3>अर्जुन का विषाद</h3>\n      <p>कुरुक्षेत्र की रणभूमि में अपने ही गुरुजनों, भाइयों और संबंधियों को शस्त्र लिए सामने देखकर अर्जुन का हृदय काँप उठा। उनका गांडीव धनुष हाथ से छूट गया और वे रथ के पीछे बैठकर विलाप करने लगे कि 'मैं अपनों का वध करके राज्य का सुख नहीं भोगना चाहता।'</p>\n\n      <h3>अठारह अध्याय एवं विराट स्वरूप</h3>\n      <p>भगवान श्रीकृष्ण ने मुस्कुराते हुए अर्जुन को आत्मा की अमरता का ज्ञान दिया — 'आत्मा को न शस्त्र काट सकते हैं, न अग्नि जला सकती है।' उन्होंने निष्काम कर्मयोग, भक्तियोग और ज्ञानयोग का समन्वय समझाया और ११वें अध्याय में अपना 'विराट स्वरूप' दिखाकर यह सिद्ध किया कि काल के रूप में वे पहले ही अधर्मियों का संहार कर चुके हैं, अर्जुन को केवल निमित्त बनना है।</p>\n\n      <h3>परिणाम: मोह-भंग एवं विजय</h3>\n      <p>भगवान ने अर्जुन को स्वतंत्र निर्णय लेने को कहा — 'यथेच्छसि तथा कुरु'। ज्ञान के प्रकाश से अर्जुन का अज्ञान मिट गया और उन्होंने कहा: 'नष्टो मोहः स्मृतिर्लब्धा' (मेरा मोह नष्ट हो गया, मैं आपके आदेश का पालन करूँगा)। गीता आज भी सम्पूर्ण मानवता के आंतरिक धर्म-संकटों को दूर करने वाली शाश्वत संजीवनी है।</p>\n    "},{"id":"kurukshetra_war","title":"Kurukshetra War","sanskrit":"कुरुक्षेत्र महायुद्धम् (अष्टादश दिनानि)","category":"war","epoch":"18 Epic Days","tier":24,"parentId":"gita","x":90,"y":-1380,"z":2140,"symbol3D":"chakra","image":"assets/images/kurukshetra.jpg","quote":"Dharma-kshetre kuru-kshetre — On the sacred soil of Dharma, the decisive cosmic war was fought","summary":"The 18-day conflict involving 18 Akshauhini armies, catastrophic celestial astra warfare, and the rebirth of order.","content":"\n      <h3>The Inevitable Clash of Armies</h3>\n      <p>Eighteen Akshauhinis (millions of chariots, elephants, cavalry, and infantry) assembled on the sacred plain of Kurukshetra. For 18 days, the greatest martial contest in recorded antiquity pitted sacred codes of chivalry against desperate violations of ethics.</p>\n\n      <h3>The Four Phases of Command</h3>\n      <ul>\n        <li><strong>Days 1–10 (Bhishma):</strong> Unstoppable slaughter by the patriarch until immobilised upon a bed of arrows behind Shikhandi.</li>\n        <li><strong>Days 11–15 (Drona):</strong> The Chakravyuha formation; 16-year-old Abhimanyu's martyrdom; Arjuna's retribution against Jayadratha; Drona laying down arms upon spiritual detachment.</li>\n        <li><strong>Days 16–17 (Karna):</strong> Titanic duel between the two greatest archers; Karna's chariot wheel trapped in mud; the fatal Anjalika arrow.</li>\n        <li><strong>Day 18 (Shalya & Duryodhana):</strong> Shalya's fall; Bhima shattering Duryodhana's thighs in the mace duel; night massacre of Pandava sons by Ashvatthama.</li>\n      </ul>\n\n      <h3>Outcome: A Cleansed Canvas for the Future</h3>\n      <p>With almost all warriors slain on both sides, the war demonstrated the catastrophic cost of adharma. Emperor Yudhishthira took the throne amidst tears, burying his kin and inaugurating a reign of deep sorrow turned into spiritual wisdom.</p>\n    ","childrenIds":["krishna_departs"],"title_hi":"कुरुक्षेत्र महायुद्ध (१८ दिवसीय महासमर)","epoch_hi":"द्वापर युग का निर्णायक संहार","summary_hi":"१८ दिन, १८ अक्षौहिणी सेना, जिसमें भीष्म शरशय्या पर सोए, अभिमन्यु ने चक्रव्यूह भेदा और अधर्म का समूल नाश हुआ।","quote_hi":"यतो धर्मस्ततो जयः — जहाँ धर्म है, वहाँ श्रीकृष्ण हैं; और जहाँ श्रीकृष्ण हैं, वहीं विजय है","content_hi":"\n      <h3>१८ दिन का विनाशकारी धर्म-युद्ध</h3>\n      <p>कुरुक्षेत्र की पवित्र भूमि पर १८ अक्षौहिणी सेनाओं का महासंग्राम हुआ। यह युद्ध सत्ता के लिए नहीं, बल्कि पृथ्वी पर धर्म की पुनर्स्थापना के लिए लड़ा गया था।</p>\n\n      <h3>युद्ध के चार प्रमुख चरण</h3>\n      <ul>\n        <li><strong>१ से १०वाँ दिन (भीष्म पितामह):</strong> भीष्म के अजेय बाणों से हाहाकार; अंततः शिखंडी की आड़ में अर्जुन द्वारा भीष्म को बाणों की शय्या पर सुलाना।</li>\n        <li><strong>११ से १५वाँ दिन (गुरु द्रोणाचार्य):</strong> चक्रव्यूह में वीर अभिमन्यु की शहादत; अर्जुन द्वारा जयद्रथ वध; 'अश्वत्थामा मारा गया' सुनकर द्रोण का शस्त्र त्याग।</li>\n        <li><strong>१६ एवं १७वाँ दिन (कर्ण):</strong> अर्जुन और कर्ण का महाद्वंद्व; कर्ण के रथ का पहिया जमीन में धंसना और उसका वध।</li>\n        <li><strong>१८वाँ दिन (दुर्योधन वध):</strong> मल्ल-युद्ध में भीम द्वारा दुर्योधन की जंघा तोड़ना और युद्ध की समाप्ति।</li>\n      </ul>\n\n      <h3>परिणाम: भारी रक्तपात एवं धर्म-राज्य</h3>\n      <p>करोड़ों योद्धाओं के बलिदान के उपरांत पाण्डवों की विजय हुई। युधिष्ठिर हस्तिनापुर के सम्राट बने, किंतु इस महाविनाश ने यह सिखाया कि युद्ध कभी उत्सव नहीं होता; अधर्म का अंत केवल भीषण मूल्य चुकाकर ही संभव होता है।</p>\n    "},{"id":"krishna_departs","title":"Krishna Departs","sanskrit":"श्रीकृष्णावसानम् एवं मौसल पर्व","category":"yuga","epoch":"Dawn of Kali (3102 BCE)","tier":25,"parentId":"kurukshetra_war","x":0,"y":-1440,"z":2220,"symbol3D":"chakra","image":"assets/images/krishna_departs.jpg","quote":"Mausale sarva-vinashaha — The Yadava clan dissolved, and Krishna departed to his supreme abode","summary":"The departure of Krishna from Prabhasa Tirtha, the submersion of golden Dvaraka, and the dawn of Kali Yuga.","content":"\n      <h3>The Fulfillment of Gandhari's Curse</h3>\n      <p>Thirty-six years after Kurukshetra, the curse uttered by Queen Gandhari in her grief took effect. Arrogance and internal strife corrupted the Yadava princes in Dvaraka, who mocked visiting rishis, bringing a curse that an iron pestle would destroy their race.</p>\n\n      <h3>The Destruction at Prabhasa & Jara's Arrow</h3>\n      <p>At Prabhasa Patan, intoxicated Yadavas turned against one another with sea reeds that acted like iron clubs, annihilating the dynasty. Krishna retired beneath a Peepal tree into deep meditation. A hunter named Jara (the reincarnation of King Vali from Treta Yuga) mistook Krishna's lotus-like foot for a deer's ear and shot an arrow tipped with the remains of the iron pestle.</p>\n\n      <h3>Outcome: Sinking of Dvaraka & Dawn of Kali Yuga</h3>\n      <p>Krishna blessed the remorseful hunter and ascended to Vaikuntha in his four-armed cosmic form. Immediately, the Arabian Sea surged forward and inundated the golden city of Dvaraka, marking the exact astronomical boundary (February 17/18, 3102 BCE) when Kali Yuga took full possession of the earth.</p>\n    ","childrenIds":["kali_yuga"],"title_hi":"श्रीकृष्ण महाप्रयाण (द्वारका विलोप)","epoch_hi":"३१०२ ईसा पूर्व — कलियुग का प्रादुर्भाव","summary_hi":"गांधारी का शाप, प्रभास तीर्थ में यदुवंश का गृहयुद्ध, जरा नामक बहेलिए का बाण और भगवान का वैकुण्ठ गमन।","quote_hi":"प्रभास-महाप्रयाण — अपनी नित्य लीला समेटकर भगवान श्रीकृष्ण का वैकुण्ठ प्रस्थान","content_hi":"\n      <h3>गांधारी का शाप एवं यदुवंश का अंत</h3>\n      <p>महाभारत युद्ध के ३६ वर्ष बाद महारानी गांधारी का शाप फलित हुआ। द्वारका में यादवों में अहंकार बढ़ा और ऋषियों के शाप से लोहे के मूसल से उत्पन्न मूंज की घासों से उन्होंने प्रभास तीर्थ में आपस में लड़कर अपने कुल का अंत कर लिया।</p>\n\n      <h3>जरा बहेलिए का बाण एवं वैकुण्ठ गमन</h3>\n      <p>श्रीकृष्ण एक पीपल के वृक्ष के नीचे ध्यानमग्न बैठे थे। 'जरा' नामक बहेलिए ने उनके चरण के पद्म को मृग का मुख समझकर बाण चला दिया। जब बहेलिया क्षमा माँगने लगा, तो प्रभु ने उसे सांत्वना दी (वह त्रेता युग के बालि का पुनर्जन्म था) और अपने दिव्य चतुर्भुज रूप में वैकुण्ठ पधार गए।</p>\n\n      <h3>परिणाम: द्वारका का जलमग्न होना एवं कलियुग का आरंभ</h3>\n      <p>प्रभु के प्रस्थान करते ही समुद्र ने स्वर्णमयी द्वारका को अपनी लहरों में डुबो दिया। आर्यभट्ट की गणना के अनुसार १८ फरवरी ३१०२ ईसा पूर्व का यह दिन कलियुग का पहला दिन बना।</p>\n    "},{"id":"kali_yuga","title":"Kali Yuga","sanskrit":"🔴 कलियुग (अधर्माधिक्यम्)","category":"yuga","epoch":"Kali Yuga (432,000 Years)","tier":26,"parentId":"krishna_departs","x":0,"y":-1500,"z":2300,"symbol3D":"mandala","image":"assets/images/kali_yuga.jpg","quote":"Kalau keshava kirtanat — In Kali Yuga, simple chanting of the divine name achieves highest liberation","summary":"The fourth cosmic age: Dharma stands on only one leg. Materialism, confusion, but unprecedented spiritual grace.","content":"\n      <h3>The Iron Age of Material Discord</h3>\n      <p>Kali Yuga is the fourth and final cosmic age of each Mahayuga, spanning 432,000 solar years (of which roughly 5,100 years have elapsed). In this era, Dharma stands upon only a single leg: Charity (Dana). Virtues like truth, purity, and tapas diminish drastically as human minds become agitated by consumerism, deceit, and short lifespans.</p>\n\n      <h3>The Paradoxical Blessing of Kali</h3>\n      <p>Yet the Puranas celebrate Kali Yuga for a singular reason: while in Satya Yuga liberation demanded thousands of years of samadhi, and in Treta/Dvapara lavish yajnas and temple rites, in Kali Yuga sincere remembrance and chanting of the divine name (<em>Nāma-saṅkīrtana</em>) is sufficient to attain supreme liberation.</p>\n\n      <h3>Outcome: Sanctuary in the Heart</h3>\n      <p>Kali Yuga challenges individuals to preserve personal integrity without depending on external social structures, making genuine spiritual seekers shining beacons amidst darkness.</p>\n    ","childrenIds":["kali_present","kali_future"],"title_hi":"कलियुग (वर्तमान युग — ४,३२,००० वर्ष)","epoch_hi":"धर्म केवल एक चरण पर — नाम संकीर्तन","summary_hi":"वह युग जब धर्म केवल एक चरण (दान) पर खड़ा है; कलह, लोभ और अंधकार का काल; किंतु जहाँ केवल भगवन्नाम स्मरण से मोक्ष मिलता है।","quote_hi":"कलियुगे केवलं नाम संकीर्तनम् — कलियुग में कठिन तप या यज्ञ नहीं, केवल प्रभु का सच्चा नाम-जप ही भवसागर से पार लगाता है","content_hi":"\n      <h3>लोभ और कलह का युग</h3>\n      <p>कलियुग महायुग का अंतिम चरण है, जिसकी अवधि ४,३२,००० वर्ष है (जिसमें से लगभग ५,१०० वर्ष बीत चुके हैं)। इसमें धर्म केवल एक पैर (दान) पर टिका है। सत्य, तप और पवित्रता का लोप होता है और मनुष्य की आयु व बुद्धि क्षीण होती है।</p>\n\n      <h3>कलियुग का परम वरदान</h3>\n      <p>पुराणों का वचन है कि कलियुग दोषों का सागर होने पर भी एक महान गुण से संपन्न है — जो फल सत्ययुग में सहस्रों वर्षों के तप से और त्रेता में बड़े-बड़े यज्ञों से मिलता था, वह कलियुग में केवल सच्चे मन से 'हरि-नाम संकीर्तन' करने से सहज ही प्राप्त हो जाता है।</p>\n\n      <h3>परिणाम एवं शिक्षा</h3>\n      <p>कलियुग मनुष्य को अंतर्मुखी बनने की प्रेरणा देता है। बाहर चाहे कितना भी अधर्म और कोलाहल क्यों न हो, जो मनुष्य अपने अंतःकरण में ईश्वर का स्मरण रखता है, वह समस्त पापों से अछूता रहता है।</p>\n    "},{"id":"kali_present","title":"Present Age","sanskrit":"वर्तमान काल (कलियुग प्रथम चरण)","category":"yuga","epoch":"Current Epoch (~5,125+ Years In)","tier":27,"parentId":"kali_yuga","x":-60,"y":-1560,"z":2380,"symbol3D":"mandala","image":"assets/images/kali_present.jpg","quote":"Bhakti-marge sarva-siddhih — Through the path of devotion, all perfection is attained","summary":"The current lived experience: technological acceleration, social transformation, and the living heritage of temple worship.","content":"\n      <h3>The Paradox of Modern Humanity</h3>\n      <p>We currently exist in the first quarter of Kali Yuga. Humanity has achieved staggering technological mastery, space exploration, and instant global communication, yet suffers from unprecedented loneliness, mental anxiety, ecological destruction, and spiritual emptiness.</p>\n\n      <h3>Living Temples & Sacred Heritage</h3>\n      <p>From the ghats of Varanasi and the snows of Kedarnath to sacred chanting in millions of homes, the living river of Sanatana Dharma continues unbroken. Ancient wisdom (Yoga, Ayurveda, Vedanta) is recognized globally as the ultimate medicine for modern stress.</p>\n\n      <h3>Outcome: Awakening in Daily Life</h3>\n      <p>The present age reminds us that sacred history is not dead myth. Every conscious breath, acts of daily seva, and mindful living in harmony with nature allows each individual to keep the golden thread of Dharma alive.</p>\n    ","childrenIds":["satya_yuga_return"],"title_hi":"वर्तमान काल (कलियुग की वर्तमान अवस्था)","epoch_hi":"कलयुग के प्रथम चरण का प्रवाह","summary_hi":"तकनीकी विकास, भौतिक समृद्धि किंतु मानसिक अशांति और आध्यात्मिक प्यास का काल; प्राचीन मंदिरों और तीर्थों की निरंतरता।","quote_hi":"कलौ चण्डि-विनायकौ — कलियुग में माँ चण्डी (दुर्गा) और विघ्नहर्ता विनायक की उपासना शीघ्र फलदायी होती है","content_hi":"\n      <h3>आधुनिक युग का अंतर्द्वंद्व</h3>\n      <p>वर्तमान समय कलियुग का प्रथम चरण है। विज्ञान और तकनीक ने भौतिक दूरियाँ मिटा दी हैं, किंतु मनुष्य का मन अशांति, एकाकीपन और स्वार्थ से पीड़ित है। प्रकृति का दोहन पर्यावरण संकट को जन्म दे रहा है।</p>\n\n      <h3>जीवंत परंपरा एवं तीर्थ</h3>\n      <p>काशी की मणिकर्णिका, केदारनाथ के तुंग शिखर और तिरुपति के शंख-ध्वनि में आज भी सनातन धर्म की अखंड चेतना स्पंदित हो रही है। योग, आयुर्वेद और वेदान्त आज सम्पूर्ण विश्व को मानसिक शांति का मार्ग दिखा रहे हैं।</p>\n\n      <h3>परिणाम एवं आज का कर्तव्य</h3>\n      <p>वर्तमान काल हमें सिखाता है कि धर्म कोई प्राचीन इतिहास नहीं, बल्कि हमारे दैनिक कर्मों, सत्यनिष्ठा और प्रकृति के प्रति सम्मान में जीवित रहने वाला जीवन-मूल्य है।</p>\n    "},{"id":"kali_future","title":"Future Prophecy","sanskrit":"भविष्य पुराण कथनानि","category":"yuga","epoch":"Kali Yuga Finale","tier":27,"parentId":"kali_yuga","x":60,"y":-1560,"z":2380,"symbol3D":"chakra","image":"assets/images/kali_future.jpg","quote":"Kalki-rupena dharmo punah — Prophesied re-emergence of dharma through Kalki","summary":"The terminal phase of Kali Yuga where moral decay reaches its apex, awaiting divine intervention.","content":"\n      <h3>The Darkest Twilight of the Age</h3>\n      <p>The Vishnu Purana and Srimad Bhagavatam contain astonishing prophetic descriptions of deep Kali Yuga: leaders will rule for personal plunder; wealth will become the sole measure of nobility; rivers will dry up; and trees will cease to bear fruit as human lifespan contracts to twenty years.</p>\n\n      <h3>The Collapse of Moral Discrimination</h3>\n      <p>When deception is hailed as cleverness, sacred texts are mocked, and innocence is preyed upon without shame, the earth will groan under unbearable adharma, praying once more for cosmic deliverance.</p>\n\n      <h3>Outcome: The Need for Kalki</h3>\n      <p>This darkness is not an eternal damnation, but the necessary composting of an exhausted cosmic era, preparing the universe for the cataclysmic purification of the Kalki Avatar.</p>\n    ","childrenIds":["kalki"],"title_hi":"भविष्य भविष्यवाणी (घोर कलियुग)","epoch_hi":"भविष्य — धर्म का पूर्ण ह्रास","summary_hi":"विष्णु पुराण और भागवत के अनुसार आने वाले समय में जब अधर्म अपनी चरम सीमा पर पहुँचेगा और प्रकृति कुपित होगी।","quote_hi":"धर्मस्य ह्रासो भवेत् — जैसे-जैसे कलियुग बढ़ेगा, छल-कपट को ही गुण और बल को ही न्याय माना जाएगा","content_hi":"\n      <h3>पुराणों की विस्मयकारी भविष्यवाणियाँ</h3>\n      <p>श्रीमद्भागवत और विष्णु पुराण में कलियुग के अंतिम समय का स्पष्ट वर्णन है: शासक प्रजा रक्षक न होकर भक्षक बनेंगे, धनवान को ही सदाचारी माना जाएगा, नदियाँ सूख जाएंगी और मनुष्य की औसत आयु घटकर २०-३० वर्ष रह जाएगी।</p>\n\n      <h3>नैतिक पतन की पराकाष्ठा</h3>\n      <p>जब वेदों और संतों का उपहास उड़ाया जाएगा, छल को ही चतुराई समझा जाएगा और अधर्म का साम्राज्य होगा, तब पृथ्वी पुनः पाप के बोझ से त्रस्त होकर भगवान की शरण में जाएगी।</p>\n\n      <h3>परिणाम एवं नए युग की तैयारी</h3>\n      <p>यह अंधकार किसी अंत का नहीं, बल्कि एक नए प्रभात की पूर्ववेला है। जब बुराई अपनी चरम सीमा पर पहुँच जाती है, तभी उसके विनाश और 'कल्कि अवतार' की दिव्य भूमिका तैयार होती है।</p>\n    "},{"id":"kalki","title":"Kalki","sanskrit":"🐎 कल्कि अवतार","category":"avatar","epoch":"End of Kali Yuga","tier":28,"parentId":"kali_future","x":60,"y":-1620,"z":2460,"symbol3D":"chakra","image":"assets/images/kalki.jpg","quote":"Shambhale grama-mukhye — Born in Shambhala as the warrior of blazing purity","summary":"The tenth avatar, riding the winged white steed Devadatta with a blazing sword to destroy adharma.","content":"\n      <h3>The Prophesied Restorer</h3>\n      <p>When the darkest midnight of Kali Yuga envelops creation, Lord Vishnu will take birth in the village of Shambhala in the home of the pious Brahmin Vishnuyasha, designated as <strong>Kalki</strong> (the Destroyer of Filth).</p>\n\n      <h3>The White Winged Stallion Devadatta</h3>\n      <p>Initiated in divine warfare by the immortal Chiranjivi Parashurama, Kalki will mount the radiant white flying horse Devadatta, wielding the blazing diamond sword Ratnamala. Sweeping across the planet like a lightning storm, he will annihilate corrupt tyrants, clearing the soil of greed, hypocrisy, and demonic ideologies.</p>\n\n      <h3>Outcome: The Cosmic Reset to Satya Yuga</h3>\n      <p>With the annihilation of corrupt forces, the surviving minds of human beings will awaken clear as crystal (<em>Sphatika-sankasha</em>). The fragrance of Kalki's divine presence will purify the earth, instantaneously inaugurating the golden age of Satya Yuga once again.</p>\n    ","childrenIds":["end_of_kali"],"title_hi":"भगवान कल्कि (अंतिम अवतार)","epoch_hi":"कलियुग का समापन — सम्भल ग्राम","summary_hi":"देवदत्त नामक श्वेत अश्व पर आरूढ़, रत्नमाला खड्गधारी भगवान विष्णु के दसवें अवतार, जो अधर्म का समूल नाश करेंगे।","quote_hi":"कृतान्त-रूपधारी — सम्भल ग्राम में अवतरित होकर दुष्टों का संहार करने वाले भविष्य के रक्षक","content_hi":"\n      <h3>भविष्य का दसवां अवतार</h3>\n      <p>कलियुग के अंत में जब अधर्म असहनीय हो जाएगा, तब भगवान विष्णु 'सम्भल' नामक तीर्थ में विष्णुयशा नामक धर्मनिष्ठ ब्राह्मण के घर 'कल्कि' रूप में जन्म लेंगे।</p>\n\n      <h3>देवदत्त अश्व एवं रत्नमाला खड्ग</h3>\n      <p>अमर महर्षि परशुराम जी उन्हें दिव्यास्त्रों की शिक्षा देंगे। भगवान कल्कि 'देवदत्त' नामक तेजस्वी श्वेत अश्व पर सवार होकर और हाथ में चमचमाती 'रत्नमाला' तलवार लेकर दुष्टों, आतताइयों और भ्रष्ट शासकों का संहार करेंगे।</p>\n\n      <h3>परिणाम: सत्ययुग का पुनः प्रादुर्भाव</h3>\n      <p>उनके पावन दर्शन और स्पर्श से जीवित बचे मनुष्यों के मन स्फटिक मणि के समान निर्मल हो जाएंगे। अधर्म का नाश होगा और पृथ्वी पर एक बार फिर 'सत्ययुग' (स्वर्ण युग) का सूर्योदय होगा।</p>\n    "},{"id":"end_of_kali","title":"End of Kali","sanskrit":"कलियुगान्त एवं धर्म पुनरुत्थानम्","category":"yuga","epoch":"Cosmic Rebirth","tier":29,"parentId":"kalki","x":60,"y":-1680,"z":2540,"symbol3D":"lotus","image":"assets/images/end_of_kali.jpg","quote":"Krita-yugam pravartate — The Golden Age is initiated once more","summary":"The darkness of Kali dissolves into the purifying light of truth, clearing the canvas for the new dawn.","content":"\n      <h3>The Dissolution of Ignorance</h3>\n      <p>The conclusion of Kali Yuga is marked by the complete exhaustion of Tamas (ignorance and lethargy). The false structures erected by ego collapse under the weight of their own corruption.</p>\n\n      <h3>Purifying Cosmic Fire and Rains</h3>\n      <p>Celestial fires burn away the atmospheric and psychic debris of millennia of human greed, followed by cleansing celestial downpours that refresh the earth's soils, forests, and sweet waters.</p>\n\n      <h3>Outcome: Awakening of Sattva</h3>\n      <p>The surviving souls, purified by trials, step into an era where meditation and truth are spontaneous, marking the completion of one four-fold Mahayuga cycle.</p>\n    ","childrenIds":["satya_yuga_return"],"title_hi":"कलियुग का अंत एवं महाशुद्धि","epoch_hi":"युगान्तरकारी संहार एवं चेतना-शुद्धि","summary_hi":"अधर्म के अंधकार का विनाश, प्रलयंकारी अग्नि से धरती की शुद्धि और नए सत्ययुग का स्वागत।","quote_hi":"कृतयुगं प्रवर्तते — कलियुग की कालिमा धुलते ही पुनः सत्ययुग का धर्म-चक्र प्रारंभ होता है","content_hi":"\n      <h3>अंधकार का विसर्जन</h3>\n      <p>कलियुग का अंत केवल काल की समाप्ति नहीं, बल्कि मनुष्य के भीतर के तमोगुण, वासना और अज्ञान का विसर्जन है। अधर्म का साम्राज्य अपनी ही बुराइयों के बोझ से ढह जाता है।</p>\n\n      <h3>प्रकृति की महाशुद्धि</h3>\n      <p>आकाशीय तेज और पवित्र वृष्टि से पृथ्वी के विषैले प्रभाव नष्ट हो जाते हैं। धरती की नदियाँ पुनः अमृतमयी हो जाती हैं और वन-उपवन खिल उठते हैं।</p>\n\n      <h3>परिणाम: सतोगुण का पुनर्जागरण</h3>\n      <p>मनुष्य का हृदय निर्मल हो जाता है और वह पुनः सत्य, ध्यान और अहिंसा के मार्ग पर चलने के लिए तैयार होता है।</p>\n    "},{"id":"satya_yuga_return","title":"Satya Yuga (Return)","sanskrit":"🟢 सत्य युग (पुनरागमनम्)","category":"yuga","epoch":"New Golden Age","tier":30,"parentId":"end_of_kali","x":0,"y":-1740,"z":2620,"symbol3D":"lotus","image":"assets/images/satya_yuga_return.jpg","quote":"Purnam adah purnam idam — That is whole, this is whole; from wholeness comes wholeness","summary":"The eternal cycle begins anew: Dharma stands complete on all four legs, and humanity walks in light.","content":"\n      <h3>The Dawn of Truth Anew</h3>\n      <p>Time in Sanatana Dharma moves not in a straight line toward annihilation, but in majestic, recursive cycles. Like spring following a harsh winter, Satya Yuga returns in all its untainted splendour.</p>\n\n      <h3>Life in Divine Communion</h3>\n      <p>Dharma stands proudly upon all four legs: Truth, Purity, Austerity, and Compassion. There are no kings, prisons, or armies, because every individual governs themselves through innate moral conscience. Human beings live in direct telepathic and spiritual communion with the Devas.</p>\n\n      <h3>Outcome: The Wheel Continues</h3>\n      <p>Consciousness reaches its peak of lucidity, reminding seekers that creation is a divine playground designed for the realization of supreme bliss.</p>\n    ","childrenIds":["new_cycle"],"title_hi":"सत्ययुग का पुनरागमन (कृतयुग)","epoch_hi":"नव प्रभात — १७,२८,००० मानव वर्ष","summary_hi":"सत्य का पुनः राज; जहाँ मनुष्य का जीवन ध्यान, सत्य और ईश्वर के साक्षात् सान्निध्य में व्यतीत होता है।","quote_hi":"पूर्णमदः पूर्णमिदम् — वह पूर्ण है, यह पूर्ण है; पूर्ण से ही पूर्ण का प्रकटीकरण होता है","content_hi":"\n      <h3>स्वर्ण युग की वापसी</h3>\n      <p>समय कोई सीधी रेखा नहीं है जो विनाश में समाप्त हो जाए, बल्कि यह एक शाश्वत चक्र है। कलियुग की रात्रि के बाद सत्ययुग का दिव्य प्रभात पुनः आता है।</p>\n\n      <h3>चार चरणों पर धर्म</h3>\n      <p>सत्ययुग में धर्म अपने चारों चरणों — सत्य, तप, पवित्रता और दया पर पूर्ण रूप से प्रतिष्ठित होता है। किसी राजा या दंड की आवश्यकता नहीं होती क्योंकि प्रत्येक मनुष्य का अंतःकरण ही उसका मार्गदर्शक होता है। मनुष्य ध्यानमग्न रहकर ईश्वर का साक्षात्कार करते हैं।</p>\n\n      <h3>परिणाम</h3>\n      <p>यह युग प्रमाणित करता है कि सत्य सनातन है; अंधकार कितना भी लंबा क्यों न हो, प्रकाश का पुनरागमन अवश्यंभावी है।</p>\n    "},{"id":"new_cycle","title":"New Cycle","sanskrit":"नूतन सृष्टि चक्र","category":"cosmos","epoch":"Cosmic Recurrence","tier":31,"parentId":"satya_yuga_return","x":0,"y":-1800,"z":2700,"symbol3D":"chakra","image":"assets/images/cosmic_return.jpg","quote":"Chakravat parivartante dukhani cha sukhani cha — Life and cosmic epochs rotate like a great chariot wheel","summary":"The eternal cosmic wheel (Kalachakra): Mahayugas, Manvantaras, Kalpas, and Brahma's lifespan.","content":"\n      <h3>The Endless Spiral of Cosmic Time</h3>\n      <p>The Hindu sages mapped time on breathtaking cosmological scales that anticipate modern astrophysics. The Kalachakra (Wheel of Time) ensures that no golden age lasts forever, nor does any dark age remain permanent.</p>\n\n      <h3>The Four-Fold Engine</h3>\n      <p>One Mahayuga consists of four yugas in the descending ratio of 4:3:2:1 (Satya: 1.728M, Treta: 1.296M, Dvapara: 864K, Kali: 432K years = 4.32 million human years). 71 Mahayugas form a Manvantara; 14 Manvantaras form a Kalpa.</p>\n\n      <h3>Outcome: The Perspective of Detachment</h3>\n      <p>Contemplating the vast wheel of time dissolves narrow human anxieties, cultivating profound equanimity and reverence for the infinite cosmic dance.</p>\n    ","childrenIds":["mahayuga"],"title_hi":"नव कालचक्र (कालचक्र भ्रमण)","epoch_hi":"शाश्वत आवर्तन — युगों का चक्रव्यूह","summary_hi":"सत्य, त्रेता, द्वापर और कलि का चक्र रथ के पहिए के समान निरंतर घूमता रहता है; काल की विशालता।","quote_hi":"चक्रवत् परिवर्तन्ते दुःखानि च सुखानि च — सुख-दुःख और काल के युग रथ के पहिए के समान निरंतर घूमते हैं","content_hi":"\n      <h3>अनंत समय का पहिया</h3>\n      <p>ऋषियों ने काल की ऐसी सूक्ष्म और विशाल गणना की जो आधुनिक खगोलशास्त्र को भी चकित करती है। कालचक्र पहिए के समान घूमता है — न सुख सदा रहता है, न दुःख; न स्वर्ण युग स्थिर है, न अंधकार।</p>\n\n      <h3>चार युगों का अनुपात</h3>\n      <p>एक महायुग में ४:३:२:१ के अनुपात में चार युग (सत्य: १७.२८ लाख, त्रेता: १२.९६ लाख, द्वापर: ८.६४ लाख, कलि: ४.३२ लाख वर्ष) कुल ४३ लाख २० हजार वर्षों में पूर्ण होते हैं।</p>\n\n      <h3>आध्यात्मिक फल</h3>\n      <p>कालचक्र का ध्यान करने से मनुष्य का अहंकार और तात्कालिक चिंताएं विलीन हो जाती हैं और वह जीवन को साक्षी भाव से देखने लगता है।</p>\n    "},{"id":"mahayuga","title":"Mahayuga","sanskrit":"🔄 महायुग (चतुर्युग चक्र)","category":"yuga","epoch":"4.32 Million Solar Years","tier":32,"parentId":"new_cycle","x":0,"y":-1860,"z":2780,"symbol3D":"chakra","image":"assets/images/mahayuga.jpg","quote":"Chatur-yuga samahara — The complete cycle of four ages","summary":"One full cycle containing Satya, Treta, Dvapara, and Kali Yugas, repeating 1,000 times in each Kalpa.","content":"\n      <h3>The Unit of Cosmic Epochs</h3>\n      <p>A Mahayuga is the complete elemental breathing cycle of civilizational virtue, encompassing the birth, golden youth, mature struggle, and chaotic dissolution of society across 4.32 million solar years.</p>\n\n      <h3>The Mathematical Harmony</h3>\n      <p>Each yuga is framed by a transitional twilight dawn (Sandhya) and evening (Sandhyamsha) equal to one-tenth of its duration. In every single Mahayuga, the primary avataras descend to re-tune the cosmic symphony.</p>\n\n      <h3>Outcome: The Cosmic Rhythm</h3>\n      <p>This recursive periodicity demonstrates that life is not random happenstance, but rhythmic, purposeful, and harmonized with the deeper laws of consciousness.</p>\n    ","childrenIds":["manvantara"],"title_hi":"महायुग (चतुर्युग चक्र)","epoch_hi":"४३ लाख २० हजार मानव वर्ष","summary_hi":"सत्य, त्रेता, द्वापर और कलि — इन चारों युगों का एक पूर्ण समुच्चय, जो एक कल्प में १,००० बार दोहराया जाता है।","quote_hi":"चतुर्युग-समाहारः — चारों युगों का पूर्ण चक्र, जो ब्रह्मा के एक दिन में एक सहस्र बार घूमता है","content_hi":"\n      <h3>सभ्यता का पूर्ण चक्र</h3>\n      <p>महायुग मानव चेतना और सभ्यता के उत्थान और पतन की एक पूरी इकाई है। इसमें चार युग अपनी संधिकाल सहित ४३ लाख २० हजार वर्षों में पूरे होते हैं।</p>\n\n      <h3>गणितीय सामंजस्य</h3>\n      <p>प्रत्येक युग के आरंभ और अंत में संधिकाल होता है। प्रत्येक महायुग में धर्म की रक्षा के लिए भगवान के अवतार होते हैं और काल का क्रम आगे बढ़ता है।</p>\n\n      <h3>परिणाम</h3>\n      <p>यह विराट गणना दर्शाती है कि सृष्टि का चलना कोई आकस्मिक घटना नहीं, बल्कि एक सुनियोजित और लयबद्ध ब्रह्माण्डीय संगीत है।</p>\n    "},{"id":"manvantara","title":"Manvantara","sanskrit":"मन्वन्तर (मनु काल)","category":"yuga","epoch":"306.72 Million Solar Years","tier":33,"parentId":"mahayuga","x":0,"y":-1920,"z":2860,"symbol3D":"mandala","image":"assets/images/manvantara.jpg","quote":"Chaturdasha manvantaraani — 14 Manvantaras in each single Day of Brahma","summary":"The reign of a distinct Manu, Indra, Saptarshis, and Devas, separated by partial ocean dissolutions.","content":"\n      <h3>The Administrative Regimes of Manu</h3>\n      <p>Each single Day of Brahma is partitioned into 14 cosmic administrative regimes known as Manvantaras, each lasting approximately 306.72 million solar years.</p>\n\n      <h3>The Leadership Council of Each Era</h3>\n      <p>Every Manvantara features its own unique governing council: a presiding Manu (progenitor), a distinct Indra (king of gods), a dedicated group of Saptarshis (seven cosmic sages), and an appointed Avatara. We presently exist in the reign of Vaivasvata Manu, the 7th progenitor.</p>\n\n      <h3>Outcome: Renewal through Deluge</h3>\n      <p>At the conclusion of each Manvantara, a Sandhi deluge partially dissolves the earth, cleansing societal impurities before the next Manu establishes the subsequent order.</p>\n    ","childrenIds":["kalpa"],"title_hi":"मन्वन्तर (मनु का शासन काल)","epoch_hi":"३० करोड़ ६७ लाख २० हजार वर्ष","summary_hi":"एक मनु का शासन काल; ब्रह्मा के एक दिन में १४ मन्वन्तर होते हैं; वर्तमान में ७वें वैवस्वत मनु का काल चल रहा है।","quote_hi":"चतुर्दश मन्वन्तराणि — ब्रह्मा के एक ही दिन में चौदह मन्वन्तर व्यतीत होते हैं","content_hi":"\n      <h3>मनु का शासन और व्यवस्था</h3>\n      <p>ब्रह्मा जी के एक दिन में १४ मन्वन्तर होते हैं। प्रत्येक मन्वन्तर लगभग ३० करोड़ ६७ लाख २० हजार मानव वर्षों का होता है।</p>\n\n      <h3>प्रत्येक मन्वन्तर के अधिकारी</h3>\n      <p>प्रत्येक मन्वन्तर में एक नए मनु (आदि-पुरुष), नए इन्द्र, नए सप्तऋषि और भगवान का एक विशेष अवतार होता है। वर्तमान में हम सातवें 'वैवस्वत मनु' के मन्वन्तर में जी रहे हैं।</p>\n\n      <h3>परिणाम</h3>\n      <p>मन्वन्तर के अंत में एक आंशिक प्रलय होती है जो पुरानी व्यवस्था को धोकर नए मनु के लिए स्वच्छ भूमि तैयार करती है।</p>\n    "},{"id":"kalpa","title":"Kalpa","sanskrit":"कल्प (ब्रह्मणः दिनम्)","category":"yuga","epoch":"4.32 Billion Solar Years","tier":34,"parentId":"manvantara","x":0,"y":-1980,"z":2940,"symbol3D":"chakra","image":"assets/images/kalpa.jpg","quote":"Kalpah sahasra-yugah — A Kalpa consists of one thousand Mahayugas","summary":"One Day of Brahma: 4.32 billion years, at the end of which Brahma sleeps and the three worlds dissolve in fire and water.","content":"\n      <h3>The Working Day of the Creator</h3>\n      <p>A Kalpa equals exactly one daytime period of Lord Brahma: 1,000 Mahayugas, spanning 4.32 billion human solar years. During this unimaginably vast span, galaxies, solar systems, and lifeforms flourish across the fourteen Lokas.</p>\n\n      <h3>The Shvetavaraha Kalpa</h3>\n      <p>Our current Kalpa is the Shvetavaraha Kalpa, so named because Lord Vishnu assumed the white boar form at its dawn to lift Earth from the cosmic ocean.</p>\n\n      <h3>Outcome: Nightfall Approaches</h3>\n      <p>When the 4.32 billion years expire, Brahma prepares to sleep, bringing forth the partial cosmic dissolution known as Naimittika Pralaya.</p>\n    ","childrenIds":["brahma_day"],"title_hi":"कल्प (ब्रह्मा का एक दिन)","epoch_hi":"४ अरब ३२ करोड़ मानव वर्ष","summary_hi":"ब्रह्मा का एक दिन, जिसमें १,००० महायुग बीतते हैं; वर्तमान में 'श्वेतवराह कल्प' चल रहा है।","quote_hi":"कल्पः सहस्रयुगः — एक सहस्र महायुगों से ब्रह्मा जी का केवल एक दिन बनता है (भगवद्गीता ८.१७)","content_hi":"\n      <h3>सृष्टिकर्ता का एक दिवस</h3>\n      <p>कल्प ब्रह्मा जी का एक दिन कहलाता है, जिसकी अवधि ४ अरब ३२ करोड़ वर्ष है। इसमें एक हजार महायुग बीत जाते हैं। इस काल में चौदह भुवन फलते-फूलते हैं।</p>\n\n      <h3>श्वेतवराह कल्प</h3>\n      <p>हमारे वर्तमान कल्प का नाम 'श्वेतवराह कल्प' है, क्योंकि इसके आरंभ में प्रभु ने वराह रूप लेकर पृथ्वी को जल से निकाला था।</p>\n\n      <h3>परिणाम</h3>\n      <p>कल्प की समाप्ति पर ब्रह्मा जी शयन करते हैं और तीनों लोकों में आंशिक प्रलय (नैमित्तिक प्रलय) होती है।</p>\n    "},{"id":"brahma_day","title":"Brahma's Day & Night","sanskrit":"अहोरात्र — ब्रह्मणः","category":"cosmos","epoch":"Cosmic Breathing (8.64 Billion Years)","tier":35,"parentId":"kalpa","x":0,"y":-2040,"z":3020,"symbol3D":"mandala","image":"assets/images/brahma_day.jpg","quote":"Naimittika pralaya — The dissolution that occurs every cosmic night of Brahma","summary":"When Brahma sleeps for 4.32 billion years, the lower and middle worlds dissolve into dormant cosmic waters.","content":"\n      <h3>The Cosmic Respiration</h3>\n      <p>Just as living beings inhale and exhale, the cosmos expands during Brahma's waking hours and withdraws during his sleep. Brahma's night lasts an identical 4.32 billion years.</p>\n\n      <h3>The Naimittika Pralaya</h3>\n      <p>When Brahma sleeps, the sun and moon withdraw their rays. The lower and middle worlds (Bhuloka, Bhuvarloka, Svarloka) are consumed by subterranean fires and submerged into the cosmic waters, while higher sages reside safely in Maharloka and Janaloka.</p>\n\n      <h3>Outcome: Rebirth at Dawn</h3>\n      <p>All dormant souls rest within Narayana's cosmic consciousness without losing their karmic seeds. When Brahma awakens, dawn breaks and creation begins anew.</p>\n    ","childrenIds":["brahma_life"],"title_hi":"ब्रह्मा का दिन और रात (नैमित्तिक प्रलय)","epoch_hi":"८ अरब ६४ करोड़ वर्ष (अहोरात्र)","summary_hi":"ब्रह्मा के जागने पर सृष्टि और सोने पर प्रलय; ४.३२ अरब वर्ष का दिन और उतनी ही लंबी रात।","quote_hi":"नैमित्तिक प्रलयः — ब्रह्मा की प्रत्येक रात्रि में होने वाला लोकों का विश्राम और निमज्जन","content_hi":"\n      <h3>ब्रह्माण्ड की श्वास-प्रश्वास</h3>\n      <p>जैसे मनुष्य जागता और सोता है, वैसे ही ब्रह्मा जी का दिन (४.३२ अरब वर्ष) सृष्टि का काल है और रात्रि (४.३२ अरब वर्ष) प्रलय का काल है।</p>\n\n      <h3>नैमित्तिक प्रलय की रात्रि</h3>\n      <p>रात्रि के समय पृथ्वी, अंतरिक्ष और स्वर्ग लोक जलमग्न हो जाते हैं। समस्त जीवात्माएँ अपनी कर्म-वासनाओं सहित भगवान में सुप्त हो जाती हैं।</p>\n\n      <h3>परिणाम: प्रातःकाल नया सृजन</h3>\n      <p>जैसे ही ब्रह्मा जी की रात्रि समाप्त होती है और नया प्रभात होता है, सुप्त जीवात्माएँ पुनः अपने कर्मानुसार नए शरीरों में जाग उठती हैं।</p>\n    "},{"id":"brahma_life","title":"Brahma's Life","sanskrit":"ब्रह्म आयुः (महाकल्प)","category":"cosmos","epoch":"311.04 Trillion Solar Years","tier":36,"parentId":"brahma_day","x":0,"y":-2100,"z":3100,"symbol3D":"lotus","image":"assets/images/brahma_life.jpg","quote":"Shatam varshaani — 100 Brahma years comprise the lifespan of the universe","summary":"100 cosmic years of Brahma (311 trillion human years), after which all elements dissolve into Mahapralaya.","content":"\n      <h3>The Complete Lifespan of a Universe</h3>\n      <p>Brahma lives for 100 divine years (36,000 cosmic days and nights), totaling 311.04 trillion human solar years. This entire lifespan constitutes a <strong>Mahākalpa</strong>.</p>\n\n      <h3>The Parardha Midpoint</h3>\n      <p>The current Brahma has completed 50 cosmic years and is presently in the first day of his 51st year (the Second Parardha / Dvitiya Parardha), as recited in daily Hindu Sankalpa mantras.</p>\n\n      <h3>Outcome: Approaching the Great Silence</h3>\n      <p>When Brahma's 100 years conclude, the universe faces not merely a sleeping pause, but total ontological dissolution — Mahapralaya.</p>\n    ","childrenIds":["mahapralaya"],"title_hi":"ब्रह्मा की आयु (महाकल्प / परार्ध)","epoch_hi":"३११ खरब ४० अरब मानव वर्ष","summary_hi":"ब्रह्मा जी के १०० दिव्य वर्ष (३६,००० दिन-रात); वर्तमान ब्रह्मा अपने जीवन के ५१वें वर्ष में हैं।","quote_hi":"शतं वर्षाणि — सौ ब्रह्मा-वर्षों से सम्पूर्ण ब्रह्माण्ड की परम आयु निर्धारित होती है","content_hi":"\n      <h3>सम्पूर्ण ब्रह्माण्ड की आयु</h3>\n      <p>ब्रह्मा जी की आयु १०० दिव्य वर्ष (३६,००० दिन और रातें) होती है, जो ३११ खरब ४० अरब मानव वर्षों के बराबर है। इसे 'महाकल्प' कहा जाता है।</p>\n\n      <h3>द्वितीय परार्ध</h3>\n      <p>हमारे वर्तमान ब्रह्मा जी अपने ५० वर्ष पूरे कर चुके हैं और ५१वें वर्ष के प्रथम दिन में हैं। हमारे दैनिक संकल्प में इसी का उच्चारण होता है — 'द्वितीये परार्धे श्वेतवराह कल्पे'।</p>\n\n      <h3>परिणाम</h3>\n      <p>जब ब्रह्मा जी के १०० वर्ष पूरे होते हैं, तब सम्पूर्ण ब्रह्माण्ड की समस्त सामग्री मूल प्रकृति में विलीन हो जाती है।</p>\n    "},{"id":"mahapralaya","title":"Mahapralaya","sanskrit":"महाप्रलय (आत्यन्तिक संहार)","category":"cosmos","epoch":"Total Cosmic Dissolution","tier":37,"parentId":"brahma_life","x":0,"y":-2160,"z":3180,"symbol3D":"mandala","image":"assets/images/mahapralaya.jpg","quote":"Prakritau liyate sarvam — All elements, time, and space dissolve back into Prakriti","summary":"The great cosmic dissolution: all worlds, matter, and Brahma himself dissolve into the primordial unmanifest.","content":"\n      <h3>The Great Cosmic Dissolution</h3>\n      <p>At the end of Brahma's 100 years, the seven blazing suns incinerate the 14 worlds. The elemental layers dissolve in reverse order: earth dissolves into water, water into fire, fire into air, air into ether, ether into mind, mind into cosmic intelligence, and intelligence into the unmanifest Prakriti.</p>\n\n      <h3>The Century of Pure Silence</h3>\n      <p>For 100 cosmic years, absolute stillness reigns. There is no matter, no form, no time, no grief, and no death — only the supreme witness consciousness of Nirguna Brahman resting in its own infinite nature.</p>\n\n      <h3>Outcome: The Eternal Rest</h3>\n      <p>Mahapralaya is not tragedy; it is the sublime cosmic sleep before the next universal dawn, proving that in eternity, nothing is ever truly lost.</p>\n    ","childrenIds":["brahman_return"],"title_hi":"महाप्रलय (आत्यन्तिक प्रलय)","epoch_hi":"परम शून्यता एवं प्रकृति में विलय","summary_hi":"समस्त लोकों, तत्त्वों, काल और स्वयं ब्रह्मा जी का मूल अव्यक्त प्रकृति में पूर्ण विलय; १०० दिव्य वर्षों का महामौन।","quote_hi":"प्रकृतौ लीयते सर्वम् — पृथ्वी, जल, अग्नि, वायु, आकाश और मन सब मूल प्रकृति में लीन हो जाते हैं","content_hi":"\n      <h3>समस्त तत्त्वों का महाविलय</h3>\n      <p>जब ब्रह्मा जी की आयु समाप्त होती है, तब सात सूर्य एक साथ तपते हैं। पृथ्वी जल में, जल अग्नि में, अग्नि वायु में, वायु आकाश में, और आकाश अहंकार तथा मूल प्रकृति में विलीन हो जाता है। ब्रह्मा जी स्वयं परब्रह्म में लीन हो जाते हैं।</p>\n\n      <h3>सौ वर्षों का परम मौन</h3>\n      <p>सौ दिव्य वर्षों तक केवल मौन, केवल विशुद्ध चेतना (निर्गुण ब्रह्म) विद्यमान रहती है। न कोई रूप है, न नाम, न काल, न मृत्यु।</p>\n\n      <h3>परिणाम एवं विश्राम</h3>\n      <p>महाप्रलय ब्रह्माण्ड की गहरी विश्रांति है। यह सिद्ध करता है कि जो कुछ भी उत्पन्न हुआ है, वह पुनः अपने मूल स्रोत में लौटकर ही शांति पाता है।</p>\n    "},{"id":"brahman_return","title":"🕉️ Return to Brahman (↻)","sanskrit":"परब्रह्मणि लयः एवं पुनरुद्भवः","category":"cosmos","epoch":"Eternal Return `↻`","tier":38,"parentId":"mahapralaya","x":0,"y":-2220,"z":3260,"symbol3D":"mandala","image":"assets/images/brahman_return.jpg","quote":"Yato va imani bhutani jayante... tat brahma — That from which all beings arise and to which they return: that is Brahman (Taittiriya Upanishad)","summary":"The cycle completes its eternal circle: from silence, the sacred syllable OM stirs, and creation begins again `↻`.","content":"\n      <h3>The Eternal Circle Closes & Reopens</h3>\n      <p>From the unfathomable silence of Nirguna Brahman, the primordial vibration OM stirs once more. Desire awakens in the Supreme to experience the splendor of manifestation: <em>\"Ekoham bahu syām.\"</em></p>\n\n      <h3>The Ever-Turning Wheel</h3>\n      <p>A new Brahma awakens on a new lotus. Shakti stirs; Vishnu prepares to preserve; Shiva stands ready to transform. The Yugas, the Avatars, the epics, and the heroes reappear across fresh cosmic canvases, forever unbroken.</p>\n\n      <h3>Outcome: The Supreme Peace (Shanti)</h3>\n      <p>The spiritual seeker realizes that birth and death, creation and dissolution, are merely the inhalation and exhalation of God. In this realization lies absolute fearlessness, boundless love, and eternal peace: <em>OM Shanti, Shanti, Shanti.</em></p>\n    ","cyclicReturnTo":"brahman","childrenIds":[],"title_hi":"ॐ परब्रह्म में पुनरागमन (शाश्वत आवर्तन ↻)","epoch_hi":"अनादि-अनन्त चक्र — परम सत्य","summary_hi":"चक्र पूर्ण हुआ: मौन से पुनः ॐ की दिव्य ध्वनि गूँजती है, और चेतना का यह शाश्वत नृत्य अनंत काल तक चलता रहता है।","quote_hi":"यतो वा इमानि भूतानि जायन्ते... तत् ब्रह्म — जिससे समस्त भूत उत्पन्न होते हैं और जिसमें पुनः लीन हो जाते हैं, वही ब्रह्म है (तैत्तिरीयोपनिषद्)","content_hi":"\n      <h3>चक्र पूर्ण: मौन से ओंकार</h3>\n      <p>परब्रह्म के असीम मौन से पुनः आदि-नाद 'ॐ' का स्पंदन उठता है। परमात्मा का संकल्प जागता है — 'एकोऽहं बहु स्याम्'।</p>\n\n      <h3>नया ब्रह्मा, नई सृष्टि</h3>\n      <p>एक नए कमल पर नए ब्रह्मा का प्राकट्य होता है। शक्ति जागती है, विष्णु पालन की बागडोर संभालते हैं और महादेव कल्याणकारी ताण्डव करते हैं। चार युग, अवतार, रामायण और महाभारत नए स्वरूप में पुनः प्रारंभ होते हैं।</p>\n\n      <h3>परिणाम: परम शांति एवं मोक्ष</h3>\n      <p>साधक जब यह जान लेता है कि यह सम्पूर्ण चराचर जगत परमात्मा की ही अमर लीला है, तो वह समस्त संशयों और भयों से मुक्त हो जाता है। यही सनातन धर्म का सर्वोच्च सत्य है — <em>ॐ शान्तिः शान्तिः शान्तिः</em>।</p>\n    "}];

// Text normalization helper
function normalizeText(str) {
  if (!str) return '';
  return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
}

// SACRED TANPURA AUDIO SYNTHESIZER
// ============================================================
const audioEngine = {
  ctx: null, isPlaying: false, masterGain: null, oscillators: [],
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    this.ctx = new AC();
    this.masterGain = this.ctx.createGain();
    this.masterGain.gain.setValueAtTime(0.001, this.ctx.currentTime);
    this.masterGain.connect(this.ctx.destination);
  },
  startDrone() {
    this.init();
    if (this.ctx.state === 'suspended') this.ctx.resume();
    const base = 138.59; // C#3 root
    const harmonics = [
      { freq: base, type: 'sawtooth', gain: 0.28 },
      { freq: base * 1.5, type: 'sine', gain: 0.18 }, // Pa
      { freq: base * 2.0, type: 'sine', gain: 0.14 }, // Sa higher
      { freq: base * 2.01, type: 'triangle', gain: 0.08 }
    ];
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(360, this.ctx.currentTime);
    filter.Q.setValueAtTime(3.5, this.ctx.currentTime);
    filter.connect(this.masterGain);

    this.oscillators = harmonics.map(h => {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = h.type;
      o.frequency.setValueAtTime(h.freq, this.ctx.currentTime);
      g.gain.setValueAtTime(h.gain, this.ctx.currentTime);
      o.connect(g);
      g.connect(filter);
      o.start();
      return { osc: o, gain: g };
    });
    this.masterGain.gain.exponentialRampToValueAtTime(0.24, this.ctx.currentTime + 2.5);
    this.isPlaying = true;
  },
  stopDrone() {
    if (!this.isPlaying || !this.ctx) return;
    this.masterGain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 1.2);
    setTimeout(() => {
      this.oscillators.forEach(i => { try { i.osc.stop(); } catch(e){} });
      this.oscillators = [];
      this.isPlaying = false;
    }, 1300);
  },
  toggle() {
    if (this.isPlaying) { this.stopDrone(); return false; }
    else { this.startDrone(); return true; }
  }
};
