<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Age of the Gods · The Complete 3D Hindu Mythology & Timeline Tree</title>
  <meta name="description" content="Age of the Gods: Explore the complete timeline and genealogy of Sanātana Dharma: from Brahman to the Pandavas, the Yugas, Dashavatara, cosmic cycles, and sacred teachings in an interactive 3D universe and tree architecture." />
  <link rel="manifest" href="manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#010103" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;700;900&family=Martel:wght@400;600;700;800;900&family=Noto+Serif+Devanagari:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&family=Rozha+One&family=Yatra+One&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>

:root {
  --bg-primary: #010103;
  --bg-secondary: #040408;
  --surface-card: rgba(16, 16, 24, 0.88);
  --surface-elevated: rgba(24, 24, 36, 0.95);
  --border-dark: rgba(255, 119, 0, 0.22);
  --border-bright: rgba(255, 153, 51, 0.65);
  
  --saffron-primary: #FF7700;
  --saffron-bright: #FF9933;
  --saffron-glow: rgba(255, 119, 0, 0.45);
  --gold-accent: #FFB74D;
  
  --pure-white: #FFFFFF;
  --text-white: #F4F4F0;
  --text-muted: #A0A09A;
  --text-dim: #70706A;
  
  /* Ultra-Premium Devanagari & Classical Typography */
  --font-royal: 'Rozha One', 'Noto Serif Devanagari', 'Cinzel', Georgia, serif;
  --font-serif: 'Martel', 'Noto Serif Devanagari', 'Cinzel', Georgia, serif;
  --font-sans: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-display: 'Cinzel Decorative', 'Rozha One', 'Yatra One', serif;
  
  --ease-cosmic: cubic-bezier(0.16, 1, 0.3, 1);

  /* Mobile Safe Area Insets */
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: var(--bg-primary);
  color: var(--text-white);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  touch-action: manipulation;
}

/* ===== HERO / SPLASH SCREEN ===== */
.hero-screen {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  z-index: 9999;
  overflow: hidden;
  transition: opacity 1.2s ease, transform 1.2s ease;
  background: #000;
}

.hero-screen.hidden {
  opacity: 0;
  pointer-events: none;
  transform: scale(1.05);
}

.hero-picture {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  display: block;
}

.hero-bg {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  object-fit: cover;
  object-position: center 20%;
  filter: saturate(0.9) contrast(1.08);
}

.hero-overlay {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  background: linear-gradient(
    180deg,
    rgba(6, 6, 8, 0.35) 0%,
    rgba(6, 6, 8, 0.2) 30%,
    rgba(6, 6, 8, 0.55) 55%,
    rgba(6, 6, 8, 0.9) 78%,
    rgba(6, 6, 8, 0.98) 100%
  );
}

.hero-content {
  position: absolute;
  bottom: 0; left: 0; width: 100%;
  padding: 0 clamp(16px, 5vw, 48px) max(32px, calc(16px + var(--safe-bottom))) clamp(16px, 5vw, 48px);
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  animation: heroContentFadeIn 1.5s ease 0.3s both;
}

@keyframes heroContentFadeIn {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

.hero-saffron-line {
  width: 54px; height: 3px;
  background: var(--saffron-primary);
  margin-bottom: 14px;
  box-shadow: 0 0 16px var(--saffron-glow);
  border-radius: 2px;
}

.hero-title {
  font-family: var(--font-royal);
  font-size: clamp(32px, 9vw, 58px);
  font-weight: 800;
  color: var(--pure-white);
  letter-spacing: 0.5px;
  text-shadow: 0 2px 25px rgba(0,0,0,0.95), 0 0 50px rgba(255,119,0,0.4);
  margin-bottom: 8px;
  line-height: 1.15;
}

.hero-subtitle {
  font-family: var(--font-sans);
  font-size: clamp(12px, 3.2vw, 15px);
  font-weight: 600;
  color: var(--saffron-bright);
  letter-spacing: 0.8px;
  margin-bottom: 12px;
  text-shadow: 0 2px 12px rgba(0,0,0,0.8);
  max-width: 90%;
}

.hero-tagline {
  font-family: var(--font-serif);
  font-size: clamp(12px, 3.2vw, 14.5px);
  font-weight: 400;
  color: #E2E2D8;
  max-width: 680px;
  line-height: 1.7;
  margin-bottom: clamp(20px, 4vh, 34px);
  padding: 0 8px;
}

.hero-enter-btn {
  background: rgba(255,119,0,0.18);
  border: 1.5px solid var(--saffron-primary);
  color: var(--saffron-bright);
  padding: 13px clamp(28px, 6vw, 44px);
  min-height: 48px;
  border-radius: 50px;
  font-family: var(--font-serif);
  font-size: clamp(12px, 3.2vw, 14px);
  font-weight: 700;
  letter-spacing: clamp(1.5px, 2vw, 3px);
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.4s var(--ease-cosmic);
  position: relative;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(0,0,0,0.6);
  touch-action: manipulation;
}

.hero-enter-btn:hover, .hero-enter-btn:active {
  background: rgba(255,119,0,0.3);
  box-shadow: 0 0 35px var(--saffron-glow), 0 0 70px rgba(255,119,0,0.25);
  transform: translateY(-2px);
  color: #fff;
}

/* ===== 3D CANVAS ===== */
#canvas-container {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  z-index: 1;
}

/* ===== UI OVERLAY LAYER ===== */
.ui-layer {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  z-index: 10;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

/* ===== HEADER: STRICTLY ONE ROW WITH ONLY 4% HEIGHT ===== */
.ui-header-group {
  pointer-events: auto;
  height: 4vh;
  min-height: 34px;
  max-height: 42px;
  background: linear-gradient(180deg, rgba(8, 8, 12, 0.98) 0%, rgba(6, 6, 8, 0.92) 100%);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(255, 119, 0, 0.24);
  box-shadow: 0 2px 16px rgba(0, 0, 0, 0.8);
  position: relative;
  display: flex;
  align-items: center;
  padding: 0;
  overflow: hidden;
  box-sizing: border-box;
}

/* Horizontal scroll indicator buttons */
.header-nav-arrow {
  height: 100%;
  width: 22px;
  min-width: 22px;
  background: rgba(14, 14, 22, 0.92);
  border: none;
  border-right: 1px solid rgba(255, 119, 0, 0.25);
  color: var(--saffron-bright);
  font-size: 17px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 10;
  transition: all 0.2s ease;
  padding: 0;
  flex-shrink: 0;
  user-select: none;
}

.header-nav-arrow.right {
  border-right: none;
  border-left: 1px solid rgba(255, 119, 0, 0.25);
}

.header-nav-arrow:hover, .header-nav-arrow:active {
  background: rgba(255, 119, 0, 0.3);
  color: #FFFFFF;
  box-shadow: 0 0 10px var(--saffron-glow);
}

/* SINGLE HORIZONTALLY SCROLLABLE 4% ROW */
.top-header {
  height: 100%;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  padding: 0 8px;
  gap: 6px;
  position: relative;
  overflow-x: auto;
  overflow-y: hidden;
  white-space: nowrap;
  scrollbar-width: none; /* Firefox */
  -webkit-overflow-scrolling: touch;
  scroll-snap-type: x proximity;
  box-sizing: border-box;
}

.top-header::-webkit-scrollbar {
  display: none; /* Chrome, Safari, Edge */
}

.top-header > * {
  flex-shrink: 0;
  scroll-snap-align: start;
}

.brand-section {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding-right: 4px;
}

.sacred-monogram {
  width: 24px; height: 24px;
  flex-shrink: 0;
  border-radius: 50%;
  border: 1.2px solid var(--saffron-bright);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--saffron-bright);
  background: rgba(255, 119, 0, 0.12);
  box-shadow: 0 0 8px var(--saffron-glow);
}

.brand-titles {
  min-width: 0;
}

.site-title {
  font-family: var(--font-royal);
  font-size: 13.5px;
  font-weight: 700;
  color: var(--pure-white);
  letter-spacing: 0.6px;
  text-transform: uppercase;
  white-space: nowrap;
}

.action-btn {
  background: var(--surface-card);
  border: 1px solid var(--border-dark);
  color: var(--text-white);
  height: 25px;
  min-height: 25px;
  padding: 0 9px;
  border-radius: 13px;
  font-family: var(--font-sans);
  font-size: 10.5px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  transition: all 0.2s ease;
  touch-action: manipulation;
  white-space: nowrap;
}

.action-btn:hover, .action-btn:active {
  border-color: var(--saffron-bright);
  color: var(--saffron-bright);
  background: rgba(255,119,0,0.14);
  box-shadow: 0 0 10px var(--saffron-glow);
}

.action-btn.highlighted {
  border-color: var(--saffron-bright);
  color: #FFFFFF;
  background: rgba(255,119,0,0.22);
  box-shadow: 0 0 10px var(--saffron-glow);
}

/* Header Stepper Buttons & Counter Pill */
.header-step-btn {
  height: 25px;
  min-height: 25px;
  padding: 0 8px;
  border-radius: 13px;
  font-family: var(--font-sans);
  font-size: 10px;
  font-weight: 700;
  color: var(--saffron-bright);
  background: rgba(255,119,0,0.12);
  border: 1px solid rgba(255,119,0,0.35);
}

.header-step-btn:hover, .header-step-btn:active {
  background: rgba(255,119,0,0.28);
  border-color: var(--saffron-bright);
  color: #FFFFFF;
  box-shadow: 0 0 10px var(--saffron-glow);
}

.header-counter-pill {
  height: 25px;
  min-height: 25px;
  padding: 0 9px;
  border-radius: 13px;
  font-family: var(--font-sans);
  font-size: 10.5px;
  font-weight: 600;
  color: var(--text-white);
  background: rgba(18, 18, 28, 0.95);
  border: 1px solid var(--border-dark);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  white-space: nowrap;
  letter-spacing: 0.3px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.header-counter-pill:hover {
  border-color: var(--saffron-bright);
  color: var(--saffron-bright);
}

/* Header Zoom In & Out Pill Group */
.header-zoom-group {
  height: 25px;
  min-height: 25px;
  display: inline-flex;
  align-items: center;
  gap: 2px;
  background: var(--surface-card);
  border: 1px solid var(--border-dark);
  border-radius: 13px;
  padding: 0 4px;
}

.zoom-btn {
  width: 21px;
  height: 21px;
  border-radius: 50%;
  border: none;
  background: transparent;
  color: var(--text-white);
  font-family: var(--font-sans);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
  touch-action: manipulation;
}

.zoom-btn:hover, .zoom-btn:active {
  background: rgba(255,119,0,0.25);
  color: var(--saffron-bright);
}

#btn-search-toggle {
  display: inline-flex;
}

/* INLINE CATEGORY CHIPS IN SINGLE HEADER ROW */
.category-inline-chips {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  flex-shrink: 0;
}

.category-chip {
  background: rgba(20, 20, 30, 0.75);
  border: 1px solid rgba(255, 119, 0, 0.2);
  color: #B4B4AC;
  height: 24px;
  min-height: 24px;
  padding: 0 8px;
  border-radius: 12px;
  font-family: var(--font-sans);
  font-size: 10px;
  font-weight: 500;
  white-space: nowrap;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: all 0.2s ease;
  touch-action: manipulation;
  flex-shrink: 0;
}

.category-chip:hover, .category-chip.active {
  background: rgba(255, 119, 0, 0.22);
  border-color: var(--saffron-bright);
  color: #FFFFFF;
  box-shadow: 0 0 10px rgba(255, 119, 0, 0.35);
}

/* HIDE REDUNDANT STACKED ROWS TO PRESERVE STRICT 4% HEIGHT */
.category-ribbon {
  display: none !important;
}

.breadcrumbs-bar {
  display: none !important;
}

.search-container {
  position: relative;
  width: 260px;
  transition: all 0.3s ease;
}

.search-bar {
  display: flex;
  align-items: center;
  background: rgba(14,14,20,0.85);
  border: 1px solid var(--border-dark);
  border-radius: 24px;
  padding: 6px 12px;
  transition: all 0.3s ease;
}

.search-bar:focus-within {
  border-color: var(--saffron-bright);
  box-shadow: 0 0 15px var(--saffron-glow);
  background: rgba(18,18,26,0.95);
}

.search-icon-box {
  color: var(--saffron-bright);
  margin-right: 8px;
  display: flex;
  flex-shrink: 0;
}

.search-input {
  background: transparent;
  border: none;
  color: var(--pure-white);
  font-size: 13px;
  width: 100%;
  outline: none;
}

.search-input::placeholder { color: var(--text-dim); }

.search-close-mobile {
  display: none;
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-size: 16px;
  padding: 4px 8px;
  cursor: pointer;
}

.search-results-dropdown {
  position: absolute;
  top: calc(100% + 8px); right: 0;
  width: 360px;
  max-width: 90vw;
  background: var(--surface-elevated);
  border: 1px solid var(--border-bright);
  border-radius: 12px;
  max-height: 420px;
  overflow-y: auto;
  display: none;
  flex-direction: column;
  box-shadow: 0 12px 36px rgba(0,0,0,0.9);
  z-index: 100;
  -webkit-overflow-scrolling: touch;
}

.search-results-dropdown.active { display: flex; }

.search-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  cursor: pointer;
  transition: background 0.2s ease;
  touch-action: manipulation;
}

.search-item:hover, .search-item:active { background: rgba(255,119,0,0.14); }
.search-icon-cell { color: var(--saffron-bright); display: flex; align-items: center; flex-shrink: 0; }
.search-title { font-family: var(--font-serif); font-size: 13px; color: var(--pure-white); }
.search-sanskrit { font-size: 11px; color: var(--saffron-bright); }
.search-epoch { font-size: 10px; color: var(--text-muted); }

/* CATEGORY RIBBON */
.category-ribbon {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px clamp(12px, 3vw, 28px) 8px clamp(12px, 3vw, 28px);
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  scroll-snap-type: x proximity;
}

.category-ribbon::-webkit-scrollbar { display: none; }

.category-chip {
  background: rgba(14,14,20,0.7);
  border: 1px solid rgba(255,119,0,0.18);
  color: var(--text-muted);
  padding: 5px 12px;
  min-height: 32px;
  border-radius: 20px;
  font-size: 11px;
  white-space: nowrap;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s ease;
  touch-action: manipulation;
  scroll-snap-align: start;
  flex-shrink: 0;
}

.category-chip:hover, .category-chip.active {
  background: rgba(255,119,0,0.16);
  border-color: var(--saffron-bright);
  color: var(--pure-white);
  box-shadow: 0 0 12px rgba(255,119,0,0.25);
}

/* BREADCRUMBS */
.breadcrumbs-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px clamp(12px, 3vw, 28px) 8px clamp(12px, 3vw, 28px);
  font-size: 11.5px;
  color: var(--text-muted);
  overflow-x: auto;
  white-space: nowrap;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}

.breadcrumbs-bar::-webkit-scrollbar { display: none; }

.breadcrumb-item {
  cursor: pointer;
  transition: color 0.2s ease;
  white-space: nowrap;
}

.breadcrumb-item:hover { color: var(--saffron-bright); }
.breadcrumb-item.current { color: var(--pure-white); font-weight: 600; cursor: default; }

/* Audio button styling */
.audio-btn {
  background: var(--surface-card);
  border: 1px solid var(--border-dark);
  color: var(--text-muted);
  padding: 6px 12px;
  min-height: 34px;
  border-radius: 18px;
  font-size: 11px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.25s ease;
  white-space: nowrap;
  touch-action: manipulation;
}

.audio-btn.active {
  border-color: var(--saffron-bright);
  color: var(--saffron-bright);
  background: rgba(255,119,0,0.15);
  box-shadow: 0 0 14px var(--saffron-glow);
}

/* ===== SACRED TREE MAP MODAL ===== */
.tree-modal-overlay {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(4,4,6,0.94);
  backdrop-filter: blur(14px);
  z-index: 500;
  display: none;
  flex-direction: column;
  overflow: hidden;
  transition: opacity 0.3s ease;
}

.tree-modal-overlay.open { display: flex; }

.tree-modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 28px;
  border-bottom: 1px solid var(--border-bright);
  background: rgba(10,10,16,0.85);
}

.tree-modal-title-box { display: flex; flex-direction: column; }
.tree-modal-title {
  font-family: var(--font-serif);
  font-size: 20px;
  font-weight: 700;
  color: var(--pure-white);
  letter-spacing: 2px;
}
.tree-modal-subtitle {
  font-size: 11.5px;
  color: var(--saffron-bright);
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

.tree-modal-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

.tree-search-input {
  background: rgba(20,20,30,0.8);
  border: 1px solid var(--border-dark);
  color: #fff;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  width: 220px;
  outline: none;
}
.tree-search-input:focus { border-color: var(--saffron-bright); }

.tree-close-btn {
  background: transparent;
  border: 1px solid var(--border-dark);
  color: var(--text-muted);
  width: 36px; height: 36px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
}
.tree-close-btn:hover {
  border-color: var(--saffron-bright);
  color: var(--saffron-bright);
  transform: rotate(90deg);
}

.tree-viewport {
  flex-grow: 1;
  overflow: auto;
  padding: 40px 20px 80px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.tree-diagram-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 1100px;
  position: relative;
}

/* Tree Nodes in 2D Visual Map */
.tree-node-box {
  background: var(--surface-card);
  border: 1.5px solid var(--border-dark);
  border-radius: 10px;
  padding: 10px 18px;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  transition: all 0.25s var(--ease-cosmic);
  position: relative;
  z-index: 2;
  box-shadow: 0 4px 20px rgba(0,0,0,0.6);
  min-width: 140px;
  text-align: center;
}

.tree-node-box:hover {
  border-color: var(--saffron-bright);
  background: rgba(255,119,0,0.18);

.tree-node-icon {
  color: var(--saffron-bright);

  align-items: center;
  justify-content: center;

.tree-node-title {

  font-size: 13px;
  font-weight: 700;
  color: var(--pure-white);

.tree-node-sanskrit {
  font-size: 11px;
  color: var(--saffron-bright);

.tree-branch-fork {
  display: flex;

  width: 100%;
  justify-content: space-around;
  margin-top: 20px;
}

.tree-branch-fork::before {
  content: '';
  position: absolute;
  top: -20px;
  left: 20%; right: 20%;
  height: 2px;
  background: var(--saffron-primary);
  box-shadow: 0 0 8px var(--saffron-glow);
}

.tree-branch-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 1;
  position: relative;
}

.tree-branch-col::before {
  content: '';
  position: absolute;
  top: -20px;
  width: 2px;
  height: 20px;
  background: var(--saffron-primary);
  box-shadow: 0 0 8px var(--saffron-glow);
}

/* Cyclic Return Arc Box */
.tree-return-card {
  border: 2px dashed var(--saffron-bright);

  border-radius: 12px;

  text-align: center;
  box-shadow: 0 0 25px var(--saffron-glow);

  flex-direction: column;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}
.tree-return-card:hover {
  background: rgba(255,119,0,0.22);
  transform: scale(1.02);
}

/* ===== DETAIL MODAL DRAWER ===== */
.modal-container {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  z-index: 1000;
  pointer-events: none;
}

.modal-container.active { pointer-events: auto; }

.modal-backdrop {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.65);
  backdrop-filter: blur(6px);
  opacity: 0;
  transition: opacity 0.3s ease;
}

.modal-backdrop.visible { opacity: 1; }

.modal-drawer {
  position: absolute;
  top: 0; right: 0;
  width: 580px;
  max-width: 95vw;

  background: rgba(10,10,15,0.96);
  border-left: 1px solid var(--border-bright);
  box-shadow: -15px 0 50px rgba(0,0,0,0.85);

  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.modal-drawer.open { transform: translateX(0); }

.drawer-drag-handle {
  display: none;
}

.drawer-header {

  justify-content: space-between;

.drawer-badges { display: flex; align-items: center; gap: 8px; }

  border-radius: 12px;
  text-transform: uppercase;
}

.drawer-epoch-badge {

  color: var(--text-muted);

  padding: 3px 10px;
  border-radius: 12px;
}

.drawer-close-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);

  align-items: center;
  justify-content: center;
  padding: 6px;
  border-radius: 50%;

}

.drawer-close-btn:hover { color: #fff; transform: rotate(90deg); }

.drawer-scroll-body {

  overflow-y: auto;
  padding: 28px;
}

.drawer-title {

  margin-bottom: 4px;
}

.drawer-sanskrit {
  font-family: var(--font-serif);

}

.drawer-artwork-frame {
  margin: 16px 0 24px 0;

  box-shadow: 0 8px 25px rgba(0,0,0,0.8);
}

.drawer-image {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 4px;
  filter: contrast(1.05);
}

.artwork-caption {
  font-size: 11px;
  color: var(--saffron-bright);
  text-align: center;
  padding-top: 8px;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.drawer-quote {
  border-left: 3px solid var(--saffron-bright);

  padding: 12px 16px;
  margin-bottom: 20px;

  font-size: 13.5px;
  line-height: 1.6;
  color: #F4EAD8;
}

.drawer-summary {
  font-family: var(--font-sans);
  font-size: 13.5px;
  font-weight: 400;
  color: #ECECE6;
  line-height: 1.7;
  margin-bottom: 20px;
}

.drawer-content-text {
  font-family: var(--font-serif);
  font-size: 13.5px;
  color: #D6D6CE;
  line-height: 1.8;
}

.drawer-content-text h3 {
  font-family: var(--font-royal);
  font-size: 17px;
  font-weight: 700;
  color: var(--pure-white);
  margin: 20px 0 8px 0;
  border-bottom: 1px solid rgba(255,119,0,0.25);
  padding-bottom: 5px;
}

.drawer-content-text h4 {
  font-family: var(--font-royal);
  font-size: 15px;
  color: var(--saffron-bright);
  margin: 16px 0 6px 0;
}

.drawer-content-text p { margin-bottom: 12px; }
.drawer-content-text ul, .drawer-content-text ol { padding-left: 20px; margin-bottom: 16px; }
.drawer-content-text li { margin-bottom: 6px; }

.sub-events-section {
  margin-top: 32px;

  border-top: 1px solid var(--border-dark);
}

.sub-events-heading {
  font-family: var(--font-serif);
  font-size: 15px;
  color: var(--pure-white);
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
}

.sub-events-grid {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.child-node-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--surface-card);
  border: 1px solid var(--border-dark);
  padding: 12px 16px;
  border-radius: 8px;
  cursor: pointer;
  text-align: left;
  transition: all 0.2s ease;
  width: 100%;
}

.child-node-card:hover {
  border-color: var(--saffron-bright);
  background: rgba(255,119,0,0.14);
  transform: translateX(4px);
}

.card-title { font-weight: 600; color: var(--pure-white); }
.card-sanskrit { font-size: 11px; color: var(--saffron-bright); }
.card-arrow { color: var(--text-muted); }

/* TOOLTIP */
.hover-tooltip {
  position: fixed;
  pointer-events: none;
  background: rgba(8,8,12,0.92);
  border: 1px solid var(--border-bright);
  padding: 10px 16px;
  border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.8);
  font-size: 12px;
  z-index: 200;
  display: none;
  backdrop-filter: blur(6px);
}

.tooltip-title { font-family: var(--font-serif); font-size: 13px; font-weight: 700; color: var(--pure-white); }
.tooltip-sanskrit { font-size: 11px; color: var(--saffron-bright); }

/* Sacred Tree Map Tab Switcher */
.tree-view-tabs {
  display: flex;

  gap: 3px;

  border-radius: 20px;
  border: 1px solid var(--border-dark);
}

.tree-tab-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  padding: 5px 12px;
  border-radius: 16px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  touch-action: manipulation;
  white-space: nowrap;
}

.tree-tab-btn.active {
  background: var(--saffron-primary);
  color: #fff;
  box-shadow: 0 0 10px var(--saffron-glow);
}

/* Mobile List Mode in Tree Map */
.tree-list-container {
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
  padding-bottom: 30px;
}

.tree-list-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.tree-list-group-title {
  font-family: var(--font-serif);
  font-size: 12.5px;
  font-weight: 700;

  align-items: center;
  gap: 8px;
}

.tree-list-item-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--surface-card);
  border: 1px solid var(--border-dark);
  border-radius: 10px;
  padding: 10px 14px;
  cursor: pointer;
  transition: all 0.2s ease;
  width: 100%;
  text-align: left;
  touch-action: manipulation;
  gap: 10px;
}

.tree-list-item-card:hover, .tree-list-item-card:active {
  border-color: var(--saffron-bright);

.tree-list-card-title {

.tree-list-card-sanskrit {

  <script>
  // Complete Dataset with 77 sacred milestones
  const TREE_DATA = [{"id":"brahman","title":"Brahman","sanskrit":"परब्रह्मन्","category":"cosmos","epoch":"Eternal Origin (Anadi-Ananta)","tier":0,"parentId":null,"x":0,"y":140,"z":0,"symbol3D":"mandala","image":"assets/images/trimurti.jpg","quote":"Sarvam khalvidam brahma — All this is indeed Brahman (Chandogya Upanishad 3.14.1)","summary":"The formless, infinite ground of all existence (Nirguna), manifesting as Ishvara (Saguna), the Trimurti, and the cosmic order.","content":"\n      <h3>The Primordial Catalyst & Ultimate Reality</h3>\n      <p>Before time, space, and causation stirred, there existed solely Brahman — the causeless, unmanifest, infinite consciousness. In Advaita philosophy, creation is not an event forced from without, but a spontaneous projection (<em>Līlā</em>) of the divine through Maya. The cosmic question of existence arises from the innate desire of the One to experience the multiplicity of form: <em>\"Eko'ham bahu syām\"</em> (I am one; let me become many).</p>\n      \n      <h3>Cosmic Unfolding: Nirguṇa to Saguṇa</h3>\n      <p>In its transcendent, attributeless state (<strong>Nirguṇa</strong>), Brahman is pure Sat-Chit-Ananda (Truth, Consciousness, Bliss). Reflecting through cosmic potency, it manifests as <strong>Saguṇa Brahman</strong> (Īśvara), projecting the Trimūrti to conduct the cosmic functions: Brahmā to generate physical matrices, Viṣṇu to sustain harmony, and Śiva to dissolve obsolete forms for renewal.</p>\n\n      <h3>Spiritual Outcome & The Great Awakening</h3>\n      <p>The entire universe, from celestial realms to a blade of grass, is woven of this singular divine substance. The ultimate realization of the Upaniṣads is that individual consciousness (Ātman) is fundamentally non-different from Brahman: <em>Tat Tvam Asi</em> (\"That Thou Art\"). Recognizing this eternal truth dissolves the illusion of separation, conferring Mokṣa — liberation from the cyclic wheel of saṃsāra.</p>\n    ","childrenIds":["shakti","creation"],"title_hi":"परब्रह्मन्","epoch_hi":"शाश्वत आदि-स्रोत (अनादि-अनन्त)","summary_hi":"समस्त अस्तित्व का रूपरहित, असीम आधार (निर्गुण), जो ईश्वर (सगुण), त्रिमूर्ति एवं ब्रह्माण्डीय व्यवस्था के रूप में प्रकट होता है।","quote_hi":"सर्वं खल्विदं ब्रह्म — यह दृश्यमान सम्पूर्ण जगत निश्चय ही ब्रह्म है (छान्दोग्योपनिषद् ३.१४.१)","content_hi":"\n      <h3>सृष्टि का आदि-कारण एवं परम तत्त्व</h3>\n      <p>सृष्टि, काल एवं दिशाओं के प्रादुर्भाव से पूर्व केवल परब्रह्म ही विद्यमान था — अकारण, अविनाशी और अनंत विशुद्ध चैतन्य। वेदान्त के अनुसार यह चराचर जगत ब्रह्म से पृथक नहीं, अपितु उसकी शक्ति (माया) द्वारा प्रस्फुटित एक दिव्य लीला है। उपनिषदों की वाणी कहती है: <em>\"एकोऽहं बहु स्याम्\"</em> (मैं एक हूँ, बहुत हो जाऊँ)। इसी संकल्प से समस्त सृजन की चेतना जाग्रत हुई।</p>\n\n      <h3>दैवीय प्रकटीकरण: निर्गुण से सगुण की ओर</h3>\n      <p>अपने गुणातीत स्वरूप में <strong>निर्गुण ब्रह्म</strong> विशुद्ध सत्-चित्-आनन्द है। जब यह सृष्टि-संरचना के लिए सक्रिय होता है, तब <strong>सगुण ब्रह्म</strong> (ईश्वर) के रूप में प्रतिष्ठित होकर त्रिमूर्ति को जन्म देता है: ब्रह्मा जी रूपों का सृजन करते हैं, भगवान विष्णु धर्म और व्यवस्था का पालन करते हैं, तथा देवाधिदेव महादेव कालानुसार संहार कर नवीन जागरण का मार्ग प्रशस्त करते हैं।</p>\n\n      <h3>अमर उपदेश एवं परम सिद्धि</h3>\n      <p>समस्त लोक, ग्रह-नक्षत्र और प्राणी उसी एक चेतना के स्पंदन हैं। उपनिषदों का परम उद्घोष है — <em>तत्त्वमसि</em> (वह ब्रह्म तुम ही हो)। जब जीव अपने अंतःकरण में इस अभेद सत्य को जान लेता है, तब अज्ञान का आवरण नष्ट हो जाता है और जन्म-मृत्यु के भवबंधन से मुक्त होकर जीव मोक्ष को प्राप्त करता है।</p>\n    "},{"id":"shakti","title":"Shakti","sanskrit":"आदि पराशक्ति","category":"divine","epoch":"Primordial Feminine Dynamic","tier":1,"parentId":"brahman","x":-180,"y":80,"z":80,"symbol3D":"lotus","image":"assets/images/shakti.jpg","quote":"Shiva shaktya yukto yadi bhavati shaktah prabhavitum — Only united with Shakti can Shiva create (Saundaryalahari 1)","summary":"The primordial cosmic dynamic energy, without which consciousness remains still and unmanifest.","content":"\n      <h3>The Cosmic Need: The Dynamic Matrix</h3>\n      <p>Pure consciousness (Śiva) without dynamic kinetic energy is inert. For creation, transformation, and liberation to take place, the supreme ground projects its unmanifest creative potency — <strong>Ādi Parāśakti</strong>. She is the divine womb and kinetic engine of the entire multiverse.</p>\n\n      <h3>How the Divine Mother Operates</h3>\n      <p>Shakti differentiates into Mahāmāyā (the sovereign veil that enables distinct individual identities), Prakṛti (material nature), and the Tridevī: Sarasvatī (wisdom and vibration), Lakṣmī (preservation and sovereign abundance), and Pārvatī/Durgā (protection and righteous power). When cosmic balance collapses, she manifests wrathful and compassionate forms to annihilate tyranny.</p>\n\n      <h3>Outcome: The Eternal Unity of Being</h3>\n      <p>The universe operates as the unbroken dance of Śiva and Śakti — illumination and its light, fire and its heat. By honoring the divine feminine as supreme reality, seekers awaken the dormant Kuṇḍalinī energy within, harmonizing power with wisdom to achieve spiritual fullness.</p>\n    ","childrenIds":["durga","kali","parvati"],"title_hi":"आदि पराशक्ति","epoch_hi":"आद्य नारी-चेतना एवं महाऊर्जा","summary_hi":"परम ब्रह्म की क्रियाशील ब्रह्माण्डीय शक्ति, जिसके बिना चेतना अचल और अप्रकट रहती है।","quote_hi":"शिवः शक्त्या युक्तो यदि भवति शक्तः प्रभवितुम् — शक्ति से युक्त होकर ही शिव सृष्टि की रचना में समर्थ होते हैं (सौन्दर्यलहरी १)","content_hi":"\n      <h3>प्रादुर्भाव का कारण: सृजन की महाऊर्जा</h3>\n      <p>विशुद्ध चेतना (शिव) बिना क्रियाशक्ति के निष्क्रिय (शववत) रहती है। सृष्टि के विस्तार, संहार और अनुग्रह के लिए परब्रह्म अपनी अविभाज्य गतिमयी महाऊर्जा को प्रकट करता है, जिसे <strong>आदि पराशक्ति</strong> कहा गया है। वे सम्पूर्ण ब्रह्माण्ड की जननी एवं मूल प्रकृति हैं।</p>\n\n      <h3>दिव्य लीला एवं कार्यप्रणाली</h3>\n      <p>पराशक्ति महामाया के रूप में सृष्टि का विस्तार करती हैं। वे त्रिदेवी के रूप में साकार होती हैं — सरस्वती (ज्ञान व वाणी), लक्ष्मी (समृद्धि व पोषण), और पार्वती/दुर्गा (शक्ति व धर्म-रक्षा)। जब-जब आसुरी शक्तियाँ ब्रह्माण्ड के नैतिक संतुलन को नष्ट करती हैं, तब वे चंडी और काली बनकर अधर्म का दलन करती हैं।</p>\n\n      <h3>आध्यात्मिक प्रभाव एवं संदेश</h3>\n      <p>शिव और शक्ति में कोई भेद नहीं है — जैसे सूर्य और उसका प्रकाश। शक्ति की उपासना से साधक के भीतर सुप्त कुण्डलिनी शक्ति जाग्रत होती है, जो भौतिक जीवन में सामर्थ्य और आध्यात्मिक जीवन में परम मुक्ति प्रदान करती है।</p>\n    "},{"id":"durga","title":"Durga","sanskrit":"दुर्गा (महिषासुरमर्दिनी)","category":"divine","epoch":"Cosmic Protection","tier":2,"parentId":"shakti","x":-260,"y":20,"z":160,"symbol3D":"mandala","image":"assets/images/durga.jpg","quote":"Sharanaagata deenaarta paritraana paraayane — Protector of the surrendered and afflicted (Devi Mahatmyam)","summary":"The invincible warrior goddess born of the combined radiance of all Devas to vanquish Mahishasura.","content":"\n      <h3>The Crisis of Mahishasura's Boon</h3>\n      <p>The buffalo-titan Mahishasura performed severe austerities and secured a boon from Brahma: no man, god, or beast could slay him. Blinded by pride, he conquered the heavens, humiliated the Devas, and disrupted the cosmic sacrifice. Bound by the letter of the boon, no male deity could defeat him.</p>\n\n      <h3>The Confluence of Divine Light</h3>\n      <p>In response, the combined wrath, radiance, and virtues of Brahma, Vishnu, Shiva, and all the gods coalesced into a single blinding light that manifested as Goddess Durga. Possessing eighteen radiant arms, she was gifted divine astras: Shiva's trident, Vishnu's discus, Varuna's conch, and Agni's dart. Mounted upon a ferocious lion, she waged a nine-night war against Mahishasura's shapeshifting armies, culminating in her pinning the demon underfoot and piercing his chest with the Trishula.</p>\n\n      <h3>Outcome & Universal Celebration</h3>\n      <p>The slaying of Mahishasura restored cosmic sovereignty to the Devas and established the eternal victory of righteous courage over tyrannical ego. Celebrated across Bharat as Navaratri and Vijayadashami, Durga remains the ultimate refuge for those seeking inner courage to overcome negative tendencies (kama, krodha, mada, matsarya).</p>\n    ","childrenIds":[],"title_hi":"माँ दुर्गा (महिषासुरमर्दिनी)","epoch_hi":"ब्रह्माण्डीय धर्म-रक्षा काल","summary_hi":"समस्त देवताओं के सम्मिलित तेज से प्रकट अजेय महादेवी, जिन्होंने अत्याचारी महिषासुर का संहार किया।","quote_hi":"शरणागत दीनार्त परित्राण परायणे — शरणागत, दीन और पीड़ितों की रक्षा में तत्पर रहने वाली देवी को नमस्कार (देवी माहात्म्यम्)","content_hi":"\n      <h3>अवतरण का कारण: महिषासुर का अजेय वरदान</h3>\n      <p>महिषासुर ने कठोर तपस्या करके ब्रह्मा जी से वरदान प्राप्त किया कि किसी भी देव, दानव या पुरुष के हाथों उसका वध न हो सके। अहंकार में चूर होकर उसने स्वर्ग पर अधिकार कर लिया और देवताओं को निष्कासित कर दिया। वरदान की मर्यादा के कारण कोई भी पुरुष शक्ति उसे परास्त नहीं कर सकती थी।</p>\n\n      <h3>दैवीय प्राकट्य एवं महासमर</h3>\n      <p>देवताओं की रक्षा हेतु त्रिदेवों और समस्त देवगणों का तेज एक पुंज में समाहित हुआ, जिससे अष्टभुजा माँ दुर्गा का प्राकट्य हुआ। भगवान शिव ने उन्हें त्रिशूल, विष्णु जी ने सुदर्शन चक्र, इन्द्र ने वज्र और हिमालय ने सिंह भेंट किया। माँ दुर्गा ने नौ दिनों तक महिषासुर की मायावी सेना का संहार किया और अंततः त्रिशूल से महिषासुर के हृदय को भेदकर उसका अंत कर दिया।</p>\n\n      <h3>परिणाम एवं शाश्वत संदेश</h3>\n      <p>महिषासुर के वध से स्वर्ग का राज्य पुनः धर्मनिष्ठ देवताओं को मिला और ब्रह्माण्ड में शांति स्थापित हुई। यह विजय प्रतिवर्ष 'नवरात्रि' और 'विजयादशमी' के रूप में मनाई जाती है। माँ दुर्गा का यह आख्यान सिखाता है कि अहंकार कितना भी अजेय प्रतीत हो, एकाग्र दैवीय संकल्प और धर्म के सम्मुख उसका नाश निश्चित है।</p>\n    "},{"id":"kali","title":"Kali","sanskrit":"काली (कालशक्ति)","category":"divine","epoch":"Cosmic Dissolution & Transcendence","tier":2,"parentId":"shakti","x":-180,"y":20,"z":160,"symbol3D":"mandala","image":"assets/images/kali.jpg","quote":"Kala-svarupini — Embodiment of All-Devouring Time","summary":"The fierce goddess of time, cosmic dissolution, ego-annihilation, and liberation beyond fear.","content":"\n      <h3>The Invocation: Blood of Raktabija</h3>\n      <p>During the celestial war against the demons Shumbha and Nishumbha, the Devas faced Raktabija, whose drops of spilt blood produced thousands of duplicate demons. Conventional weaponry only multiplied the enemy, threatening universal annihilation through an infinite demonic swarm.</p>\n\n      <h3>The Fierce Cosmic Dance</h3>\n      <p>From the furrow of Goddess Ambika's brow emerged Kali — dark as the primordial night, eyes flashing cosmic fire, wielding a scimitar and wearing a garland of severed heads. She swallowed Raktabija's blood before it could touch the earth, devouring his duplicates in a storm of transcendental fury. Consumed by the ecstasy of total destruction, she danced until Shiva lay beneath her feet; upon feeling her consort's chest, she bit her tongue in sudden awareness, transforming wrath into protective maternal grace.</p>\n\n      <h3>Outcome & Deeper Spiritual Meaning</h3>\n      <p>Kali annihilates not merely physical demons, but the root cause of suffering: egoism (Ahamkara), worldly attachments, and the fear of death. Her dark hue represents the unmanifest void into which all created things ultimately dissolve, reminding the spiritual seeker that true liberation lies in surrendering fear and realizing immortality beyond physical form.</p>\n    ","childrenIds":[],"title_hi":"माँ काली (कालशक्ति)","epoch_hi":"महाविनाश एवं मोक्ष-प्रदायिनी","summary_hi":"काल का अतिक्रमण करने वाली, अहंकार का विनाशक और भयमुक्त मुक्ति प्रदान करने वाली परम उग्र माता।","quote_hi":"कालस्वरूपिणी — सर्वग्रासी काल और परम स्वतंत्रता का साक्षात् स्वरूप","content_hi":"\n      <h3>प्राकट्य का कारण: रक्तबीज का आतंक</h3>\n      <p>शुम्भ-निशुम्भ के सेनापति रक्तबीज को यह वरदान था कि उसके रक्त की एक बूँद धरती पर गिरते ही उसी के समान सहस्रों दैत्य उत्पन्न हो जाएंगे। इस कारण देवताओं के समस्त अस्त्र व्यर्थ हो रहे थे और सम्पूर्ण ब्रह्माण्ड में असुरों की बाढ़ आ गई थी।</p>\n\n      <h3>महाविनाशकारी लीला एवं संहार</h3>\n      <p>माँ दुर्गा के क्रोध से उनके भृकुटि-मध्य से माँ काली का प्राकट्य हुआ — घोर अंधकार के समान कृष्ण वर्ण, मुण्डमाला धारिणी, लाल जिह्वा और हाथ में खड्ग लिए। उन्होंने रक्तबीज का वध करते हुए उसके रक्त की एक भी बूँद धरती पर गिरने नहीं दी और स्वयं उसका पान कर लिया। उनके रौद्र नृत्य से पृथ्वी काँपने लगी, तब महादेव स्वयं उनके चरणों के नीचे लेट गए। शिव का स्पर्श होते ही माँ काली का क्रोध शांत हुआ।</p>\n\n      <h3>आध्यात्मिक मर्म एवं फल</h3>\n      <p>माँ काली का यह रूप मनुष्य के अहंकार और भय के पूर्ण संहार का प्रतीक है। उनकी मुण्डमाला वर्णमाला के पचास अक्षरों तथा मनुष्य के अहम् का विनाश दर्शाती है। वे साधक को सिखाती हैं कि सत्य तक पहुँचने के लिए सांसारिक मोह और मृत्यु के भय को त्यागना ही एकमात्र मार्ग है।</p>\n    "},{"id":"parvati","title":"Parvati","sanskrit":"पार्वती (उमा / शैलपुत्री)","category":"divine","epoch":"Devotion & Spiritual Tapas","tier":2,"parentId":"shakti","x":-100,"y":20,"z":160,"symbol3D":"lotus","image":"assets/images/parvati.jpg","quote":"Tapasvinam parama shreshtha — The supreme practitioner of yogic tapas","summary":"Daughter of Mount Himavat, the embodiment of yogic penance, marital devotion, and consort of Shiva.","content":"\n      <h3>The Cosmic Separation & The Demon Tāraka</h3>\n      <p>Following the self-immolation of Sati at Daksha's sacrifice, Shiva retreated into impenetrable samadhi atop Mount Kailasa, severing all engagement with the universe. Meanwhile, the demon Tarakasura gained a boon that only a son born of Shiva could vanquish him, leaving heaven defenseless.</p>\n\n      <h3>Unwavering Yogic Tapasya</h3>\n      <p>Sati was reborn as Parvati, daughter of King Himavat and Mena. Rebuffing Kama's superficial arrow of desire (which Shiva reduced to ashes), Parvati resolved to win Mahadeva through pure spiritual tapas. Discarding royal robes, she meditated in freezing Himalayan blizzards, surviving first on fallen leaves (earning the name <em>Aparṇā</em>), and finally on air alone across millennia, melting Shiva's ascetic detachment through genuine spiritual equivalence.</p>\n\n      <h3>Outcome: Sacred Union & Universal Harmony</h3>\n      <p>Shiva accepted Parvati as his eternal equal half, manifesting as <strong>Ardhanārīśvara</strong> (half-man, half-woman). Their union produced Kartikeya and Ganesha, saving the cosmos from Tarakasura and demonstrating that spiritual discipline (Tapas) can harmonize the deepest ascetic solitude with fruitful worldly engagement.</p>\n    ","childrenIds":["shiva"],"title_hi":"माता पार्वती (उमा / शैलपुत्री)","epoch_hi":"तपस्या, निष्ठा एवं पावन परिणय","summary_hi":"हिमालय राज की कन्या, जिन्होंने अपनी कठोर तपस्या से महादेव शिव की समाधि को पिघलाकर गृहस्थ धर्म की स्थापना की।","quote_hi":"तपस्विनां परमां श्रेष्ठाम् — तपस्वियों में सर्वोपरि, निष्काम साधना की साक्षात् प्रतिमूर्ति","content_hi":"\n      <h3>पृष्ठभूमि: सती विरह एवं तारकासुर का उत्पात</h3>\n      <p>दक्ष प्रजापति के यज्ञ में माता सती के आत्मदाह के उपरांत भगवान शिव घोर वैराग्य में लीन होकर कैलास पर समाधिस्थ हो गए। इधर तारकासुर ने ब्रह्मा जी से वरदान पा लिया कि केवल शिव-पुत्र ही उसका वध कर सकेगा। देवता असहाय हो गए क्योंकि शिव जी का ध्यान भंग करना असंभव था।</p>\n\n      <h3>अद्वितीय तपस्या एवं शिव-साधना</h3>\n      <p>माता सती ने गिरिराज हिमवान के घर पार्वती के रूप में जन्म लिया। कामदेव के बाणों के भस्म होने के बाद, उन्होंने जान लिया कि महादेव को केवल रूप से नहीं अपितु विशुद्ध तप से ही प्राप्त किया जा सकता है। उन्होंने सहस्रों वर्षों तक शीत, वर्षा और धूप में कठोर तप किया। सूखे पत्ते तक खाना छोड़ दिया, जिससे वे 'अपर्णा' कहलाईं। उनकी निष्काम भक्ति से महादेव की समाधि खुली।</p>\n\n      <h3>परिणाम एवं शाश्वत शिक्षा</h3>\n      <p>भगवान शिव ने पार्वती जी को अपनी अर्धांगिनी स्वीकार किया और 'अर्धनारीश्वर' स्वरूप प्रकट हुआ। इस पावन विवाह से कार्तिकेय और गणेश का जन्म हुआ और तारकासुर का अंत हुआ। माता पार्वती का जीवन सिखाता है कि दृढ़ संकल्प, त्याग और निष्काम प्रेम से ईश्वर को भी प्राप्त किया जा सकता है।</p>\n    "},{"id":"shiva","title":"Shiva","sanskrit":"शिव (महादेव / नटराज)","category":"divine","epoch":"Asceticism & Cosmic Regeneration","tier":3,"parentId":"parvati","x":-100,"y":-40,"z":240,"symbol3D":"mandala","image":"assets/images/shiva.jpg","quote":"Kailasashikharavasi deva devanam uttamaha — Dweller of Mount Kailasa, highest among the gods","summary":"The Great Ascetic, Lord of Dance (Nataraja), master of yoga, and dissolver of the universe.","content":"\n      <h3>The Silent Witness & The Cosmic Poison</h3>\n      <p>Shiva is not merely a destroyer; he is the regenerative silence from which all vibration emerges and into which it dissolves. When the churning of the Ocean of Milk (Samudra Manthan) released the virulent Halahala poison threatening to incinerate all realms, neither Devas nor Asuras had the capacity to endure it.</p>\n\n      <h3>The Supreme Sacrifice: Nilakantha & Nataraja</h3>\n      <p>Moved by compassion for creation, Shiva scooped the deadly poison into his palm and swallowed it. Goddess Parvati held his throat to prevent it from descending into the universe within his stomach, turning his neck dark sapphire (<em>Nīlakaṇṭha</em>). As Nataraja, Lord of Dance, his Ananda Tandava maintains the perpetual pulse of creation, preservation, destruction, illusion, and grace.</p>\n\n      <h3>Outcome: Deliverance and Inner Stillness</h3>\n      <p>Shiva's selfless act saved the universe, showing that true greatness lies in bearing the suffering of others for the collective good. Dwelling on Mount Kailasa clad in tiger skin, he embodies supreme detachment, teaching humanity that stillness of mind (Samadhi) is the ultimate fortress against worldly turmoil.</p>\n    ","childrenIds":["ganesha","kartikeya"],"title_hi":"देवाधिदेव महादेव (शिव / नटराज)","epoch_hi":"वैराग्य, विषपान एवं ताण्डव नृत्य","summary_hi":"कैलास निवासी, महायोगी, कालों के काल महाकाल, जिन्होंने सृष्टि की रक्षा हेतु हलाहल विष का पान किया।","quote_hi":"कैलासशिखरवासी देव देवानामुत्तमः — कैलास शिखर के वासी, समस्त देवों में श्रेष्ठ एवं कल्याणकारी","content_hi":"\n      <h3>कारण: हलाहल विष का संकट</h3>\n      <p>भगवान शिव केवल संहारक नहीं, अपितु कल्याण (शिव) के साक्षात् विग्रह हैं। समुद्र मंथन के समय जब कालकूट (हलाहल) विष प्रकट हुआ, जिसकी ज्वाला से तीनों लोक भस्म होने लगे, तब सभी देवता और दैत्य त्राहि-त्राहि करते हुए महादेव की शरण में पहुँचे।</p>\n\n      <h3>दैवीय कार्य: विषपान एवं नीलकंठ रूप</h3>\n      <p>सृष्टि के कल्याण हेतु भगवान शिव ने उस महाविष को अपनी हथेली में लेकर पी लिया। माता पार्वती ने उनके गले को दबाकर विष को पेट में जाने से रोका, जिससे उनका कंठ नीला पड़ गया और वे 'नीलकंठ' कहलाए। नटराज रूप में उनका आनंद ताण्डव ब्रह्माण्ड की पांच क्रियाओं — सृष्टि, स्थिति, संहार, तिरोभाव और अनुग्रह का संचालन करता है।</p>\n\n      <h3>परिणाम एवं अमर उपदेश</h3>\n      <p>शिव जी के त्याग से सम्पूर्ण चराचर जगत की रक्षा हुई। कैलास पर्वत पर भस्म रमाए बैठे महादेव यह संदेश देते हैं कि संसार के विष (कष्ट और अपमान) को स्वयं में धारण कर दूसरों को अमृत प्रदान करना ही देवत्व की पराकाष्ठा है।</p>\n    "},{"id":"ganesha","title":"Ganesha","sanskrit":"गणेश (विनायक)","category":"divine","epoch":"Wisdom & New Beginnings","tier":4,"parentId":"shiva","x":-140,"y":-100,"z":320,"symbol3D":"lotus","image":"assets/images/ganesha_kartikeya.jpg","quote":"Vakratunda mahakaya suryakoti samaprabha — O curved trunk and immense body, radiant as millions of suns","summary":"The elephant-headed lord of intellect, wisdom, scribe of the Mahabharata, and remover of obstacles.","content":"\n      <h3>The Creation & The Threshold Test</h3>\n      <p>Goddess Parvati created Ganesha from the turmeric paste of her own body, breathing life into him to guard her private quarters. When Shiva returned and sought entry, the loyal child barred his path, honoring his mother's command even unto death against the Lord of Yoga himself, whereupon Shiva severed his head in wrath.</p>\n\n      <h3>The Elephant Head & Divine Restitution</h3>\n      <p>Witnessing Parvati's cosmic grief, Shiva dispatched his Ganas to find the head of the first living being sleeping facing north. An elephant (Airavata's lineage) surrendered its head, symbolizing supreme wisdom, large ears to listen, and a small mouth to speak thoughtfully. Shiva proclaimed him <strong>Gaṇādhipati</strong> (Lord of Celestial Hosts) and <strong>Prathama Pūjya</strong> (worshipped before all other deities in any ritual).</p>\n\n      <h3>Outcome: Scribe of the Mahabharata & Obstacle Remover</h3>\n      <p>When sage Vyasa sought a scribe for the 100,000 verses of the Mahabharata, Ganesha agreed on condition that Vyasa dictate without pausing. When his quill broke, Ganesha snapped off his own tusk (<em>Ekadanta</em>) to write without interruption. He stands as the remover of all obstacles (Vighnahartā), grounding human intellect in devotion and perseverance.</p>\n    ","childrenIds":[],"title_hi":"भगवान श्रीगणेश (प्रथम पूज्य)","epoch_hi":"विघ्नहर्ता एवं बुद्धिदाता","summary_hi":"माता पार्वती के अंश से प्रकट, बुद्धि और विवेक के अधिष्ठाता, महाभारत के दिव्य लेखक और विघ्नविनाशक।","quote_hi":"वक्रतुण्ड महाकाय सूर्यकोटि समप्रभ — वक्र सूंड, विशाल देह और करोड़ों सूर्यों के समान तेजस्वी प्रभु","content_hi":"\n      <h3>पृष्ठभूमि: निष्ठा एवं परीक्षा</h3>\n      <p>माता पार्वती ने अपने उबटन से एक बालक की मूर्ति बनाकर उसमें प्राण फूँके और उसे अपना द्वारपाल नियुक्त किया। जब महादेव कैलास लौटे, तो मातृ-आज्ञा का पालन करते हुए उस बालक ने शिव जी को भीतर जाने से रोक दिया। क्रोधवश महादेव ने त्रिशूल से बालक का मस्तक काट दिया।</p>\n\n      <h3>गजानन रूप एवं प्रथम पूज्य का वरदान</h3>\n      <p>माता पार्वती के विलाप और रौद्र रूप को शांत करने के लिए शिव जी ने उत्तर दिशा में सिर करके सो रहे गज (हाथी) का सिर लाकर बालक के धड़ से जोड़ दिया और उसे पुनः जीवित किया। शिव जी ने उसे अपने समस्त गणों का स्वामी (गणेश) बनाया और वरदान दिया कि किसी भी शुभ कार्य में सर्वप्रथम श्रीगणेश की ही पूजा होगी।</p>\n\n      <h3>परिणाम एवं महाभारत लेखन</h3>\n      <p>महर्षि वेदव्यास ने जब महाभारत के एक लाख श्लोकों को लिपिबद्ध करने के लिए लेखक की खोज की, तो गणेश जी ने बिना रुके लिखने का उत्तरदायित्व लिया। कलम टूट जाने पर उन्होंने अपना एक दंत तोड़कर लेखन जारी रखा। श्रीगणेश बुद्धि, विवेक, विद्या और समस्त बाधाओं को दूर करने वाले विघ्नहर्ता के रूप में पूजे जाते हैं।</p>\n    "},{"id":"kartikeya","title":"Kartikeya","sanskrit":"कार्तिकेय (स्कन्द / सुब्रह्मण्य)","category":"divine","epoch":"Celestial Victory","tier":4,"parentId":"shiva","x":-60,"y":-100,"z":320,"symbol3D":"mandala","image":"assets/images/kartikeya.jpg","quote":"Devasena-pati — Supreme Commander of the Celestial Host","summary":"Born from the six sparks of Shiva's third eye, commander of the Deva armies, vanquisher of Tarakasura.","content":"\n      <h3>The Menace of Tarakasura</h3>\n      <p>Tarakasura's reign of terror had driven the Devas from heaven. Brahma's boon stipulated that only a son of Shiva could slay him, but the child needed to be of extraordinary celestial potency to command the celestial armies.</p>\n\n      <h3>Birth from Shiva's Third Eye</h3>\n      <p>Six fiery sparks emitted from Shiva's third eye were carried by Agni and Ganga into the Saravana reed forest, where six babies formed. They were nursed by the six Krittikas (Pleiades). Goddess Parvati embraced them into a single child with six heads (<em>Ṣaṇmukha</em>) and twelve arms, endowing him with universal wisdom. She gifted him the invincible golden spear — the <strong>Vel</strong>.</p>\n\n      <h3>Outcome: Victory at Tiruchendur & Eternal Protection</h3>\n      <p>Appointed supreme commander of the Devas, Kartikeya led the celestial hosts to defeat Tarakasura, Simhamukha, and Surapadman. Surapadman surrendered and was transformed into Kartikeya's mount (peacock) and banner (rooster). Kartikeya represents the destruction of lower animalistic ego through sharp intellectual and spiritual discrimination.</p>\n    ","childrenIds":[],"title_hi":"भगवान कार्तिकेय (स्कन्द / मुरुगन)","epoch_hi":"देवसेनापति एवं असुर संहार","summary_hi":"भगवान शिव के तीसरे नेत्र के तेज से उत्पन्न, देवसेना के सेनापति, जिन्होंने तारकासुर और शूरपद्मन का वध किया।","quote_hi":"देवसेना-पति — देवों की सेना के अजेय सेनापति एवं ज्ञान-शौर्य के प्रतीक","content_hi":"\n      <h3>कारण: तारकासुर के अत्याचार से मुक्ति</h3>\n      <p>तारकासुर के अत्याचारों से तीनों लोक पीड़ित थे। देवताओं को स्वर्ग से निष्कासित कर दिया गया था। उसे केवल शिव-पुत्र ही मार सकता था, अतः देवसेना को एक ऐसे दिव्य सेनापति की आवश्यकता थी जो अजेय और परम पराक्रमी हो।</p>\n\n      <h3>अग्निशिखा से जन्म एवं षडानन रूप</h3>\n      <p>महादेव के तीसरे नेत्र से निकले छह दिव्य तेज-कणों को अग्नि और गंगा ने शरवण वन में स्थापित किया, जहाँ छह सुंदर बालकों का प्राकट्य हुआ। छह कृत्तिकाओं ने उनका पालन किया। जब माता पार्वती ने उन छहों को प्रेम से गले लगाया, तो वे छह मुख और बारह भुजाओं वाले एक तेजस्वी बालक (षडानन) बन गए। माता ने उन्हें अमोघ शक्ति-शूल (वेल) प्रदान किया।</p>\n\n      <h3>परिणाम एवं आध्यात्मिक विजय</h3>\n      <p>कार्तिकेय ने देवसेना का नेतृत्व करते हुए तारकासुर और शूरपद्मन का संहार किया। शूरपद्मन पराजित होकर उनका वाहन मोर और ध्वज बन गया। भगवान मुरुगन/स्कन्द अज्ञान पर ज्ञान की विजय, निर्भयता और धर्म-युद्ध के शाश्वत प्रतीक हैं।</p>\n    "},{"id":"creation","title":"Creation","sanskrit":"सृष्टि एवं महत्-तत्त्व","category":"cosmos","epoch":"Cosmic Emergence","tier":1,"parentId":"brahman","x":180,"y":80,"z":80,"symbol3D":"chakra","image":"assets/images/creation.jpg","quote":"Nasadasinno sadasit tadanim — There was neither existence nor non-existence then (Rigveda 10.129)","summary":"The awakening of cosmic potential: Mahat-tattva, the five elements, time, space, and the sustainment of life.","content":"\n      <h3>The Primordial Emptiness</h3>\n      <p>Before manifestation, reality lay dormant in cosmic stillness (<em>Avyakta</em>). The Nasadiya Sukta of the Rigveda declares that there was neither death nor immortality, neither night nor day. Creation emerged not through sudden manufacturing, but through gradual cosmic evolution sparked by divine will.</p>\n\n      <h3>The Unfolding of Hiranyagarbha</h3>\n      <p>From the primal waters emerged <strong>Hiraṇyagarbha</strong> — the golden cosmic womb. As the sacred vibration OM resonated, Prakriti differentiated into Mahat (cosmic intelligence), Ahamkara (individuating ego), and the Tanmatras (subtle senses). These condensed into the five great elements (Pancha Mahabhutas): Ether, Air, Fire, Water, and Earth, forming the 14 cosmic spheres (Lokas).</p>\n\n      <h3>Outcome: The Order of Rita and Life</h3>\n      <p>Narayana permeated this cosmic matrix, establishing Rita (inviolable cosmic order) and Dharma (righteous duty). Creation is an ongoing organic cycle that maintains life until the dawn of Mahapralaya.</p>\n    ","childrenIds":["vishnu"],"title_hi":"सृष्टि का प्रादुर्भाव (हिरण्यगर्भ)","epoch_hi":"महत्-तत्त्व एवं पंचमहाभूत उत्पत्ति","summary_hi":"परब्रह्म के संकल्प से प्रस्फुटित स्वर्णमय अण्ड, जिससे आकाश, वायु, अग्नि, जल, पृथ्वी एवं समस्त लोकों का जन्म हुआ।","quote_hi":"नासदासीन्नो सदासीत्तदानीम् — उस समय न असत् था, न सत् था; केवल वही अद्वितीय तत्त्व स्पंदित था (ऋग्वेद १०.१२९)","content_hi":"\n      <h3>आदि-अवस्था: शून्य एवं संकल्प</h3>\n      <p>सृष्टि के आरंभ से पूर्व कोई आकार नहीं था। ऋग्वेद का 'नासदीय सूक्त' वर्णन करता है कि न सत्य था, न असत्य, न मृत्यु थी, न अमृत। सम्पूर्ण अस्तित्व अव्यक्त अवस्था में लीन था। तब परब्रह्म के संकल्प से ब्रह्माण्ड के सृजन की प्रथम तरंग उठी।</p>\n\n      <h3>हिरण्यगर्भ एवं पंचमहाभूतों का विस्तार</h3>\n      <p>कारण-सलिल में एक दैवीय ज्योतिर्मय स्वर्ण-अण्ड (हिरण्यगर्भ) प्रकट हुआ। ओंकार के महानाद से प्रकृति में गति आई। बुद्धि (महत्-तत्त्व), अहंकार, और पंच तन्मात्राओं से आकाश, वायु, अग्नि, जल और पृथ्वी — इन पंचमहाभूतों का निर्माण हुआ। इन्हीं से चौदह भुवनों और समस्त जीव-जगत का विस्तार हुआ।</p>\n\n      <h3>परिणाम एवं ऋत की स्थापना</h3>\n      <p>भगवान नारायण ने इस समस्त ब्रह्माण्ड में व्याप्त होकर 'ऋत' (प्राकृतिक एवं नैतिक नियम) की स्थापना की। यह सृष्टि ईश्वर की सजीव अभिव्यक्ति है, जहाँ प्रत्येक अणु में वही परमात्मा विद्यमान है।</p>\n    "},{"id":"vishnu","title":"Vishnu","sanskrit":"विष्णु (नारायण)","category":"divine","epoch":"Cosmic Preservation","tier":2,"parentId":"creation","x":180,"y":20,"z":160,"symbol3D":"chakra","image":"assets/images/vishnu.jpg","quote":"Dharmo rakshati rakshitaha — Dharma protects those who protect it (Manusmriti 8.15)","summary":"The all-pervading preserver and sustainer, resting on Shesha in Kshirasagara, descending as avataras.","content":"\n      <h3>The Catalyst: The Need for Preservation</h3>\n      <p>Creation without continuous preservation deteriorates rapidly into entropic decay and adharmic oppression. As the living cosmos unfolds, Vishnu assumes the central role of sustaining balance, nurturing living beings, and upholding the moral fabric of reality.</p>\n\n      <h3>Reclining in Kshirasagara & Sudarshana Chakra</h3>\n      <p>Vishnu reclines in divine contemplation (Yoganidra) upon the coils of the thousand-headed serpent Shesha in the ocean of milk. Holding the Panchajanya conch (cosmic vibration), Sudarshana Chakra (wheel of righteous time), Kaumodaki mace (primordial power), and Padma (purity of consciousness), he enters the stream of human history whenever virtue declines.</p>\n\n      <h3>Outcome: The Vow of Avataras</h3>\n      <p>Through his sacred promise in the Bhagavad Gita (<em>Yadā yadā hi dharmasya</em>), Vishnu repeatedly descends as avatars to protect the virtuous, destroy corrupting tyrants, and realign humanity with eternal dharma.</p>\n    ","childrenIds":["shesha","brahma","lakshmi"],"title_hi":"भगवान श्रीविष्णु (नारायण)","epoch_hi":"ब्रह्माण्डीय पालन एवं संरक्षण","summary_hi":"क्षीरसागर में शेषशय्या पर विराजमान, शंख-चक्र-गदा-पद्मधारी, धर्म की रक्षा हेतु युग-युग में अवतार लेने वाले परम संरक्षक।","quote_hi":"धर्मो रक्षति रक्षितः — जो धर्म की रक्षा करता है, धर्म उसकी रक्षा करता है (मनुस्मृति ८.१५)","content_hi":"\n      <h3>कारण: सृष्टि के पालन एवं संतुलन की आवश्यकता</h3>\n      <p>सृष्टि के सृजन के उपरांत उसे अधर्म, अराजकता और विनाश से बचाना अनिवार्य था। भगवान विष्णु ने सम्पूर्ण ब्रह्माण्ड के पालनहार (स्थिति-कर्ता) का दायित्व संभाला ताकि धर्म का संतुलन सदा बना रहे।</p>\n\n      <h3>स्वरूप एवं क्षीरसागर में शयन</h3>\n      <p>भगवान नारायण क्षीरसागर में शेषनाग की शय्या पर योगनिद्रा में स्थित हैं। उनके चार हाथों में शंख (पवित्र नाद), सुदर्शन चक्र (कालचक्र), कौमोदकी गदा (धर्म का बल) और पद्म (पवित्रता) सुशोभित हैं। माता लक्ष्मी उनके चरण दबाकर सेवा में रत रहती हैं।</p>\n\n      <h3>परिणाम एवं अवतार का संकल्प</h3>\n      <p>भगवान विष्णु ने प्रतिज्ञा की है कि जब-जब धर्म की हानि और अधर्म का उत्थान होगा, तब-तब वे साधुओं की रक्षा और दुष्टों के संहार के लिए युग-युग में अवतार ग्रहण करेंगे।</p>\n    "},{"id":"shesha","title":"Shesha","sanskrit":"अनन्त शेष (आदिशेष)","category":"divine","epoch":"Timeless Eternity","tier":3,"parentId":"vishnu","x":100,"y":-40,"z":240,"symbol3D":"mandala","image":"assets/images/shesha.jpg","quote":"Ananto asmi naganam — Among the nagas, I am Ananta (Bhagavad Gita 10.29)","summary":"The eternal thousand-headed serpent supporting the planets on his hoods and singing praises of Narayana.","content":"\n      <h3>The Eternal Remainder</h3>\n      <p>When cyclic dissolution (Pralaya) annihilates the created universes, one entity remains unharmed and intact — Adishesha, the Primordial Remainder. Representing the continuous coil of endless time (Ananta), he provides the foundation upon which cosmic consciousness rests during universal night.</p>\n\n      <h3>Supporting the Cosmos</h3>\n      <p>With thousands of jewel-adorned hoods emitting golden celestial light, Shesha stabilizes the planetary spheres upon his crowns. Whenever Vishnu incarnates on earth to re-establish Dharma, Shesha descends as his eternal fraternal companion: as Lakshmana to Rama in Treta Yuga, and as Balarama to Krishna in Dvapara Yuga.</p>\n\n      <h3>Spiritual Outcome & Protection</h3>\n      <p>Shesha teaches unwavering devotion (Seva) and psychological stability. Amidst worldly chaos and upheaval, meditating on the unshakeable coils of Shesha grants deep inner balance and freedom from the venom of existential fear.</p>\n    ","childrenIds":[],"title_hi":"अनन्त शेष (आदिशेष)","epoch_hi":"कालातीत शाश्वत सत्ता","summary_hi":"भगवान विष्णु के अनन्त नाग स्वरूप, जिनके फनों पर ब्रह्माण्ड के लोक टिके हैं और जो प्रलय में भी शेष रहते हैं।","quote_hi":"अनन्तोऽस्मि नागानाम् — नागों में मैं अनन्त शेष हूँ (भगवद्गीता १०.२९)","content_hi":"\n      <h3>शाश्वत आधार एवं प्रलय-शेष</h3>\n      <p>जब महाप्रलय में समस्त सृष्टि जलमग्न और नष्ट हो जाती है, तब जो शेष (बच) रहता है, वही 'शेषनाग' है। वे अनंत काल और निश्चल धैर्य के साक्षात् विग्रह हैं। उन पर ही भगवान नारायण अपनी योगनिद्रा का विस्तार करते हैं।</p>\n\n      <h3>सहस्रफन एवं पृथ्वी-धारण</h3>\n      <p>शेषनाग के सहस्रों फनों पर मणियाँ चमकती हैं और उनके फन पर सम्पूर्ण पृथ्वी स्थिर है। जब-जब भगवान विष्णु धर्म-रक्षा के लिए अवतार लेते हैं, तब-तब शेषनाग भी उनके अनुज अथवा अग्रज बनकर अवतरित होते हैं — त्रेता में लक्ष्मण और द्वापर में बलराम बनकर उन्होंने प्रभु की सेवा की।</p>\n\n      <h3>आध्यात्मिक संदेश एवं फल</h3>\n      <p>शेषनाग निष्काम सेवा, अचूक निष्ठा और स्थिरता के आदर्श हैं। उनका स्मरण संसार के भय और अशान्ति से मुक्ति दिलाकर मन को परमात्मा के चरणों में स्थिर करता है।</p>\n    "},{"id":"brahma","title":"Brahma","sanskrit":"ब्रह्मा (चतुर्मुख)","category":"divine","epoch":"Universal Genesis","tier":3,"parentId":"vishnu","x":180,"y":-40,"z":240,"symbol3D":"lotus","image":"assets/images/brahma_creation.jpg","quote":"Brahmane namah — Salutations to the author of all forms","summary":"The four-headed creator, born from the golden lotus blossoming from Vishnu's navel, author of the material universe.","content":"\n      <h3>The Cosmic Command to Manifest</h3>\n      <p>Following the emergence of unmanifest potential, a conscious architect was required to translate primordial sound (Nada) into billions of tangible physical forms, natural laws, and organic bodies. From the golden lotus arising from Vishnu's navel, Brahma emerged into existence.</p>\n\n      <h3>The Four Faces and the Vedas</h3>\n      <p>Confronted by the cosmic void, Brahma engaged in profound tapas across celestial millennia, hearing the sacred vibration <em>TAPAS</em> echoing in the deep. From his four faces he proclaimed the four Vedas in all directions, mentally projecting the Prajapatis, the laws of gravity and karma, and all species of life across the 14 Lokas.</p>\n\n      <h3>Outcome: The Cyclic Architect</h3>\n      <p>Because physical creation is an ongoing cyclic maintenance rather than an object of personal vanity, Brahma's worship is rare (such as at Pushkar), reminding humanity that creation is merely the outward vessel, while the inner spirit belongs to the Supreme Source.</p>\n    ","childrenIds":["prajapatis"],"title_hi":"भगवान ब्रह्मा (चतुर्मुख प्रजापति)","epoch_hi":"सकल ब्रह्माण्ड का सृजन","summary_hi":"भगवान विष्णु की नाभि-कमल से प्रकट, चार मुखों से चारों वेदों का उच्चारण करने वाले भौतिक सृष्टि के रचयिता।","quote_hi":"ब्रह्मणे नमः — समस्त नाम और रूपों के रचयिता आदि-विधाता को नमस्कार","content_hi":"\n      <h3>सृजन का संकल्प एवं नाभि-कमल</h3>\n      <p>जब कारण-जल में भगवान विष्णु शयन कर रहे थे, तब उनके नाभि-कमल से आदि-सृष्टिकर्ता ब्रह्मा जी का प्राकट्य हुआ। उन्हें परमात्मा द्वारा समस्त नाम-रूप और भौतिक सृष्टि के विस्तार का कार्यभार सौंपा गया।</p>\n\n      <h3>चार मुख एवं चारों वेदों का प्रकटीकरण</h3>\n      <p>चारों दिशाओं को देखते हुए ब्रह्मा जी के चार मुख हुए, जिनसे ऋग्वेद, यजुर्वेद, सामवेद और अथर्ववेद का ज्ञान निःसृत हुआ। उन्होंने अपने मानस-संकल्प से मरीचि, अत्रि, अंगिरा, दक्ष आदि प्रजापतियों को उत्पन्न किया, जिन्होंने समस्त जीव-जगत को जन्म दिया।</p>\n\n      <h3>आध्यात्मिक मर्म</h3>\n      <p>ब्रह्मा जी की पूजा बहुत सीमित (जैसे पुष्कर तीर्थ में) होती है, जो यह सिखाती है कि रूप और आवरण का सृजन आवश्यक तो है, किंतु सत्य उस आत्मा में है जो इन समस्त रूपों से परे है।</p>\n    "},{"id":"lakshmi","title":"Lakshmi","sanskrit":"लक्ष्मी (कमला / श्री)","category":"divine","epoch":"Sovereign Grace & Prosperity","tier":3,"parentId":"vishnu","x":260,"y":-40,"z":240,"symbol3D":"lotus","image":"assets/images/lakshmi.jpg","quote":"Maha-Lakshmyai cha vidmahe — Meditations upon the Goddess of Divine Auspiciousness","summary":"The goddess of spiritual and material abundance, fortune, auspiciousness, emerging from the Ocean of Milk.","content":"\n      <h3>The Catalyst: Loss of Cosmic Grace</h3>\n      <p>When sage Durvasa's curse stripped the three worlds of beauty, fortune, and nobility, the Devas lost their splendor (<em>Nir-śrīka</em>), and the cosmos plunged into poverty and stagnation. The churning of the ocean was undertaken to restore cosmic prosperity.</p>\n\n      <h3>Emergence from the Ocean of Milk</h3>\n      <p>From the churned ocean arose Lakshmi seated upon a radiant full-bloomed lotus, welcomed by the celestial elephants showering holy waters (Gaja-Lakshmi). Bypassing arrogant kings and powerful titans, she gazed with unconditional love upon Lord Vishnu and placed the victory garland around his neck as his eternal consort.</p>\n\n      <h3>Outcome: The True Meaning of Wealth</h3>\n      <p>Lakshmi represents not superficial greed, but <em>Dharma-sampad</em> — virtuous wealth that supports righteous society, generosity, aesthetic grace, and spiritual nobility. Wherever truth, cleanliness, and harmony abide, Mahalakshmi grants permanent auspiciousness.</p>\n    ","childrenIds":[],"title_hi":"माँ महालक्ष्मी (कमला / श्री)","epoch_hi":"वैभव, अनुग्रह एवं पावन संपदा","summary_hi":"समुद्र मंथन से कमल पर प्रकट, धन, ऐश्वर्य, सौंदर्य और मोक्ष की अधिष्ठात्री देवी, भगवान विष्णु की अर्धांगिनी।","quote_hi":"महामुख्यै च विद्महे — दिव्य मंगल, कृपा और ऐश्वर्य की अधिष्ठात्री महालक्ष्मी का ध्यान करते हैं","content_hi":"\n      <h3>कारण: श्रीहीनता का संकट</h3>\n      <p>दुर्वासा ऋषि के शाप से जब तीनों लोकों की 'श्री' (शोभा, वैभव और तेज) लुप्त हो गई, तब देवता दरिद्र और कांतिहीन हो गए। इस श्री की पुनः प्राप्ति के लिए देवताओं और असुरों ने क्षीरसागर का मंथन किया।</p>\n\n      <h3>कमलासन पर प्राकट्य एवं विष्णु-वरण</h3>\n      <p>मंथन के समय क्षीरसागर से माँ लक्ष्मी कमल के पुष्प पर आरूढ़ होकर प्रकट हुईं। दिशा-गजों ने स्वर्ण-कलशों से उनका अभिषेक किया। सभी देवों और असुरों को छोड़कर उन्होंने प्रभु नारायण के वक्षस्थल पर वरमाला डाल दी और उनकी नित्य अर्धांगिनी बनीं।</p>\n\n      <h3>परिणाम एवं यथार्थ वैभव</h3>\n      <p>माँ लक्ष्मी केवल धन की नहीं, अपितु सद्विचार, सत्य, दया, दान और धर्म की अधिष्ठात्री हैं। वे सिखाती हैं कि धर्मपूर्वक अर्जित और परोपकार में प्रयुक्त धन ही वास्तविक 'श्री' है।</p>\n    "},{"id":"prajapatis","title":"Prajapatis","sanskrit":"प्रजापतयः","category":"lineage","epoch":"Progenitors of Life","tier":4,"parentId":"brahma","x":180,"y":-100,"z":320,"symbol3D":"mandala","image":"assets/images/prajapatis.jpg","quote":"Prajaanaam patayah — Lords and guardians of created species","summary":"The mind-born sages (Manasaputras) commissioned by Brahma to populate and guide the living cosmos.","content":"\n      <h3>The Need for Progenitors</h3>\n      <p>To populate the newly formed cosmic spheres, Brahma required wise, spiritually luminous custodians capable of establishing societal codes, sacred sacrifices, and living genealogies across the fourteen realms.</p>\n\n      <h3>Mental Conception by Brahma</h3>\n      <p>Through focused meditation, Brahma brought forth the Prajapatis: Marichi, Atri, Angiras, Pulastya, Pulaha, Kratu, Bhrigu, Vashistha, and Daksha. These mind-born sages (Manasaputras) instituted the Vedic ceremonies, moral sciences, astronomy, and the hereditary lineages that sustained human culture.</p>\n\n      <h3>Outcome: Founding of Cosmic Civilization</h3>\n      <p>The Prajapatis laid the bedrock of civilization, marrying the daughters of Daksha and Manu to seed every family of gods, humans, animals, and subtle entities across the multiverse.</p>\n    ","childrenIds":["daksha"],"title_hi":"प्रजापतिगण (मानसपुत्र)","epoch_hi":"सृष्टि के आदि-जनक","summary_hi":"ब्रह्मा जी के मानस संकल्प से उत्पन्न नौ महर्षि, जिन्होंने ब्रह्माण्ड में जीव-जगत और धर्म-व्यवस्था का विस्तार किया।","quote_hi":"प्रजानां पतयः — समस्त प्रजा और प्राणियों के आदि संरक्षक एवं पथप्रदर्शक","content_hi":"\n      <h3>सृष्टि विस्तार की आवश्यकता</h3>\n      <p>ब्रह्माण्ड के निर्माण के पश्चात उसे धर्मपरायण संतानों से परिपूर्ण करने और ज्ञान-विज्ञान की परंपरा स्थापित करने के लिए ब्रह्मा जी को धर्मनिष्ठ पथप्रदर्शकों की आवश्यकता थी।</p>\n\n      <h3>मानस पुत्रों का जन्म</h3>\n      <p>ब्रह्मा जी के संकल्प से मरीचि, अत्रि, अंगिरा, पुलस्त्य, पुलह, क्रतु, भृगु, वशिष्ठ और दक्ष जैसे महर्षियों का जन्म हुआ। इन प्रजापतियों ने समाज-व्यवस्था, वेदाध्ययन, यज्ञ-अनुष्ठान और नैतिक नियमों की नींव रखी।</p>\n\n      <h3>परिणाम एवं सभ्यता का उदय</h3>\n      <p>प्रजापतियों की संततियों से ही देव, गंधर्व, यक्ष, मानव और समस्त प्राणी जगत का विस्तार हुआ, जिससे सम्पूर्ण ब्रह्माण्ड में जीवन की लीला प्रारंभ हुई।</p>\n    "},{"id":"daksha","title":"Daksha","sanskrit":"दक्ष प्रजापति","category":"lineage","epoch":"Patriarch of Creation","tier":5,"parentId":"prajapatis","x":180,"y":-160,"z":400,"symbol3D":"mandala","image":"assets/images/daksha.jpg","quote":"Daksha Yajna Vidhwamsa — The pivotal cosmic sacrifice and birth of Shakti Pithas","summary":"The chief patriarch of creation, father of Sati, whose grand yajna and arrogance sparked the descent of Virabhadra.","content":"\n      <h3>The Arrogance of Patriarchal Authority</h3>\n      <p>Appointed chief patriarch of creation, Daksha grew excessively attached to external ritualism and status, disdaining the ascetic, transcendent nature of Shiva, who had married his daughter Sati.</p>\n\n      <h3>The Brihaspatisava Yajna & Sati's Sacrifice</h3>\n      <p>Daksha organized a mammoth sacrifice (Yajna), deliberately excluding Shiva and Sati. Sati attended uninvited to counsel her father, but Daksha publicly insulted Mahadeva. Unable to bear the insult to the Supreme Consciousness, Sati surrendered her body to yogic fire. Enraged, Shiva tore a dreadlock and summoned the fierce warrior Virabhadra and Bhadrakali, who dismantled the sacrifice and severed Daksha's head.</p>\n\n      <h3>Outcome: The 51 Shakti Pithas & Humility</h3>\n      <p>Shiva restored Daksha to life with a goat's head, curing him of pride. As Shiva wandered the cosmos in grief with Sati's body, Vishnu's Sudarshana Chakra divided her limbs into 51 sacred pieces across Bharat, establishing the 51 Shakti Pithas — the sanctified pilgrimage geography of supreme mother devotion.</p>\n    ","childrenIds":["kashyapa"],"title_hi":"दक्ष प्रजापति (दक्ष यज्ञ विध्वंस)","epoch_hi":"अहंकार एवं शक्तिपीठों का उद्भव","summary_hi":"सृष्टि के प्रधान अधिपति, जिनके अहंकार से सती ने देहत्याग किया और शिव के गण वीरभद्र ने उनके महायज्ञ का विध्वंस किया।","quote_hi":"दक्षयज्ञ विध्वंसः — अहंकार का पतन और ५१ पवित्र शक्तिपीठों की स्थापना","content_hi":"\n      <h3>अहंकार एवं शिव-अपमान</h3>\n      <p>प्रजापतियों के अधिपति दक्ष को अपनी सत्ता और कर्मकाण्ड पर घोर अहंकार हो गया। वे भगवान शिव के वैराग्य और दिगम्बर स्वरूप का उपहास उड़ाते थे, जबकि शिव जी ने उनकी पुत्री सती से विवाह किया था।</p>\n\n      <h3>बृहस्पतिसव यज्ञ एवं सती का आत्मदाह</h3>\n      <p>दक्ष ने एक विशाल यज्ञ का आयोजन किया, जिसमें शिव-सती को छोड़कर सभी को आमंत्रित किया। पिता के घर जाने की हठ करके माता सती वहाँ पहुँचीं, जहाँ दक्ष ने भरे समाज में महादेव का अपमान किया। पति-अपमान से व्यथित होकर सती ने योगाग्नि में अपना शरीर भस्म कर दिया। यह सुनकर महादेव के तीसरे नेत्र से वीरभद्र प्रकट हुए, जिन्होंने यज्ञ का विध्वंस कर दक्ष का सिर धड़ से अलग कर दिया।</p>\n\n      <h3>परिणाम एवं ५१ शक्तिपीठों का प्राकट्य</h3>\n      <p>शिव जी ने दया कर दक्ष को बकरे का सिर लगाकर जीवित किया और उसका अहंकार नष्ट किया। सती के शव को लेकर जब शिव जी ताण्डव करने लगे, तब भगवान विष्णु ने सुदर्शन चक्र से सती के अंग काटे, जो भारतभूमि पर ५१ स्थानों पर गिरे और पवित्र 'शक्तिपीठ' कहलाए।</p>\n    "},{"id":"kashyapa","title":"Kashyapa","sanskrit":"कश्यप ऋषि","category":"lineage","epoch":"The Universal Father","tier":6,"parentId":"daksha","x":180,"y":-220,"z":480,"symbol3D":"mandala","image":"assets/images/kashyapa.jpg","quote":"Kashyapo hi prajanam janakah — Kashyapa is indeed the father of all entities","summary":"The primordial sage from whose thirteen wives the Devas, Daityas, Nagas, Danavas, birds, and animals descend.","content":"\n      <h3>Kinship of All Living Beings</h3>\n      <p>In Vedic thought, the diverse species of the multiverse are not alien or irreconcilable foes, but branches of a single ancestral tree. Sage Kashyapa, son of Marichi, served as the universal genetic and spiritual bridge for this cosmic family.</p>\n\n      <h3>The Thirteen Wives & Universal Progeny</h3>\n      <p>Kashyapa married thirteen daughters of Daksha. From Aditi came the luminous Devas; from Diti, the ambitious Daityas; from Danu, the Danavas; from Kadru, the serpents (Nagas); from Vinata, the celestial birds (Garuda, Aruna); from Surabhi, cows; and from Muni, the celestial Apsaras. He channeled Vedic mantras and spiritual genealogies that linked heaven to earth.</p>\n\n      <h3>Outcome: The Sacred Unity of Life</h3>\n      <p>Kashyapa's heritage emphasizes that all sentient life shares common sacred ancestry (<em>Vasudhaiva Kuṭumbakam</em>), providing the metaphysical basis for non-violence, environmental reverence, and mutual kinship across species.</p>\n    ","childrenIds":["aditi","diti","kadru"],"title_hi":"महर्षि कश्यप (सर्वजीवों के पिता)","epoch_hi":"समस्त जातियों के आदि-पूर्वज","summary_hi":"दक्ष की १३ कन्याओं के पति, जिनकी संतानों से देव, दैत्य, दानव, नाग, गरुड़ और समस्त जीव-जगत उत्पन्न हुआ।","quote_hi":"कश्यपो हि प्रजानां जनकः — महर्षि कश्यप निश्चय ही समस्त जातियों के आदि-पिता हैं","content_hi":"\n      <h3>सृष्टि की आदि-एकता</h3>\n      <p>सनातन दर्शन के अनुसार संसार के समस्त प्राणी एक ही आदि-स्रोत की शाखाएँ हैं। मरीचि-पुत्र महर्षि कश्यप ने इस सम्पूर्ण जीव-जगत के पूर्वज बनकर इस एकता को साकार किया।</p>\n\n      <h3>तेरह पत्नियाँ एवं संतति</h3>\n      <p>महर्षि कश्यप ने दक्ष की १३ पुत्रियों से विवाह किया: अदिति से १२ आदित्य और देवता; दिति से दैत्य; दनु से दानव; कद्रू से नाग; विनता से गरुड़ और अरुण; सुरभि से गौ-वंश आदि उत्पन्न हुए। उन्होंने घोर तप करके वेदों की ऋचाओं का साक्षात्कार किया।</p>\n\n      <h3>परिणाम एवं वसुधैव कुटुम्बकम्</h3>\n      <p>कश्यप जी की संतति का विस्तार यह सिद्ध करता है कि समस्त चर-अचर जीव एक ही पिता की संतान हैं। यही 'वसुधैव कुटुम्बकम्' और समस्त प्राणियों के प्रति करुणा का आध्यात्मिक आधार है।</p>\n    "},{"id":"aditi","title":"Aditi","sanskrit":"अदिति (देवमाता)","category":"lineage","epoch":"Cosmic Motherhood","tier":7,"parentId":"kashyapa","x":80,"y":-280,"z":560,"symbol3D":"lotus","image":"assets/images/aditi.jpg","quote":"Aditir dyaur aditir antariksham — Aditi is heaven, Aditi is space (Rigveda 1.89.10)","summary":"The boundless mother of the Devas and twelve Adityas, personifying cosmic luminosity and freedom.","content":"\n      <h3>The Embodiment of Boundless Space</h3>\n      <p>Aditi signifies the unconditioned, boundless expanse of pure light and cosmic harmony. As the maternal source of the celestial guardians of truth (Rita), she provided the womb through which divine justice entered space and time.</p>\n\n      <h3>Birth of the 12 Adityas and Vamana</h3>\n      <p>From Aditi were born the twelve Adityas, including Indra, Surya, Varuna, Mitra, Aryaman, and Bhaga, who govern the cosmic seasons and light. When the Asuras dethroned the Devas, Aditi performed the supreme <em>Payovrata</em> austerity, prompting Lord Vishnu to be born directly from her womb as the divine dwarf Brahmin, Vamana.</p>\n\n      <h3>Outcome: Victory of Luminous Consciousness</h3>\n      <p>Aditi stands as the ideal of patient spiritual motherhood, demonstrating that pure devotion can bring the Supreme Being directly into human and celestial manifestation to restore righteousness.</p>\n    ","childrenIds":["devas"],"title_hi":"माता अदिति (देवमाता)","epoch_hi":"अनन्त चेतना एवं देवों की माता","summary_hi":"कश्यप की पत्नी, बारह आदित्यों (इन्द्र, सूर्य, वामन आदि) की माता, जो असीम विस्तार और दिव्य तेज की प्रतीक हैं।","quote_hi":"अदितिर्द्यौरदितिरन्तरिक्षम् — अदिति ही द्युलोक हैं, अदिति ही अंतरिक्ष हैं (ऋग्वेद १.८९.१०)","content_hi":"\n      <h3>असीम चेतना की जननी</h3>\n      <p>अदिति का अर्थ है 'जिसका कभी खंडन न हो' — असीम, बंधनमुक्त और ज्योतिर्मय चेतना। वे धर्म, सत्य और न्याय की रक्षा करने वाले देवताओं की माता हैं।</p>\n\n      <h3>बारह आदित्यों एवं वामन का प्राकट्य</h3>\n      <p>माता अदिति के गर्भ से १२ आदित्य — इन्द्र, सूर्य, वरुण आदि का जन्म हुआ जो संसार को प्रकाश और वर्षा देते हैं। जब दैत्यों ने स्वर्ग छीन लिया, तो अदिति ने 'पयोव्रत' का अनुष्ठान किया, जिससे प्रसन्न होकर भगवान विष्णु ने स्वयं उनके गर्भ से 'वामन अवतार' लिया।</p>\n\n      <h3>परिणाम एवं फल</h3>\n      <p>माता अदिति का जीवन यह सिद्ध करता है कि निष्काम तप और मातृ-हृदय की सच्ची पुकार से साक्षात् परमात्मा भी पुत्र रूप में अवतरित होकर धर्म की रक्षा करते हैं।</p>\n    "},{"id":"devas","title":"Devas","sanskrit":"देवाः (अमराः)","category":"lineage","epoch":"Celestial Administration","tier":8,"parentId":"aditi","x":80,"y":-340,"z":640,"symbol3D":"chakra","image":"assets/images/devas.jpg","quote":"Deva amritam prapnuh — The shining ones who partook of the nectar of immortality","summary":"The thirty-three celestial deities administering the elements, nature, consciousness, and righteous cosmic order.","content":"\n      <h3>The Cosmic Administrative Hierarchy</h3>\n      <p>The universe requires continuous maintenance of natural laws: gravity, sunlight, rainfall, moral virtue, and life-supporting elements. The Devas (the Shining Ones) were appointed by the Supreme to administer these functions across Bhuloka and Svarloka.</p>\n\n      <h3>The 33 Sovereign Orders</h3>\n      <p>The Vedic pantheon classifies 33 primary celestial types (Koti): 12 Adityas (solar energies), 11 Rudras (vital transformation forces), 8 Vasus (elemental powers of fire, water, earth, wind, dawn, stars), and 2 Ashvins (divine physicians). Nourished by sacrificial offerings (Havis) through sacred fire (Agni), they return blessings as rainfall, vitality, and virtue.</p>\n\n      <h3>Outcome: The Symbiosis of Yajna</h3>\n      <p>The relationship between humanity and the Devas is mutual (as taught in the Gita: <em>Parasparam bhāvayantaḥ</em>). Honoring the forces of nature brings ecological and moral balance to human life.</p>\n    ","childrenIds":["indra","surya","varuna"],"title_hi":"तेतीस कोटि देवगण (अमर सत्ताएँ)","epoch_hi":"ब्रह्माण्डीय प्रशासन एवं प्राकृतिक व्यवस्था","summary_hi":"स्वर्गवासी तेतीस प्रमुख देवगण (१२ आदित्य, ११ रुद्र, ८ वसु, २ अश्विनीकुमार), जो ब्रह्माण्ड के पंचतत्त्वों और नियमों का संचालन करते हैं।","quote_hi":"देवा अमृतं प्राप्नुवन् — जिन्होंने समुद्र मंथन से अमृत प्राप्त कर अमरता और धर्म-व्यवस्था धारण की","content_hi":"\n      <h3>ब्रह्माण्ड की प्रशासनिक व्यवस्था</h3>\n      <p>ब्रह्माण्ड में ऋतुओं के चक्र, वर्षा, सूर्य-प्रकाश और नैतिक नियमों को बनाए रखने के लिए परमात्मा ने 'देवताओं' (प्रकाशमान सत्ताओं) को प्राकृतिक शक्तियों का अधिष्ठाता नियुक्त किया।</p>\n\n      <h3>तेतीस प्रकार (कोटि) के देव</h3>\n      <p>वेदों में ३३ प्रमुख प्रकार के देव बताए गए हैं: १२ आदित्य (सौर शक्तियाँ), ११ रुद्र (प्राण व परिवर्तन), ८ वसु (अग्नि, जल, पृथ्वी, वायु आदि तत्त्व), और २ अश्विनीकुमार (वैद्य)। जब मनुष्य यज्ञ द्वारा हवि प्रदान करता है, तो देवता प्रसन्न होकर वर्षा, अन्न और आरोग्य प्रदान करते हैं।</p>\n\n      <h3>पारस्परिक सह-अस्तित्व का उपदेश</h3>\n      <p>भगवद्गीता के अनुसार मनुष्य और प्रकृति (देवगण) का संबंध परस्पर पोषण का है। जब मनुष्य प्रकृति का सम्मान करता है, तभी संसार में सुख और समृद्धि बनी रहती है।</p>\n    "},{"id":"indra","title":"Indra","sanskrit":"इन्द्र (सुरेश)","category":"lineage","epoch":"Sovereign of Heaven","tier":9,"parentId":"devas","x":20,"y":-400,"z":720,"symbol3D":"chakra","image":"assets/images/indra.jpg","quote":"Vajra-hasta — The wielder of the thunderbolt forged from Dadhichi's bones","summary":"King of the Devas, lord of the celestial realm Amaravati, wielder of the thunderbolt (Vajra).","content":"\n      <h3>The Throne of Heaven & The Threat of Vritra</h3>\n      <p>Indra represents the executive power of heaven (Svarga). The title is a c
